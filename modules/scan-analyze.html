/** 랜드마크별 표본 누적(acc 형태: index → [{x,y,z}])을 중앙값으로 융합한다. USED 전부가 채워지지
 *  않으면(그 부분집합에서 결측 랜드마크가 있으면) null — 민감도 검사(rot10/rot15)에서 재사용. */
function fuseSubset(accObj, USED){
  const bp=[];
  for(const i of USED){
    const arr=accObj[i];
    if(!arr||!arr.length) return null;
    bp[i]={x:median(arr.map(p=>p.x)), y:median(arr.map(p=>p.y)), z:median(arr.map(p=>p.z))};
  }
  return bp;
}

let engine=null;
async function initEngine(){
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  engine=await FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"IMAGE", numFaces:1, outputFaceBlendshapes:false
  });

}

/** 파일 목록을 세션→프레임으로 묶는다 */
function groupSessions(files){
  const g={};
  for(const f of files){
    const parts=f.webkitRelativePath.split("/");
    const dir=parts[parts.length-2], name=parts[parts.length-1];
    if(!/^C\d_\d+$/.test(dir)) continue;
    (g[dir] ||= {key:dir, frames:{}, session:null});
    if(name==="session.json") g[dir].session=f;
    else {
      const m=name.match(/^f(\d{3})(_rgb\.jpg|_depth\.bin|\.json)$/);
      if(!m) continue;
      const seq=+m[1];
      (g[dir].frames[seq] ||= {seq});
      if(m[2]==="_rgb.jpg") g[dir].frames[seq].rgb=f;
      else if(m[2]==="_depth.bin") g[dir].frames[seq].depth=f;
      else g[dir].frames[seq].meta=f;
    }
  }
  return g;
}

async function fileToImage(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const out={img, W:img.naturalWidth, H:img.naturalHeight};
  return out;
}

// ── 4×4 행렬 (열 우선 16개 배열, Swift simd와 동일 배치) ──────────────
const M = {
  /** m[col][row] 접근 */
  at:(m,c,r)=>m[c*4+r],
  mul:(a,b)=>{ const o=new Array(16).fill(0);
    for(let c=0;c<4;c++) for(let r=0;r<4;r++){ let s=0;
      for(let k=0;k<4;k++) s+=M.at(a,k,r)*M.at(b,c,k);
      o[c*4+r]=s; } return o; },
  /** 강체변환(회전+평행이동) 전용 역행렬 */
  invRigid:(m)=>{
    const R=[[M.at(m,0,0),M.at(m,1,0),M.at(m,2,0)],
             [M.at(m,0,1),M.at(m,1,1),M.at(m,2,1)],
             [M.at(m,0,2),M.at(m,1,2),M.at(m,2,2)]];
    const t=[M.at(m,3,0),M.at(m,3,1),M.at(m,3,2)];
    // R^T
    const Rt=[[R[0][0],R[1][0],R[2][0]],[R[0][1],R[1][1],R[2][1]],[R[0][2],R[1][2],R[2][2]]];
    const nt=[-(Rt[0][0]*t[0]+Rt[0][1]*t[1]+Rt[0][2]*t[2]),
              -(Rt[1][0]*t[0]+Rt[1][1]*t[1]+Rt[1][2]*t[2]),
              -(Rt[2][0]*t[0]+Rt[2][1]*t[1]+Rt[2][2]*t[2])];
    return [Rt[0][0],Rt[1][0],Rt[2][0],0,
            Rt[0][1],Rt[1][1],Rt[2][1],0,
            Rt[0][2],Rt[1][2],Rt[2][2],0,
            nt[0],nt[1],nt[2],1];
  },
  /** 점(mm) 변환. 행렬의 평행이동은 미터 단위이므로 1000배 보정 */
  applyMM:(m,p)=>({
    x:M.at(m,0,0)*p.x+M.at(m,1,0)*p.y+M.at(m,2,0)*p.z+M.at(m,3,0)*1000,
    y:M.at(m,0,1)*p.x+M.at(m,1,1)*p.y+M.at(m,2,1)*p.z+M.at(m,3,1)*1000,
    z:M.at(m,0,2)*p.x+M.at(m,1,2)*p.y+M.at(m,2,2)*p.z+M.at(m,3,2)*1000
  })
};

/** unproject()가 돌려주는 pCam은 "세로(portrait) 이미지 축" 관례(x=오른쪽,y=아래,z=전방)다.
 *  cameraTransform(ARKit 카메라 로컬 축)은 원본 가로(landscape) 카메라 기준이며 방향도 다르다
 *  (x=가로 오른쪽, y=위, z=후방/뷰어 쪽 — 카메라가 -Z를 바라보는 우수좌표계).
 *  unproject 주석의 도출식(x_out=-Y_land, y_out=X_land, z_out=z)을 역으로 풀면
 *  X_land=y_out, Y_land=-x_out, z=z_out 이므로 ARKit 로컬 축으로는
 *  x_ar=X_land=y_out, y_ar=-Y_land=x_out, z_ar=-z=−z_out. 즉 x·y를 맞바꾸고 z 부호를 뒤집는다.
 *  실측 검증(Step 4): 이 변환 적용 전에는 융합 faceWmm이 130~158mm로 정면 단독(150~163mm)보다
 *  체계적으로 작고 세션 간 편차도 컸다(회전 프레임이 어긋난 방향으로 당김) — 축 불일치의 전형적 증상.
 *  적용 후 융합값이 정면 단독·M1 스냅샷(155~165mm) 근방으로 수렴함을 확인했다(보고서 참조). */
function toARKitCamAxes(pCam){
  return { x:pCam.y, y:pCam.x, z:-pCam.z };
}

/** 카메라 좌표(mm, unproject portrait 축) → 얼굴 기준 좌표(mm) */
function toFaceLocal(pCam, faceTransform, cameraTransform){
  const pAr=toARKitCamAxes(pCam);
  const faceInv=M.invRigid(faceTransform);
  const camToFace=M.mul(faceInv, cameraTransform);
  return M.applyMM(camToFace, pAr);
}

async function loadDepth(file){ return new Float32Array(await file.arrayBuffer()); }

/** 5×5 창의 깊이 표준편차(mm). 실루엣 경계면 값이 크다 */
function localSpreadMM(depth, dW, dH, px, py, rgbW, rgbH){
  const dx=Math.round(px*dW/rgbW), dy=Math.round(py*dH/rgbH);
  const v=[];
  for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++){
    const x=dx+i, y=dy+j;
    if(x<0||y<0||x>=dW||y>=dH) continue;
    const d=depth[y*dW+x];
    if(d>0.05 && d<2.0) v.push(d*1000);
  }
  if(v.length<5) return Infinity;
  const m=v.reduce((s,a)=>s+a,0)/v.length;
  return Math.sqrt(v.reduce((s,a)=>s+(a-m)**2,0)/v.length);
}

const median=a=>{ const s=[...a].sort((x,y)=>x-y); return s.length%2 ? s[s.length>>1] : (s[s.length/2-1]+s[s.length/2])/2; };

/** captures/<C>_<n>/ 형태의 스냅샷 세트를 읽어 2D·3D 지표를 만든다 (M1과 동일 절차).
 *  ⚠ 여기서는 toARKitCamAxes 보정을 적용하지 않는다 — 스냅샷은 프레임이 1장뿐이라 여러 프레임을
 *  얼굴기준좌표로 합칠 필요가 없고, M1의 결과(2D 대비 비율)도 이 좌표계(raw unproject 출력)로
 *  이미 산출됐다. 축 보정은 scans/ 세션처럼 서로 다른 카메라 자세의 프레임을 합칠 때만 필요하다. */
async function loadSnapshotBaseline(files){
  const g={};
  for(const f of files){
    const parts=f.webkitRelativePath.split("/");
    const dir=parts[parts.length-2], name=parts[parts.length-1];
    if(!/^C\d_\d+$/.test(dir)) continue;
    if(!["rgb.jpg","depth.bin","meta.json"].includes(name)) continue;
    (g[dir] ||= {key:dir});
    g[dir][name==="rgb.jpg"?"rgb":name==="depth.bin"?"depth":"meta"]=f;
  }
  const USED=usedLandmarkIndices();
  // Task7 추가: 코끝(1)도 함께 수집(돌출도 후보지표용). shapeMetrics 완료판정은 여전히 USED 기준.
  const LOOP_LM=[...new Set([...USED, ...PROTRUSION_LM])];
  for(const k of Object.keys(g).sort()){
    const s=g[k];
    if(!s.rgb||!s.meta||!s.depth) continue;
    const meta=JSON.parse(await s.meta.text());
    const {img,W,H}=await fileToImage(s.rgb);
    const res=engine.detect(img);
    if(!res.faceLandmarks?.length) continue;
    const lm=res.faceLandmarks[0];
    // 2D
    const p2=lm.map(p=>({x:p.x*W,y:p.y*H,z:0}));
    const fw2=Math.hypot(p2[454].x-p2[234].x, p2[454].y-p2[234].y);
    // 3D 스냅샷 — raw unproject 출력 그대로(축 보정 없음, 위 주석 참조)
    const depth=await loadDepth(s.depth);
    const {depthW:dW,depthH:dH,intrinsics:K}=meta;
    const p3=[]; let miss=0;
    for(const i of LOOP_LM){
      const hit=depthAtExpanding(depth,dW,dH,lm[i].x*W,lm[i].y*H,W,H);
      if(!hit){ if(USED.includes(i)) miss++; continue; }
      p3[i]=unproject(lm[i].x*W,lm[i].y*H,hit.z,K,W,H);
    }
    const rec={key:k, condition:k.split("_")[0], m2d:shapeMetrics(p2,fw2,"2d")};
    if(!miss){
      const fw3=D(p3[234],p3[454]);
      rec.m3dSnap=shapeMetrics(p3, fw3, "3d");
      rec.protrusionSnap=protrusionCandidates(p3, fw3);
    }
    window.__base.sets.push(rec);
  }
  log(`기준선 로드 — ${window.__base.sets.length}세트(3D 산출 ${window.__base.sets.filter(s=>s.m3dSnap).length})`);
}

/** 카드 검증: 사용자가 카드 두 모서리를 클릭하면 그 두 점의 3D 거리를 mm로 출력한다.
 *  ISO/IEC 7810 ID-1 = 85.60 × 53.98 mm. 오차 3% 이내면 기준자로 사용 가능(스펙 §5).
 *  좌표(p1,p2)는 세로(portrait) RGB 이미지 픽셀 좌표(x,y) — 원본 f{seq}_rgb.jpg 기준. */
window.measureCard = async function(sessionKey, seq, p1, p2){
  const s=window.__scanRaw?.[sessionKey]?.[seq];
  if(!s) return "해당 프레임 원본이 없습니다 — 카드 세션을 먼저 로드하세요";
  const {depth,dW,dH,K,W,H}=s;
  const q=[p1,p2].map(p=>{
    const hit=depthAtExpanding(depth,dW,dH,p.x,p.y,W,H);
    return hit ? unproject(p.x,p.y,hit.z,K,W,H) : null;
  });
  if(q.some(v=>!v)) return "지정한 점에서 깊이를 못 읽었습니다";
  const mm=D(q[0],q[1]);
  return {mm:+mm.toFixed(1), 장변오차pct:+((mm-85.60)/85.60*100).toFixed(1), 단변오차pct:+((mm-53.98)/53.98*100).toFixed(1)};
};

// ── Task7 Step2: 3방식 비교 집계 ────────────────────────────────────────
const METRICS=["jaw_angular_deg","chin_angle_deg","brow_arch_deg","face_HW","mouth_w","nose_w","jaw_w",
  "temple_w","interocular","eye_len","eye_open","brow_eye_gap","lip_upper","lip_lower","lip_ul_ratio",
  "eye_angle","mouth_corner","line_score"];
/** M1에서 진 5개 — 이번 주 기준 (스펙 §6) */
const TARGET=["temple_w","jaw_w","jaw_angular_deg","eye_open","lip_lower"];
/** M1에서 이긴 3개 — 회귀 방지 대상 */
const GUARD=["line_score","brow_arch_deg","mouth_corner"];

const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(v=>(v-m)**2)));};

/** 조건별 평균들의 변동 = 조건 간 변동 (M1과 동일 정의) */
function betweenCV(records, pick, key, unit){
  const byCond={};
  for(const r of records){ const v=pick(r); if(v==null) continue; (byCond[r.condition] ||= []).push(v[key]); }
  const means=Object.values(byCond).map(a=>mean(a));
  if(means.length<2) return null;
  const s=sd(means), m=mean(means);
  return unit==="abs" ? s : (Math.abs(m)<1e-3 ? null : s/Math.abs(m)*100);
}
function unitFor(...groups){
  return groups.some(g=>g!=null && Math.abs(mean(g))<1e-3) ? "abs" : "%";
}

function compare3(){
  const base=window.__base.sets, scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession);
  const rows=METRICS.map(k=>{
    const v2=base.map(r=>r.m2d?.[k]).filter(v=>v!=null);
    const vS=base.map(r=>r.m3dSnap?.[k]).filter(v=>v!=null);
    const vC=scan.map(r=>r.m3dScan[k]).filter(v=>v!=null);
    const unit=unitFor(v2,vS,vC);
    const c2=betweenCV(base, r=>r.m2d, k, unit);
    const cS=betweenCV(base, r=>r.m3dSnap, k, unit);
    const cC=betweenCV(scan, r=>r.m3dScan, k, unit);
    const rSnap=(c2&&cS!=null)?cS/c2:null;
    const rScan=(c2&&cC!=null)?cC/c2:null;
    return {metric:k, unit, c2, cS, cC, rSnap, rScan,
            target:TARGET.includes(k), guard:GUARD.includes(k)};
  });
  const tg=rows.filter(r=>r.target&&r.rScan!=null);
  const gd=rows.filter(r=>r.guard&&r.rScan!=null);
  return {rows,
    targetAllBelow1: tg.length===TARGET.length && tg.every(r=>r.rScan<1.0),
    targetMajorityBelowHalf: tg.filter(r=>r.rScan<=0.5).length*2 >= TARGET.length,
    guardHeld: gd.length===GUARD.length && gd.every(r=>r.rScan<=0.5),
    nScan:scan.length, nBase:base.length};
}

// ── 추가요구 §1 → 리뷰 A-2로 철회·재산출: 실측 거리(lensDistanceCm) 기준 안정성 ─────────────
/** 리뷰 지적: 조건 라벨(C1=40cm·C2=25cm·C3=50cm)이 실제 촬영거리와 어긋난다 — 예를 들어 C2_4는
 *  전 프레임 lensDistanceCm≈55cm인데 "C2(25cm)"로 분류돼 있었다. 조건평균 실거리 실측:
 *  C1≈37·C2≈36·C3≈52·C4≈50·C5≈43cm — C1과 C2가 사실상 같은 거리다. 라벨을 버리고
 *  세션별 lensDistanceCm 평균(s.lensDistanceCmAvg, 전 프레임 평균)으로 거리 구간을 다시 묶는다. */
const DIST_BINS=[{key:"~30cm", test:v=>v<30}, {key:"30~45cm", test:v=>v>=30&&v<45}, {key:"45cm~", test:v=>v>=45}];
const DIST_MIN_N=3;   // 이 미만이면 그 구간은 "표본부족"으로 표시하고 순위 계산에서 뺀다
function distanceStability(){
  const scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.lensDistanceCmAvg!=null);
  const withBin=scan.map(s=>({s, bin:DIST_BINS.find(b=>b.test(s.lensDistanceCmAvg))?.key}));
  const binN={}; for(const b of DIST_BINS) binN[b.key]=withBin.filter(w=>w.bin===b.key).length;
  const usableBins=DIST_BINS.map(b=>b.key).filter(k=>binN[k]>=DIST_MIN_N);
  const rows=METRICS.map(k=>{
    const row={metric:k};
    for(const b of DIST_BINS){
      const vals=withBin.filter(w=>w.bin===b.key).map(w=>w.s.m3dScan[k]).filter(v=>v!=null);
      if(vals.length<2){ row[b.key]=null; continue; }
      const m=mean(vals), s=sd(vals);
      row[b.key]=Math.abs(m)<1e-3 ? s : s/Math.abs(m)*100;
    }
    return row;
  });
  let avgRank=null, best=null, rankNote;
  if(usableBins.length>=2){
    const rankSum={}, rankCount={};
    for(const b of usableBins){ rankSum[b]=0; rankCount[b]=0; }
    for(const r of rows){
      const entries=usableBins.map(b=>({b,v:r[b]})).filter(e=>e.v!=null);
      if(entries.length<2) continue;
      entries.sort((a,b)=>a.v-b.v);
      entries.forEach((e,idx)=>{ rankSum[e.b]+=idx+1; rankCount[e.b]++; });
    }
    avgRank={};
    for(const b of usableBins) avgRank[b]= rankCount[b] ? +(rankSum[b]/rankCount[b]).toFixed(2) : null;
    const ranked=usableBins.filter(b=>avgRank[b]!=null).sort((a,b)=>avgRank[a]-avgRank[b]);
    best=ranked[0]??null;
    rankNote = usableBins.length<DIST_BINS.length
      ? `구간 ${DIST_BINS.map(b=>b.key).filter(k=>!usableBins.includes(k)).join(",")}은 세션 ${DIST_MIN_N}개 미만이라 표본부족 — 순위에서 제외`
      : null;
  } else {
    rankNote = "표본이 충분한 구간이 2개 미만 — 순위 판정 보류";
  }
  return {rows, avgRank, best, binN, usableBins, rankNote, nTotal:scan.length};
}

// ── 이론 §3-2: 정중선 단면 돌출도 후보지표 요약(3D스냅샷=M1 captures/ vs 3D스캔=scans/) ───────
const PROTRUSION_KEYS_MAIN=["lip_protrusion_upper","lip_protrusion_lower","chin_protrusion","nose_projection","e_line_dev"];
const PROTRUSION_KEYS_MM=PROTRUSION_KEYS_MAIN.map(k=>k+"_mm");
/** 기준면(현 vs 평면) · 턱 최전방점(탐색 vs 152고정) 비교용 필드. */
const PROTRUSION_KEYS_COMPARE=["chin_protrusion","chin_protrusion_fixed152","chin_protrusion_plane","chin_protrusion_fixed152_plane",
  "lip_protrusion_upper_plane","lip_protrusion_lower_plane","nose_projection_plane","e_line_dev_fixed152"];

function protrusionRows(keys, decimals){
  const snapRows=window.__base.sets.map(r=>r.protrusionSnap).filter(Boolean);
  const scanRows=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession).map(s=>s.protrusionScan).filter(Boolean);
  return keys.map(k=>{
    const vs=snapRows.map(r=>r[k]).filter(v=>v!=null);
    const vc=scanRows.map(r=>r[k]).filter(v=>v!=null);
    return {metric:k,
            snapMean:vs.length?+mean(vs).toFixed(decimals):null, snapSd:vs.length?+sd(vs).toFixed(decimals):null, nSnap:vs.length,
            scanMean:vc.length?+mean(vc).toFixed(decimals):null, scanSd:vc.length?+sd(vc).toFixed(decimals):null, nScan:vc.length};
  });
}
function protrusionSummary(){ return protrusionRows(PROTRUSION_KEYS_MAIN, 4); }
function protrusionSummaryMM(){ return protrusionRows(PROTRUSION_KEYS_MM, 2); }
function protrusionCompare(){ return protrusionRows(PROTRUSION_KEYS_COMPARE, 4); }
/** 턱 최전방점 탐색이 실제로 몇 번 152를 골랐고, 몇 번 다른 점을 골랐는지(스캔 3D스캔 기준). */
function chinApexHistogram(){
  const scanRows=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession).map(s=>s.protrusionScan).filter(Boolean);
  const hist={};
  for(const r of scanRows){ const idx=r.chin_apex_index; if(idx==null) continue; hist[idx]=(hist[idx]||0)+1; }
  return {hist, n:scanRows.length};
}

// ── 대표 재지시(방법론 수정): 동일 세션 3방식 비교 — 주 판정 ────────────────────────────────
/** compare3()는 2D·3D스냅샷(captures/, 다른 날 촬영)과 3D스캔(scans/)을 비교해 "방식 차이"와
 *  "촬영 세트가 다른 차이"(C4 정의 자체가 다름 등)가 섞여 있었다. 이 함수는 스캔 세션 14개 각각의
 *  첫 front 프레임(frontSnapshot)에서 2D·3D스냅샷을 뽑아 3D스캔(m3dScan)과 나란히 비교한다 —
 *  세 방식이 전부 같은 세션·같은 조건 집합(C1×2·C2×3·C3×3·C4×3·C5×3)에서 나온다. 이게 주 판정이다. */
function compareSameSession(){
  const scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.frontSnapshot);
  const rows=METRICS.map(k=>{
    const v2=scan.map(r=>r.frontSnapshot.m2d?.[k]).filter(v=>v!=null);
    const vS=scan.map(r=>r.frontSnapshot.m3dSnap?.[k]).filter(v=>v!=null);
    const vC=scan.map(r=>r.m3dScan[k]).filter(v=>v!=null);
    const unit=unitFor(v2,vS,vC);
    const c2=betweenCV(scan, r=>r.frontSnapshot.m2d, k, unit);
    const cS=betweenCV(scan, r=>r.frontSnapshot.m3dSnap, k, unit);
    const cC=betweenCV(scan, r=>r.m3dScan, k, unit);
    const rSnap=(c2&&cS!=null)?cS/c2:null;
    const rScan=(c2&&cC!=null)?cC/c2:null;
    return {metric:k, unit, c2, cS, cC, rSnap, rScan,
            target:TARGET.includes(k), guard:GUARD.includes(k)};
  });
  const tg=rows.filter(r=>r.target&&r.rScan!=null);
  const gd=rows.filter(r=>r.guard&&r.rScan!=null);
  return {rows,
    targetAllBelow1: tg.length===TARGET.length && tg.every(r=>r.rScan<1.0),
    targetMajorityBelowHalf: tg.filter(r=>r.rScan<=0.5).length*2 >= TARGET.length,
    guardHeld: gd.length===GUARD.length && gd.every(r=>r.rScan<=0.5),
    n:scan.length};
}

// ── 대표 재지시: 회전각 제한 민감도 검사 ──────────────────────────────────────────────────
/** TARGET 5지표에 대해 "2D 대비 조건 간 변동 비율"을 4가지 융합 범위(전체/rot10/rot15/front전용)로
 *  각각 계산한다. 2D 기준(c2)은 compareSameSession과 동일하게 frontSnapshot.m2d를 쓴다 — 비교
 *  분모를 고정해야 각도 제한 효과만 분리해서 볼 수 있다. 각도를 제한할수록 비율이 낮아지면(=1에
 *  가까워지거나 밑돌면) 회전 프레임의 랜드마크가 잡음원이라는 뜻이다. */
function sensitivityAnalysis(cmpSameRows){
  const scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.frontSnapshot && s.rotSensitivity);
  const variants=[
    {key:"full", label:"전체 프레임(현재)", pick:r=>r.rotSensitivity.full},
    {key:"rot10", label:"rotAngleDeg≤10°만", pick:r=>r.rotSensitivity.rot10},
    {key:"rot15", label:"rotAngleDeg≤15°만", pick:r=>r.rotSensitivity.rot15},
    {key:"frontOnly", label:"front 프레임만(대조군)", pick:r=>r.rotSensitivity.frontOnly},
  ];
  const rows=TARGET.map(k=>{
    const unit=cmpSameRows.find(r=>r.metric===k)?.unit ?? "%";
    const out={metric:k, unit};
    for(const v of variants){
      // 리뷰 A-1 — 분자(cX)와 분모(c2)를 반드시 같은 세션 부분집합으로 계산한다. 예전엔 c2를
      // 14세션 고정으로 써서 frontOnly(10세션)와 분모 세션구성이 안 맞았다("front전용 0.48 통과"는
      // 이 불일치 때문에 과장된 값이었다 — 분모를 맞추면 0.59로 미달).
      const recs=scan.filter(r=>v.pick(r)!=null);
      const conds=[...new Set(recs.map(r=>r.condition))].sort();
      const c2sub = recs.length>=2 ? betweenCV(recs, r=>r.frontSnapshot.m2d, k, unit) : null;
      const cX = recs.length>=2 ? betweenCV(recs, v.pick, k, unit) : null;
      out[v.key]= (c2sub&&cX!=null)? +(cX/c2sub).toFixed(2) : null;
      out[v.key+"_n"]=recs.length;
      out[v.key+"_conds"]=conds; // 조건 수·구성 — 세션이 빠지면서 조건 자체가 통째로 사라질 수 있음
    }
    return out;
  });
  return {rows, variants, nTotal:scan.length};
}

// ── 리뷰 B: 판정 경계 간격 대비 변동폭 — "이 차이가 실제로 판정을 뒤집는가" ──────────────────
/** 지적: temple_w의 2D 조건 간 CV가 0.25%다 — 거의 안 움직이는 값으로 나누니 절대로는 ±0.012
 *  수준의 흔들림이 "4.89배 나쁨"으로 과장된다. 비율이 아니라 photo-module.html의 실제 판정
 *  경계(SB 상수)와 견줘 "밴드 간격의 1/3 미만이면 판정을 못 뒤집는다"는 절대 기준을 추가한다.
 *  SB는 photo-module.html에서 fetch로 읽는다(그 파일은 수정하지 않음, 값만 참조). */
let _SB=null;
async function loadBandDefs(){
  if(_SB) return _SB;
  const txt=await (await fetch("./photo-module.html")).text();
  const m=txt.match(/const SB=\{([^}]*)\};/);
  if(!m) throw new Error("photo-module.html에서 SB 상수를 찾지 못함");
  const obj={};
  for(const pair of m[1].split(",")){
    const [k,v]=pair.split(":").map(s=>s.trim());
    if(k) obj[k]=+v;
  }
  _SB=obj;
  return obj;
}
/** 지표별 "인접 판정 경계 간격" — photo-module.html의 분류 컷포인트 사이 거리.
 *  jaw_angular_deg: SB.jawLo~jawHi(곡선↔매끈한직선↔각) · brow_arch_deg: SB.archLo~archHi(일자↔중간↔아치)
 *  mouth_corner: SB.eyeAng의 ±경계(하향↔수평↔상향, eye_angle과 동일 상수 재사용 — 캐비어트 §D 참조).
 *  jaw_w·temple_w·eye_open·lip_lower·line_score는 photo-module.html에 판정 경계 자체가 없다(밴드 미정의). */
function bandGapFor(metric, SB){
  if(metric==="jaw_angular_deg") return {gap:SB.jawHi-SB.jawLo, note:`SB.jawLo${SB.jawLo}~jawHi${SB.jawHi}`};
  if(metric==="brow_arch_deg") return {gap:SB.archHi-SB.archLo, note:`SB.archLo${SB.archLo}~archHi${SB.archHi}`};
  if(metric==="mouth_corner") return {gap:SB.eyeAng*2, note:`SB.eyeAng ±${SB.eyeAng} (eye_angle과 동일 상수)`};
  return null;
}
async function bandWidthAnalysis(){
  const SB=await loadBandDefs();
  const scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.frontSnapshot);
  const METHODS=[{key:"m2d", label:"2D", pick:r=>r.frontSnapshot.m2d},
                  {key:"m3dSnap", label:"3D 스냅샷", pick:r=>r.frontSnapshot.m3dSnap},
                  {key:"m3dScan", label:"3D 스캔", pick:r=>r.m3dScan}];
  const rows=[...TARGET, ...GUARD].map(k=>{
    const def=bandGapFor(k, SB);
    const out={metric:k, target:TARGET.includes(k), guard:GUARD.includes(k), gap:def?.gap??null, note:def?.note??null,
                third: def? +(def.gap/3).toFixed(3) : null};
    for(const m of METHODS){
      const abs=betweenCV(scan, m.pick, k, "abs");
      out[m.key+"_abs"]=abs==null?null:+abs.toFixed(4);
      out[m.key+"_verdict"]= !def ? "밴드 미정의" : (abs==null ? "-" : (abs<def.gap/3 ? "임계이하(안정)" : "임계초과(흔들림)"));
    }
    return out;
  });
  return {rows, methods:METHODS};
}

// ── 리뷰 C: leave-one-out — 결론이 세션 하나에 좌우되는가 ──────────────────────────────────
/** TARGET(5)+GUARD(3) 8지표 각각에 대해, 14세션 중 1개씩 빼고 재계산한 "스캔 비율"(cC/c2, 동일
 *  세션 비교와 같은 정의)의 최소~최대 범위를 본다. 그 범위가 판정 문턱(TARGET=1.0·GUARD=0.5)을
 *  걸치면(포함하면) 그 지표의 판정은 세션 하나에 좌우되는 "불안정"으로 표시하고 근거로 안 쓴다. */
function looRange(scan, key, unit){
  const ratios=[];
  for(let i=0;i<scan.length;i++){
    const subset=scan.filter((_,idx)=>idx!==i);
    const c2=betweenCV(subset, r=>r.frontSnapshot.m2d, key, unit);
    const cC=betweenCV(subset, r=>r.m3dScan, key, unit);
    if(c2!=null && cC!=null) ratios.push(cC/c2);
  }
  if(!ratios.length) return null;
  return {min:+Math.min(...ratios).toFixed(2), max:+Math.max(...ratios).toFixed(2), n:ratios.length};
}
function looAnalysis(cmpSameRows){
  const scan=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.frontSnapshot);
  const items=[...TARGET.map(k=>({metric:k,kind:"target",thr:1.0})), ...GUARD.map(k=>({metric:k,kind:"guard",thr:0.5}))];
  return items.map(it=>{
    const unit=cmpSameRows.find(r=>r.metric===it.metric)?.unit ?? "%";
    const range=looRange(scan, it.metric, unit);
    const straddles= range!=null && (range.min-it.thr)*(range.max-it.thr)<=0;
    return {...it, range, unstable:straddles};
  });
}

// ── 리뷰 A-3: brow_arch_deg 세트 단위 원시 CV(조건평균 아님) + 진단 정보 ────────────────────
/** compare3 참고표에서 "captures 3D스냅샷 brow_arch 1.1%라 안정적"이라 썼던 근거를 철회한다 —
 *  그건 betweenCV(조건 평균들의 CV)였는데 captures 조건 그룹 크기가 제각각(C4만 8세트 등)이라
 *  큰 그룹이 노이즈를 눌러 낮게 나온 인공물이었다. 여기서는 조건으로 평균 내지 않고 세트/세션
 *  각각의 원시값에서 직접 CV(=SD/평균×100)를 구한다 — 어느 쪽이 실제로 더 들쭉날쭉한지 보려면
 *  이게 맞는 비교다. */
function rawCV(values){
  if(values.length<2) return null;
  const m=mean(values);
  return Math.abs(m)<1e-3 ? null : sd(values)/Math.abs(m)*100;
}
function browArchDiagnostics(){
  const capturesVals=window.__base.sets.map(s=>s.m3dSnap?.brow_arch_deg).filter(v=>v!=null);
  const scanSessions=window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.frontSnapshot?.m3dSnap);
  const scanVals=scanSessions.map(s=>s.frontSnapshot.m3dSnap.brow_arch_deg);
  const scanValsExclC4_2=scanSessions.filter(s=>s.key!=="C4_2").map(s=>s.frontSnapshot.m3dSnap.brow_arch_deg);
  const lsVals=window.__base.sets.map(s=>s.m3dSnap?.line_score).filter(v=>v!=null);
  const lsSaturated=lsVals.filter(v=>Math.abs(v-0.45)<1e-9).length;
  const c4Meta=scanSessions.filter(s=>s.condition==="C4").map(s=>({key:s.key, ...s.frontMeta}));
  return {
    capturesRawCV: +rawCV(capturesVals)?.toFixed(1), capturesN:capturesVals.length,
    scanFrontRawCV: +rawCV(scanVals)?.toFixed(1), scanFrontN:scanVals.length,
    scanFrontRawCV_exclC4_2: +rawCV(scanValsExclC4_2)?.toFixed(1), scanFrontN_exclC4_2:scanValsExclC4_2.length,
    lsSaturated, lsTotal:lsVals.length,
    c4Meta,
    distByCondition: (()=>{
      const conds={};
      for(const s of window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession && s.lensDistanceCmAvg!=null)){
        (conds[s.condition] ||= []).push(s.lensDistanceCmAvg);
      }
      const out={};
      for(const c of Object.keys(conds).sort()) out[c]=+mean(conds[c]).toFixed(1);
      return out;
    })()
  };
}

$("pick").addEventListener("change", async e=>{
  if(!engine) await initEngine();
  const groups=groupSessions([...e.target.files]);
  // Task7 Step1 — captures/(스냅샷 세트)가 함께 섞여 들어오면 M1 기준선을 같은 페이지에서 재계산한다.
  // captures 파일명(rgb.jpg 등)은 scans 파일명(f001_rgb.jpg 등)과 겹치지 않아 groupSessions에 영향 없다.
  const hasSnapshot=[...e.target.files].some(f=>/\/rgb\.jpg$/.test(f.webkitRelativePath));
  if(hasSnapshot) await loadSnapshotBaseline([...e.target.files]);
  const allKeys=Object.keys(groups).sort();
  const keys=allKeys.filter(k=>SESSION_WHITELIST_ALL.has(k));
  const skipped=allKeys.filter(k=>!SESSION_WHITELIST_ALL.has(k));
  log(`세션 ${allKeys.length}개 발견 — 화이트리스트 ${keys.length}개 처리, ${skipped.length}개 제외`);
  if(skipped.length) log(`제외: ${skipped.join(", ")} (구버전 빌드·축 버그·session.json 없음 — 상단 SESSION_WHITELIST 주석 참조)`);
  const missingFromScans=SESSION_WHITELIST_ALL.size ? [...SESSION_WHITELIST_ALL].filter(k=>!allKeys.includes(k)) : [];
  if(missingFromScans.length) log(`⚠ 화이트리스트에 있으나 scans 폴더에 없음: ${missingFromScans.join(", ")}`);

  window.__scan.sessions=[];
  const USED=usedLandmarkIndices();
  // Task7 추가 — 코끝(1)도 함께 수집(돌출도 후보지표용). 완료판정(missing)·표본통계는 여전히 USED 기준.
  const LOOP_LM=[...new Set([...USED, ...PROTRUSION_LM])];

  for(const k of keys){
    const gsn=groups[k];
    const isCardSession=SESSION_WHITELIST_CARD.includes(k);
    if(!gsn.session){ log(`${k}: session.json 없음 — 건너뜀`); continue; }
    const sessionMeta=JSON.parse(await gsn.session.text());
    const seqs=Object.keys(gsn.frames).map(Number).sort((a,b)=>a-b);
    const acc={};                 // landmarkIndex → [{x,y,z}]  (전체 프레임 융합용)
    const accFront={};            // landmarkIndex → [{x,y,z}]  (정면 프레임만 — Step4 축 검증용 대조군)
    const accBand={};             // Task7 Step3 — |rotAngleDeg| 구간별 표본 누적(각도구간 안정성)
    const accRot10={};            // 대표 재지시 — |rotAngleDeg|<=10° 프레임만의 융합용(민감도 검사)
    const accRot15={};            // 대표 재지시 — |rotAngleDeg|<=15° 프레임만의 융합용(민감도 검사)
    const frontSeqs=[];           // Task7 추가요구 §3 — 정면(front) 프레임 seq 목록(카드 측정 프레임 추천용)
    let frontSnapshot=null;       // 대표 재지시 — 이 세션의 "동일 프레임" 2D·3D스냅샷(첫 front 프레임, 1회만 채움)
    let frontMeta=null;           // 리뷰 A-3 — 첫 front 프레임의 원시 yaw/roll/pitch(진단용, 분류에는 미사용).
                                   // 2026-08-07 필드명 변경(개발팀 요청 task-3) — 옛 세션은 yawDeg 등, 새
                                   // 세션은 yawDeg_deprecated_axisbug 등으로 저장된다(축 규약 오류 값이라는
                                   // 사실은 이름이 뭐든 동일). 아래에서 양쪽 다 읽는다(폴백).
    const distCm=[];              // 리뷰 A-2 — 프레임별 lensDistanceCm(라벨 대신 실측 거리로 재분류)
    let framesUsed=0, samplesTotal=0, dropSpread=0, dropNoDepth=0;

    for(const seq of seqs){
      const fr=gsn.frames[seq];
      if(!fr.rgb||!fr.meta||!fr.depth) continue;
      const meta=JSON.parse(await fr.meta.text());
      const {img,W,H}=await fileToImage(fr.rgb);
      const res=engine.detect(img);
      if(!res.faceLandmarks||!res.faceLandmarks.length){ log(`${k} f${seq}: 얼굴 미검출`); continue; }
      const lm=res.faceLandmarks[0];
      const depth=await loadDepth(fr.depth);
      // 실데이터 필드: yawDeg는 축 오류가 있던 값이라 쓰지 않는다. 각도는 전부 rotAngleDeg(정면 대비
      // 축 무관 회전각) 사용 — commit 00cbdeb 근거. rotAxis는 진단용으로만 남긴다.
      const {depthW:dW, depthH:dH, intrinsics:K, faceTransform:FT, cameraTransform:CT, step, rotAngleDeg, rotAxis,
             lensDistanceCm}=meta;
      // 2026-08-07(개발팀 요청 task-3) — 앱이 yawDeg/pitchDeg/rollDeg를 *_deprecated_axisbug로
      // 개명했다(이론 §2-3: 신뢰 불가 값은 필드명으로 드러나야 함). 기존 촬영 scans/(14세션)는 옛
      // 이름 그대로라 양쪽 다 읽는다 — 폴백은 진단 표시 전용, 분류·판정에는 어차피 안 쓴다.
      const yawDeg = meta.yawDeg ?? meta.yawDeg_deprecated_axisbug;
      const rollDeg = meta.rollDeg ?? meta.rollDeg_deprecated_axisbug;
      const pitchDeg = meta.pitchDeg ?? meta.pitchDeg_deprecated_axisbug;
      // yawDeg·rollDeg·pitchDeg는 분류(각도구간·회전판정)에는 안 쓴다(축 오류 이력) — lensDistanceCm과 함께
      // 진단·보고용 원시값으로만 남긴다(리뷰 A-2·A-3).
      ((window.__scanRaw[k] ||= {})[seq]) = {depth,dW,dH,K,W,H};   // Task7 Step4 — measureCard용 프레임 원본 보존
      if(typeof lensDistanceCm==="number") distCm.push(lensDistanceCm);
      if(step==="front") frontSeqs.push(seq);
      // 대표 재지시 — 같은 세션의 첫 front 프레임에서 2D·3D스냅샷을 뽑는다(사과-사과 비교, M1과 동일하게
      // toARKitCamAxes 미적용). engine.detect()를 다시 부르지 않고 이미 얻은 lm·depth를 그대로 쓴다.
      if(step==="front" && !frontSnapshot){
        frontSnapshot = computeFrontSnapshot(USED, LOOP_LM, lm, W, H, depth, dW, dH, K);
        frontMeta = {yawDeg, rollDeg, pitchDeg, lensDistanceCm};
      }
      framesUsed++;

      for(const i of LOOP_LM){
        const px=lm[i].x*W, py=lm[i].y*H;
        if(USED.includes(i)) samplesTotal++;
        const hit=depthAtExpanding(depth,dW,dH,px,py,W,H);
        if(!hit){ if(USED.includes(i)) dropNoDepth++; continue; }
        if(hit.radius!==1){ if(USED.includes(i)) dropSpread++; continue; }               // 확장탐색분 제외(스펙 §3.2)
        if(localSpreadMM(depth,dW,dH,px,py,W,H)>SPREAD_MM_MAX){ if(USED.includes(i)) dropSpread++; continue; }
        const pCam=unproject(px,py,hit.z,K,W,H);
        const pFace=toFaceLocal(pCam, FT, CT);
        (acc[i] ||= []).push(pFace);
        if(step==="front") (accFront[i] ||= []).push(pFace);
        // Task7 Step3 — 각도구간별 표본도 함께 누적(각도구간 안정성 분석용). yawDeg 대신 rotAngleDeg 사용.
        const band = Math.abs(rotAngleDeg)<10 ? "0-10" : Math.abs(rotAngleDeg)<20 ? "10-20" : "20+";
        ((accBand[band] ||= {})[i] ||= []).push(pFace);
        // 대표 재지시 — 회전각 제한 민감도 검사용 누적(각도가 클수록 랜드마크가 잡음원인지 확인)
        if(Math.abs(rotAngleDeg)<=10) (accRot10[i] ||= []).push(pFace);
        if(Math.abs(rotAngleDeg)<=15) (accRot15[i] ||= []).push(pFace);
      }
    }

    // 랜드마크별 중앙값 융합 (전체 프레임). LOOP_LM엔 돌출도 후보지표 전용 코끝(1)도 포함되지만,
    // 완료판정(missing)은 shapeMetrics가 실제로 쓰는 USED 기준으로만 한다 — 코끝 결측은 세션을 막지 않는다.
    const pts=[]; let missing=[];
    for(const i of LOOP_LM){
      const arr=acc[i]||[];
      if(!arr.length){ if(USED.includes(i)) missing.push(i); continue; }
      pts[i]={x:median(arr.map(p=>p.x)), y:median(arr.map(p=>p.y)), z:median(arr.map(p=>p.z)), n:arr.length};
    }
    // 정면 프레임만의 중앙값 (Step4 대조군 — 별도 깊이 조회 없이 이미 계산된 pFace 재사용)
    const ptsFront=[];
    for(const i of USED){
      const arr=accFront[i]||[];
      if(!arr.length) continue;
      ptsFront[i]={x:median(arr.map(p=>p.x)), y:median(arr.map(p=>p.y)), z:median(arr.map(p=>p.z))};
    }
    let frontOnlyFaceWmm=null;
    if(ptsFront[234] && ptsFront[454]) frontOnlyFaceWmm=+D(ptsFront[234],ptsFront[454]).toFixed(1);

    const s={key:k, condition:k.split("_")[0], index:+k.split("_")[1], isCardSession,
             frontSnapshot,   // 대표 재지시 — 동일 세션 2D·3D스냅샷(주 판정용)
             frontMeta,       // 리뷰 A-3 — 첫 front 프레임 원시 yaw/roll/pitch/lensDistanceCm(진단용, 신구 필드명 폴백 적용됨 — 위 605행 참고)
             lensDistanceCmAvg: distCm.length?+(distCm.reduce((s,v)=>s+v,0)/distCm.length).toFixed(1):null,  // 리뷰 A-2
             stats:{framesUsed, samplesTotal,
                    samplesDropped:dropSpread+dropNoDepth, dropReasons:{spread:dropSpread, noDepth:dropNoDepth},
                    dropSpread, dropNoDepth,
                    missingLandmarks:missing.slice(0,10), missingCount:missing.length}};
    if(missing.length){
      s.m3dScan=null; s.skipReason=`결측 랜드마크 ${missing.length}개`;
      log(`${k}: ${s.skipReason} — 제외`);
    } else {
      const faceWmm=D(pts[234],pts[454]);
      s.faceWmm=+faceWmm.toFixed(1);
      s.frontOnlyFaceWmm=frontOnlyFaceWmm;
      s.m3dScan=shapeMetrics(pts,faceWmm,"3d_scan");
      s.samplesPerLandmark=+(USED.reduce((t,i)=>t+(acc[i]?.length||0),0)/USED.length).toFixed(1);
      s.pts=pts;
      s.frontSeqs=frontSeqs;
      s.protrusionScan=protrusionCandidates(pts, faceWmm);   // Task7 추가요구 §2 — 판정에는 미사용
      // 대표 재지시 — 회전각 제한 민감도 검사: 전체/rot10/rot15/front전용(같은 fusion 파이프라인) 4가지로
      // 재융합했을 때 결과가 어떻게 변하는지 비교(큰 각도 프레임이 잡음원인지 확인).
      s.rotSensitivity={full:s.m3dScan};
      if(USED.every(i=>ptsFront[i])) s.rotSensitivity.frontOnly=shapeMetrics(ptsFront, D(ptsFront[234],ptsFront[454]), "3d_scan");
      const bpRot10=fuseSubset(accRot10, USED);
      if(bpRot10) s.rotSensitivity.rot10=shapeMetrics(bpRot10, D(bpRot10[234],bpRot10[454]), "3d_scan");
      const bpRot15=fuseSubset(accRot15, USED);
      if(bpRot15) s.rotSensitivity.rot15=shapeMetrics(bpRot15, D(bpRot15[234],bpRot15[454]), "3d_scan");
      log(`${k}${isCardSession?" [카드검증]":""}: 프레임 ${framesUsed} · 점당 평균 ${s.samplesPerLandmark}표본 · faceWmm ${s.faceWmm} (정면만 ${frontOnlyFaceWmm ?? "N/A"})`);
    }
    // Task7 Step3 — 각도구간(|rotAngleDeg|)별 재융합. USED 랜드마크가 전부 있는 구간만 채택.
    s.yawBands={};
    for(const b of ["0-10","10-20","20+"]){
      const a=accBand[b]; if(!a) continue;
      const bp=[]; let ok=true;
      for(const i of USED){ if(!a[i]?.length){ ok=false; break; }
        bp[i]={x:median(a[i].map(p=>p.x)), y:median(a[i].map(p=>p.y)), z:median(a[i].map(p=>p.z))}; }
      if(!ok) continue;
      s.yawBands[b]=shapeMetrics(bp, D(bp[234],bp[454]), "3d_scan");
    }
    window.__scan.sessions.push(s);
  }
  log(`융합 완료 — ${window.__scan.sessions.filter(s=>s.m3dScan).length}/${keys.length} 세션 (본분석 ${window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession).length}개 · 카드검증 ${window.__scan.sessions.filter(s=>s.m3dScan && s.isCardSession).length}개)`);
  window.dispatchEvent(new Event("scan:loaded"));
});

// ── Task7 Step5: 렌더 ────────────────────────────────────────────────
function fmt(v,u){ return v==null?"-":(u==="%"?v.toFixed(1)+"%":v.toFixed(4)); }

/** 리뷰 D — eye_angle·mouth_corner는 shapeMetrics에서 .y 성분을 직접 쓰는 방향성 지표라 강체변환에
 *  불변이 아니다(거리·각도류는 회전·평행이동해도 안 변하지만 이 둘은 좌표축 자체가 바뀌면 값도 바뀐다).
 *  3D스캔만 얼굴기준축(toFaceLocal)으로 정규화돼 있고 2D(픽셀축)·3D스냅샷(원시 카메라축)은 축이 다르므로,
 *  이 두 지표는 "세 방식이 물리적으로 같은 것을 재고 있다"는 전제 자체가 약하다. */
const AXIS_CAVEAT_METRICS=new Set(["eye_angle","mouth_corner"]);
function metricLabel(k, mark){ return `${k}${mark}${AXIS_CAVEAT_METRICS.has(k)?' <span title="세 방식의 좌표축이 서로 달라 강체변환 불변이 아님(리뷰 D)">△</span>':''}`; }

async function render(){
  const cmp=compare3();            // 참고 — captures/(다른 날, C4 정의 다름) 기준선과의 비교
  const cmpSame=compareSameSession();  // 주 판정 — 같은 스캔세션의 front 프레임에서 뽑은 2D·3D스냅샷과 비교
  let h=`<h2>세션 현황</h2><table><tr><th>세션</th><th>프레임</th><th>점당 표본</th><th>faceWmm</th><th>lensDistanceCm 평균</th><th>제외</th></tr>`;
  for(const s of window.__scan.sessions){
    h+=`<tr><td>${s.key}</td><td>${s.stats.framesUsed}</td><td>${s.samplesPerLandmark??"-"}</td>
        <td>${s.faceWmm??"-"}</td><td>${s.lensDistanceCmAvg??"-"}</td><td>${s.skipReason??""}</td></tr>`;
  }
  h+=`</table>`;

  h+=`<h2>3방식 비교 — 주 판정 (동일 세션, n=${cmpSame.n}/14)</h2>
      <p><b>세 방식 전부 같은 스캔 세션의 첫 front 프레임(2D·3D스냅샷)과 그 세션의 전체 프레임 융합(3D스캔)에서
      나온다</b> — 조건 구성이 C1×2·C2×3·C3×3·C4×3·C5×3으로 완전히 동일해 "방식 차이"만 본다(대표 지시로
      아래 §참고 표와 분리). 비율은 2D 대비. <b>작을수록 안정.</b> ★=이번 주 기준(M1 실패분) · ☆=회귀 방지 대상 ·
      △=강체변환 불변 아님(리뷰 D, 아래 참조)</p>
      <table><tr><th>지표</th><th>2D</th><th>3D 스냅샷</th><th>3D 스캔</th><th>스냅샷 비율</th><th>스캔 비율</th></tr>`;
  for(const r of cmpSame.rows){
    const mark=r.target?" ★":r.guard?" ☆":"";
    const cls=r.rScan==null?"":r.rScan<=0.5?"ok":r.rScan<1?"warn":"bad";
    h+=`<tr><td>${metricLabel(r.metric,mark)}</td><td>${fmt(r.c2,r.unit)}</td><td>${fmt(r.cS,r.unit)}</td>
        <td>${fmt(r.cC,r.unit)}</td><td>${r.rSnap?.toFixed(2)??"-"}</td>
        <td class="${cls}">${r.rScan?.toFixed(2)??"-"}</td></tr>`;
  }
  h+=`</table>`;

  // ── 리뷰 C: leave-one-out — 판정이 세션 하나에 좌우되는가 ──────────────────
  const loo=looAnalysis(cmpSame.rows);
  h+=`<h2>Leave-one-out — 판정 8지표(★+☆)가 세션 하나에 좌우되는가</h2>
      <p>14세션 중 1개씩 빼고 재계산한 "스캔 비율"의 최소~최대 범위. 범위가 판정 문턱(★=1.0·☆=0.5)을
      걸치면 그 세션 하나로 합격/불합격이 뒤집힌다는 뜻 — <b>불안정</b>으로 표시하고 종합 판정 근거에서 뺀다.</p>
      <table><tr><th>지표</th><th>종류</th><th>스캔비율(전체14)</th><th>LOO 범위</th><th>판정문턱</th><th>안정성</th></tr>`;
  for(const it of loo){
    const full=cmpSame.rows.find(r=>r.metric===it.metric)?.rScan;
    h+=`<tr><td>${metricLabel(it.metric,it.kind==="target"?" ★":" ☆")}</td><td>${it.kind}</td>
        <td>${full?.toFixed(2)??"-"}</td>
        <td>${it.range?`${it.range.min}~${it.range.max}`:"-"}</td><td>${it.thr}</td>
        <td class="${it.unstable?'bad':'ok'}">${it.unstable?"불안정":"안정"}</td></tr>`;
  }
  h+=`</table>`;
  const unstableCount=loo.filter(it=>it.unstable).length;
  const unstableList=loo.filter(it=>it.unstable).map(it=>it.metric).join(", ");
  h+=`<p><b>${unstableCount}/8개 불안정</b>${unstableCount?` (${unstableList}) — 이 지표들의 개별 합격/불합격은 결론 근거로 쓰지 않는다.`:""}</p>`;

  // ── 리뷰 B: 판정 경계 간격 대비 절대 변동폭 ─────────────────────────────
  const bw=await bandWidthAnalysis();
  h+=`<h2>판정 경계 간격 대비 변동폭 (photo-module.html SB 상수 참조, 수정 없음)</h2>
      <p>비율이 아니라 <b>절대 변동폭이 실제 판정 경계 간격의 1/3을 넘는가</b>로 본다 — temple_w처럼
      2D 분모가 거의 0이라 비율이 부풀려지는 지표(§참고: 아래 캐비어트)를 걸러내는 게 목적이다.
      경계가 photo-module.html에 없는 지표는 "밴드 미정의"로 표시한다.</p>
      <table><tr><th>지표</th><th>경계 정의</th><th>간격</th><th>간격/3</th>
      <th>2D 절대변동</th><th>2D 판정</th><th>3D스냅샷 절대변동</th><th>3D스냅샷 판정</th>
      <th>3D스캔 절대변동</th><th>3D스캔 판정</th></tr>`;
  for(const r of bw.rows){
    const cls=v=>v==="임계이하(안정)"?"ok":v==="임계초과(흔들림)"?"bad":"";
    h+=`<tr><td>${metricLabel(r.metric, r.target?" ★":" ☆")}</td><td>${r.note??"-"}</td>
        <td>${r.gap??"-"}</td><td>${r.third??"-"}</td>
        <td>${r.m2d_abs??"-"}</td><td class="${cls(r.m2d_verdict)}">${r.m2d_verdict}</td>
        <td>${r.m3dSnap_abs??"-"}</td><td class="${cls(r.m3dSnap_verdict)}">${r.m3dSnap_verdict}</td>
        <td>${r.m3dScan_abs??"-"}</td><td class="${cls(r.m3dScan_verdict)}">${r.m3dScan_verdict}</td></tr>`;
  }
  h+=`</table>`;
  const bandDefined=bw.rows.filter(r=>r.gap!=null);
  const bandStableScan=bandDefined.filter(r=>r.m3dScan_verdict==="임계이하(안정)").length;

  h+=`<h2>판정 (동일 세션 비교 기준 — 비율·밴드폭·LOO 종합)</h2><p>
      비율 기준 — 주 기준 최소(★ 전부 &lt;1.0): <b class="${cmpSame.targetAllBelow1?'ok':'bad'}">${cmpSame.targetAllBelow1?"충족":"미충족"}</b> ·

      <b>${bandStableScan}/${bandDefined.length}</b>개<br>
      견고성(LOO) — 8개 중 <b class="${unstableCount?'bad':'ok'}">${unstableCount}개 불안정</b>(세션 1개 교체로 합격/불합격 뒤집힘)</p>`;

  h+=`<h2>3방식 비교 — 참고 (captures/ 기준선, n=스캔 ${cmp.nScan} / 기준선 ${cmp.nBase})</h2>
      <p><b>⚠ 주 판정 아님.</b> 2D·3D스냅샷은 captures/(다른 날 촬영)에서, 3D스캔은 scans/에서 나와 촬영
      세트 자체가 다르고, <b>C4 조건의 정의도 다르다</b>(M1 C4=좌우 기울임, 이번 스캔 C4=상하 기울임 —
      대표가 스캔은 이미 좌우를 훑으므로 의도적으로 바꿈). 방식 차이와 조건 차이가 섞여 있어 참고용으로만
      남긴다.</p>
      <table><tr><th>지표</th><th>2D</th><th>3D 스냅샷</th><th>3D 스캔</th><th>스냅샷 비율</th><th>스캔 비율</th></tr>`;
  for(const r of cmp.rows){
    const mark=r.target?" ★":r.guard?" ☆":"";
    const cls=r.rScan==null?"":r.rScan<=0.5?"ok":r.rScan<1?"warn":"bad";
    h+=`<tr><td>${metricLabel(r.metric,mark)}</td><td>${fmt(r.c2,r.unit)}</td><td>${fmt(r.cS,r.unit)}</td>

        <td class="${cls}">${r.rScan?.toFixed(2)??"-"}</td></tr>`;
  }
  h+=`</table>`;

  // ── 대표 재지시: 회전각 제한 민감도 검사 (리뷰 A-1: 변이별 분모 재계산) ──────
  const sens=sensitivityAnalysis(cmpSame.rows);
  h+=`<h2>민감도 검사 — 회전각을 제한하면 나아지는가 (TARGET 5지표, n=${sens.nTotal})</h2>
      <p>2D 대비 비율(동일 세션 기준, 작을수록 안정). <b>변이마다 분모(2D CV)도 그 변이의 세션
      부분집합으로 재계산한다</b>(리뷰 A-1 — 분자·분모 세션구성 불일치 수정). 셀에 세션 수·조건 구성을
      함께 표시한다. 각도를 제한할수록 비율이 낮아지면 회전 프레임의 랜드마크가 잡음원이라는 뜻이다.</p>

      : `각도를 좁혀도 비율이 낮아지지 않거나 오히려 나빠진다 — 회전 프레임 자체보다 다른 잡음원(예: 세션 수 부족·중앙값 융합 방식)을 의심해야 한다.`}

      표본 구성 자체가 다르다는 점을 감안해야 한다.</p>`;

  const bands=window.__scan.sessions.filter(s=>s.yawBands&&Object.keys(s.yawBands).length);
  if(bands.length){
    h+=`<h2>각도구간별 지표 (랜드마크 정확도 저하 점검)</h2><table><tr><th>세션</th><th>구간</th><th>jaw_angular</th><th>temple_w</th><th>face_HW</th></tr>`;

  // ── 리뷰 A-2: 실측거리(lensDistanceCm) 기준 재분류 — §4 구방식(조건 라벨) 결론 철회 ─────
  const dist=distanceStability();
  h+=`<h2>실측 거리 구간별 안정성 — 지표별 변동계수(CV%, 작을수록 안정)</h2>
      <p><b>⚠ 조건 라벨(C1/C2/C3=25·40·50cm) 기준 이전 결론은 철회한다.</b> 프레임 메타
      <code>lensDistanceCm</code> 실측 결과 라벨과 실제 거리가 어긋난다(예: C2_4는 전 프레임 ≈55cm인데
      "C2(25cm)"로 분류돼 있었음). 대신 세션별 lensDistanceCm 평균으로 3개 거리 구간(~30·30~45·45cm~)을
      다시 묶었다. 구간별 세션 수: ${DIST_BINS.map(b=>`${b.key}=${dist.binN[b.key]}`).join(" · ")} (총 n=${dist.nTotal}).</p>
      <table><tr><th>지표</th>${DIST_BINS.map(b=>`<th>${b.key}${dist.usableBins.includes(b.key)?"":" (표본부족)"}</th>`).join("")}</tr>`;
  for(const r of dist.rows){
    h+=`<tr><td>${r.metric}</td>${DIST_BINS.map(b=>`<td>${r[b.key]==null?"-":r[b.key].toFixed(2)}</td>`).join("")}</tr>`;
  }
  h+=`</table>`;
  if(dist.best){
    h+=`<tr></tr><table><tr><td><b>평균 순위(작을수록 안정, 표본 충분 구간만)</b></td>${dist.usableBins.map(b=>
      `<td>${b}: <b class="${dist.best===b?'ok':''}">${dist.avgRank[b]}</b></td>`).join("")}</table>
      <p>최적 촬영 거리(재산출): <b class="ok">${dist.best}</b>${dist.rankNote?` — ${dist.rankNote}`:""}</p>`;
  } else {
    h+=`<p><b class="warn">최적 거리 판정 보류</b> — ${dist.rankNote}</p>`;
  }

  // ── 리뷰 A-3: brow_arch_deg 원시 CV(세트 단위) + line_score 포화·C4 front 진단 ─────
  const diag=browArchDiagnostics();
  h+=`<h2>진단 — brow_arch_deg 원시 변동폭 · line_score 포화 · C4 front 자세</h2>
      <p>§참고표에서 "captures 3D스냅샷 brow_arch 1.1%라 안정적"이라 썼던 근거를 철회한다 — 그건
      조건별로 먼저 평균 낸 뒤 조건간 CV를 본 것인데, captures의 조건 그룹 크기가 제각각(C4만 8세트 등)이라
      큰 그룹이 노이즈를 눌러준 인공물이었다. 아래는 조건으로 평균 내지 않은 <b>세트/세션 원시값 CV</b>다.</p>
      <table><tr><th>구분</th><th>원시 CV%</th><th>n</th></tr>
      <tr><td>captures 3D스냅샷 brow_arch_deg</td><td>${diag.capturesRawCV}%</td><td>${diag.capturesN}</td></tr>
      <tr><td>스캔 front 3D스냅샷 brow_arch_deg</td><td>${diag.scanFrontRawCV}%</td><td>${diag.scanFrontN}</td></tr>
      <tr><td>〃 (C4_2 rollDeg 이상치 제외)</td><td>${diag.scanFrontRawCV_exclC4_2}%</td><td>${diag.scanFrontN_exclC4_2}</td></tr>
      </table>
      <p>line_score 3D스냅샷 클램프 포화(정확히 0.45): captures <b>${diag.lsSaturated}/${diag.lsTotal}</b>건
      — 스캔 전용 현상이 아니라 클램프 공식의 구조적 한계다.</p>
      <p>C4 세 세션의 front 프레임 원시 자세 <b>(축오류·참고용 — 분류에는 미사용, 진단 전용)</b>:
      ${diag.c4Meta.map(m=>`${m.key}: yaw ${m.yawDeg?.toFixed(1)}° · roll ${m.rollDeg?.toFixed(1)}° · pitch ${m.pitchDeg?.toFixed(1)}° · 거리 ${m.lensDistanceCm?.toFixed(1)}cm`).join(" / ")}
      — C4_2만 rollDeg가 크게 이탈(-92.8°)해 있고, 이 하나를 빼면 스캔 front brow_arch 원시 CV가
      ${diag.scanFrontRawCV}%→${diag.scanFrontRawCV_exclC4_2}%로 떨어진다.</p>
      <p>조건별 평균 lensDistanceCm(참고): ${Object.entries(diag.distByCondition).map(([c,v])=>`${c}=${v}cm`).join(" · ")}</p>`;

  // ── 이론 §3-2: 정중선 단면 돌출도 후보지표(회신_판정밴드정의_3건판정_2026-08-07.md 반영) ──────
  const pr=protrusionSummary(), prMM=protrusionSummaryMM(), prCmp=protrusionCompare(), apexHist=chinApexHistogram();
  h+=`<h2>정중선 단면 돌출도 후보지표 (이론팀 전달용 — [가설] 로깅 전용, 판정·표시 절대 금지)</h2>
      <p><b>기준현(§3-2-1)</b>: 미간 상당(9)–코기저 상당(2) 내부 현(이론 예시 그대로) — 외부(카메라·중력) 기준 아님.
      E-line(원형)=코끝(1)–턱 최전방점 현, 윗입술(13) 수직편차. <b>턱 최전방점(§3-2-2)</b>은 152 고정이
      아니라 정중선 단면 후보 {18,200,199,175,152}에서 나침반(3점 127·356·10 평면 법선, 코끝 방향 자동정렬)
      기준 가장 앞선 점을 결정론적으로 탐색한다. <b>정규화(§3-2-3)</b>: 주값 ÷faceH(=D(10,152)) + mm 원시값
      병기. 2D는 z가 없어 산출 불가(3D 전용).</p>
      <table><tr><th>지표(÷faceH)</th><th>3D 스냅샷 평균±SD (n)</th><th>3D 스캔 평균±SD (n)</th></tr>`;
  for(const r of pr){
    h+=`<tr><td>${r.metric}</td><td>${r.snapMean==null?"-":r.snapMean+"±"+r.snapSd+" ("+r.nSnap+")"}</td>

  }
  h+=`</table>
      <p><b>mm 원시값 병기(§3-2-3)</b> — 트루뎁스 전용 절대단위, 해부학적 타당성 육안 점검용.</p>
      <table><tr><th>지표(mm)</th><th>3D 스냅샷 평균±SD (n)</th><th>3D 스캔 평균±SD (n)</th></tr>`;
  for(const r of prMM){
    h+=`<tr><td>${r.metric}</td><td>${r.snapMean==null?"-":r.snapMean+"±"+r.snapSd+" ("+r.nSnap+")"}</td>
        <td>${r.scanMean==null?"-":r.scanMean+"±"+r.scanSd+" ("+r.nScan+")"}</td></tr>`;
  }
  h+=`</table>
      <p><b>기준면 비교(현 vs 3점평면) · 턱 최전방점(탐색 vs 152고정)</b> — 같은 ÷faceH로 통제해 기준면
      선택 자체의 차이만 보이게 했다. <code>_plane</code>=기존 127·356·10 평면 방식(비교용 병기),
      <code>_fixed152</code>=턱 152 고정(비교용 병기).</p>
      <table><tr><th>지표</th><th>3D 스냅샷 평균±SD (n)</th><th>3D 스캔 평균±SD (n)</th></tr>`;
  for(const r of prCmp){
    h+=`<tr><td>${r.metric}</td><td>${r.snapMean==null?"-":r.snapMean+"±"+r.snapSd+" ("+r.nSnap+")"}</td>
        <td>${r.scanMean==null?"-":r.scanMean+"±"+r.scanSd+" ("+r.nScan+")"}</td></tr>`;
  }
  h+=`</table>
      <p>턱 최전방점 탐색 결과 분포(스캔 3D스캔, n=${apexHist.n}) — 어느 인덱스가 몇 번 선택됐는지:
      ${Object.entries(apexHist.hist).map(([idx,c])=>`${idx}번: ${c}회`).join(" · ")||"-"}</p>`;

  // ── 추가요구 §3: 카드 절대정확도 측정 도구 안내 ─────────────────────────
  const cardSessions=window.__scan.sessions.filter(s=>s.isCardSession && s.m3dScan);
  if(cardSessions.length){
    const ex=cardSessions[0];
    h+=`<h2>카드 절대정확도 측정 도구</h2>
        <p>ISO/IEC 7810 ID-1 카드(85.60×53.98mm, 오차 3% 이내면 기준자로 사용 가능). 카드 모서리 픽셀
        좌표(세로 RGB 이미지 기준)를 콘솔에서 직접 지정해 호출한다:</p>
        <p><code>await window.measureCard("${ex.key}", ${ex.frontSeqs?.[0]??"?"}, {x:px1,y:py1}, {x:px2,y:py2})</code></p>
        <table><tr><th>세션</th><th>정면(front) 프레임 seq</th><th>권장</th></tr>`;
    for(const s of cardSessions){
      h+=`<tr><td>${s.key}</td><td>${(s.frontSeqs||[]).join(", ")||"-"}</td>
          <td>${s.frontSeqs?.length?"front 프레임 권장 — 카드가 정면에서 왜곡 없이 가장 잘 보임":"-"}</td></tr>`;
    }
    h+=`</table>`;
  }

  $("out").innerHTML=h;
}
window.addEventListener("scan:loaded", render);

// 근거: theory/회신_판정밴드정의_3건판정_2026-08-07.md §1-2~§1-4·§2

/** 산식 선택 근거(중요 — 화면·보고서 동시 표기):
 *  이론 §1-3은 SD_b를 "photo 실행 경로(dev 모드)"로 재실행하라고 지시했다. 그런데 §1-4-4의 단위
 *  규율("SD_w와 SD_b는 같은 산식·같은 물리량이어야 한다")이 더 상위 원칙이다. 우리 SD_w는 전부
 *  poc-metrics.js의 shapeMetrics()로 산출돼 있으므로, SD_b도 동일 함수·동일 코드경로(이 파일)로
 *  산출한다. shapeMetrics 본문·인덱스·가중치는 무변경(절대 제약) — 여기서는 Sample/의 2D 랜드마크만
 *  새로 뽑아 넣는다.
 *  ⚠ 캐비어트(2026-08-07 코드 확인): poc-metrics.js의 chin_angle_deg는 랜드마크(172,152,397)를,
 *  photo-module.html은 (148,152,377)을 쓴다. brow_arch_deg도 poc-metrics(107,105,46) vs
 *  photo-module(107,105,70)로 바깥쪽 기준점이 다르다. 이번 재판정(SD_w·SD_b 전부 poc-metrics 경로)은
 *  내부적으로 일관되지만, 여기서 나온 SD_b·임계값을 photo-module.html의 실제 판정식에 그대로
 *  적용할 수는 없다(다른 산식 → 다른 절대값). 산식이 같은 poc-metrics 경로 내부 비교(2D vs 3D
 *  스냅샷 vs 3D스캔)에는 영향이 없다 — 세 방식 모두 poc-metrics의 동일 chin/brow 정의를 쓰기 때문. */
const SDB_METHODOLOGY_NOTE = "SD_b는 poc-metrics.js shapeMetrics()로 산출(SD_w와 동일 산식 보장, 이론 §1-4 단위 규율 우선 적용). photo-module.html의 chin_angle_deg·brow_arch_deg는 다른 랜드마크를 써서 절대값이 다르다(코드 확인 2026-08-07) — 이 재판정 결과를 photo-module.html 판정식에 그대로 이식할 수 없다는 뜻이며, poc-metrics 경로 내부 비교(2D/3D스냅/3D스캔)에는 영향 없다.";

const SDB_EXCLUDE = new Set(["4000K조명_준성.JPG","자연광_준성.JPG","화이트조명_준성.JPG"]);
window.__sdb = {sets:[]};

async function loadSDbBaseline(files){
  // ⚠ macOS 파일시스템은 한글 파일명을 NFD(자모 분해)로 내놓는다 — webkitRelativePath도 NFD라
  // SDB_EXCLUDE의 NFC 리터럴과 바이트 단위로 다르다(직접 확인: 2026-08-07). 비교 전 양쪽 다 NFC로 정규화.
  const list=[...files].filter(f=>{
    const parts=f.webkitRelativePath.split("/");
    if(parts.length!==2) return false;               // Sample/파일명 형태만(하위 폴더 없음)
    const name=parts[1].normalize("NFC");
    if(SDB_EXCLUDE.has(name)) return false;           // 동일 인물(준성) 조명 변형 3장 제외
    return /\.(jpe?g|png)$/i.test(name);
  }).sort((a,b)=>a.name.localeCompare(b.name));
  window.__sdb.sets=[];
  for(const f of list){
    const name=f.webkitRelativePath.split("/")[1].normalize("NFC");
    const {img,W,H}=await fileToImage(f);
    const res=engine.detect(img);
    if(!res.faceLandmarks?.length){ log(`SD_b ${name}: 얼굴 미검출 — 제외`); continue; }
    const lm=res.faceLandmarks[0];
    const p2=lm.map(p=>({x:p.x*W,y:p.y*H,z:0}));
    const fw2=Math.hypot(p2[454].x-p2[234].x, p2[454].y-p2[234].y);
    const m2d=shapeMetrics(p2,fw2,"2d");
    window.__sdb.sets.push({key:name, m2d});
  }
  log(`SD_b(인물간) 로드 — ${window.__sdb.sets.length}명 (준성 조명변형 3장 제외, 잠정 n=12 목표)`);
}

$("pickSample").addEventListener("change", async e=>{
  if(!engine) await initEngine();
  await loadSDbBaseline(e.target.files);
  tryAutoRejudge();
});
$("btnRejudge").addEventListener("click", renderRejudge);
function tryAutoRejudge(){
  if(window.__sdb.sets.length && window.__scan.sessions.length) renderRejudge();
}
window.addEventListener("scan:loaded", tryAutoRejudge);

/** 판정 대상 지표 — shapeMetrics 18개 전 필드 + 합(lip_sum, 이론 §1-3 앵커A3·A4: lip_upper+lip_lower). */
const JUDGE_METRICS=[...METRICS, "lip_sum"];
const METRIC_3D_HOLD=new Set(["jaw_angular_deg","brow_arch_deg","chin_angle_deg"]);   // 3D 판정 보류(물리량 상이, §1-3·§2-3)
const METRIC_EXCLUDE=new Set(["line_score"]);                                         // 판정 제외(C-12, §2)

function mVal(rec, key){
  if(!rec) return null;
  if(key==="lip_sum") return (rec.lip_upper!=null && rec.lip_lower!=null) ? rec.lip_upper+rec.lip_lower : null;
  const v=rec[key];
  return typeof v==="number" ? v : null;
}
function mDerive(obj){
  if(!obj) return obj;
  return {...obj, lip_sum:(obj.lip_upper!=null&&obj.lip_lower!=null)?obj.lip_upper+obj.lip_lower:undefined};
}
function sdOf(vals){ vals=vals.filter(v=>v!=null); return vals.length>=2 ? {sd:sd(vals), n:vals.length} : {sd:null, n:vals.length}; }
function sdb(key){ return sdOf(window.__sdb.sets.map(r=>mVal(r.m2d,key))); }
function scanPool(){ return window.__scan.sessions.filter(s=>s.m3dScan && !s.isCardSession); }
function sdwScan(key, method){
  const scan=scanPool();
  const vals = method==="m3dScan" ? scan.map(s=>mVal(s.m3dScan,key))
             : method==="m2d"     ? scan.map(s=>mVal(s.frontSnapshot?.m2d,key))
             :                      scan.map(s=>mVal(s.frontSnapshot?.m3dSnap,key));
  return sdOf(vals);
}
function sdwM1(key, method){
  const base=window.__base.sets;
  const vals = method==="m2d" ? base.map(r=>mVal(r.m2d,key)) : base.map(r=>mVal(r.m3dSnap,key));
  return sdOf(vals);
}
function betweenSDScan(key, method){
  const scan=scanPool();
  const pf = method==="m3dScan" ? r=>mDerive(r.m3dScan)
           : method==="m2d"     ? r=>mDerive(r.frontSnapshot?.m2d)
           :                      r=>mDerive(r.frontSnapshot?.m3dSnap);
  return betweenCV(scan, pf, key, "abs");
}
function betweenSDM1(key, method){
  const base=window.__base.sets;
  const pf = method==="m2d" ? r=>mDerive(r.m2d) : r=>mDerive(r.m3dSnap);
  return betweenCV(base, pf, key, "abs");
}

/** 포화율: 값 목록에서 가장 흔한 값(shapeMetrics가 이미 toFixed로 반올림한 표기 그대로)의 반복 비율.
 *  0.4 이상이면 포화 의심(이론 §2-2 실증 사례: line_score 21세트 중 17건=0.81). line_score만 clamp()가
 *  있어(poc-metrics.js 소스 확인) 구조적으로 포화될 수 있는 유일한 지표지만, 경험적 안전판으로 전
 *  지표에 동일 기준을 투명하게 적용한다. */
function saturationRate(vals){
  vals=vals.filter(v=>v!=null);
  if(!vals.length) return {rate:0, n:0, mode:null};
  const cnt=new Map();
  for(const v of vals) cnt.set(v,(cnt.get(v)||0)+1);
  let best=null,bn=0;
  for(const [v,c] of cnt) if(c>bn){bn=c;best=v;}
  return {rate:+(bn/vals.length).toFixed(2), n:vals.length, mode:best};
}
const SAT_THRESHOLD=0.4;
function metricSaturation(key){
  const scan=scanPool(), base=window.__base.sets;
  const series={
    "SD_w 2D(스캔)": scan.map(s=>mVal(s.frontSnapshot?.m2d,key)),
    "SD_w 3D스냅(스캔)": scan.map(s=>mVal(s.frontSnapshot?.m3dSnap,key)),
    "SD_w 3D스캔": scan.map(s=>mVal(s.m3dScan,key)),
    "SD_w 2D(M1)": base.map(r=>mVal(r.m2d,key)),
    "SD_w 3D스냅(M1)": base.map(r=>mVal(r.m3dSnap,key)),
    "SD_b(인물간)": window.__sdb.sets.map(r=>mVal(r.m2d,key)),
  };
  const out={}; let maxRate=0, worst=null;
  for(const [label,vals] of Object.entries(series)){
    const r=saturationRate(vals); out[label]=r;
    if(r.rate>maxRate){ maxRate=r.rate; worst=label; }
  }
  return {series:out, maxRate, worst, saturated:maxRate>=SAT_THRESHOLD};
}

/** line_score 전용 — 3성분(jaw/chin/brow) 클램프 상/하한 적중 여부를 원식(poc-metrics.js shapeMetrics
 *  소스 인용, 본문 무변경)으로 재계산해 포화 원인을 구조적으로 확인한다(§2-2). */
function lineScoreClampDiag(rec){
  if(!rec || rec.jaw_angular_deg==null || rec.chin_angle_deg==null || rec.brow_arch_deg==null) return null;
  const jawT=(rec.jaw_angular_deg-7)/12, chinT=(rec.chin_angle_deg-115)/50, browT=(25-rec.brow_arch_deg)/20;
  const hit=t=> t<=0?"하한":t>=1?"상한":null;
  const j=hit(jawT), c=hit(chinT), b=hit(browT);
  return {jaw:j, chin:c, brow:b, nHit:[j,c,b].filter(Boolean).length};
}
function lineScoreClampSummary(){
  const rows=[
    {label:"M1 3D스냅(21세트)", recs:window.__base.sets.map(r=>r.m3dSnap).filter(Boolean)},
    {label:"스캔 3D스캔(14세션)", recs:scanPool().map(s=>s.m3dScan).filter(Boolean)},
    {label:"스캔 front 2D(14세션)", recs:scanPool().map(s=>s.frontSnapshot?.m2d).filter(Boolean)},
  ];
  return rows.map(r=>{
    const diags=r.recs.map(lineScoreClampDiag).filter(Boolean);
    const ge2=diags.filter(d=>d.nHit>=2).length;
    return {label:r.label, n:diags.length, ge2, pct: diags.length? +(ge2/diags.length*100).toFixed(0):null};
  });
}

function classify(key){
  if(METRIC_EXCLUDE.has(key)) return "exclude";
  if(METRIC_3D_HOLD.has(key)) return "hold3d";
  return "ratio";
}
function verdictCell(sdwVal, sdbVal, extraTag){
  if(sdwVal==null || sdbVal==null) return {text:"자료부족", ok:null};
  const thr=0.35*sdbVal;
  const ok=sdwVal<thr;
  return {text:(ok?"합격":"불합격")+(extraTag?` ${extraTag}`:""), ok, thr};
}
function fmt4(v){ return v==null?"-":v.toFixed(4); }

/** 이론 §3-2-6 — 돌출도 후보 5종(+병기 변형)의 산출 안정성(SD_w) 평가.
 *  "대표 1인 분포는 밴드 재료가 아니라(D26 위반) 산출 안정성(SD_w) 확인 재료다." SD_b(Sample 12명)는
 *  2D 정지사진이라 z가 없어 돌출도 자체를 산출할 수 없다 — 합불 판정(SD_w<0.35×SD_b)은 못 한다.
 *  대신 스캔 14세션의 "이 세션 자신의 3D스냅샷"(frontSnapshot.protrusionSnap) vs "3D스캔 융합"
 *  (protrusionScan)을 같은 세션끼리 짝지어 SD_w만 비교한다(기존 sdwScan의 m3dSnap/m3dScan 짝짓기와
 *  동일 패턴 재사용) — 3D스냅샷 vs 3D스캔 중 어느 쪽이 더 안정적인지(융합 효과)를 보여준다. */
const PROTRUSION_STABILITY_FIELDS=[...new Set([...PROTRUSION_KEYS_MAIN, ...PROTRUSION_KEYS_MM, ...PROTRUSION_KEYS_COMPARE])];
function protrusionStability(){
  const scan=scanPool();
  const rows=PROTRUSION_STABILITY_FIELDS.map(k=>{
    const vSnap=scan.map(s=>s.frontSnapshot?.protrusionSnap?.[k]).filter(v=>v!=null);
    const vScan=scan.map(s=>s.protrusionScan?.[k]).filter(v=>v!=null);
    const snap=sdOf(vSnap), scn=sdOf(vScan);
    let better=null;
    if(snap.sd!=null && scn.sd!=null){
      better = Math.abs(snap.sd-scn.sd)<1e-9 ? "동률" : snap.sd<scn.sd ? "3D스냅샷" : "3D스캔";
    }
    return {metric:k, snapMean:vSnap.length?mean(vSnap):null, snapSd:snap.sd, snapN:snap.n,
            scanMean:vScan.length?mean(vScan):null, scanSd:scn.sd, scanN:scn.n, better};
  });
  const tally={"3D스냅샷":0,"3D스캔":0,"동률":0};
  for(const r of rows) if(r.better) tally[r.better]++;
  return {rows, tally, n:scan.length};
}

async function renderRejudge(){
  if(!window.__sdb.sets.length){ $("outRejudge").innerHTML="<p class='warn'>Sample 폴더를 먼저 로드하세요.</p>"; return; }
  if(!window.__scan.sessions.length){ $("outRejudge").innerHTML="<p class='warn'>scans 폴더를 먼저 로드하세요.</p>"; return; }
  const scan=scanPool(), base=window.__base.sets;
  let h=`<h1>이론팀 회신 재판정 (2026-08-07) — 합격 = SD_w &lt; 0.35×SD_b</h1>
  <p>근거: theory/회신_판정밴드정의_3건판정_2026-08-07.md §1-2~§1-4·§2. SD_b n=${window.__sdb.sets.length}명(잠정, 목표 n=12) ·
  SD_w 스캔세션 n=${scan.length}/14 · M1세트 n=${base.length}/21.</p>
  <p style="font-size:12px;color:#6b5c73;max-width:900px">${SDB_METHODOLOGY_NOTE}</p>`;

  // 1. SD_b
  h+=`<h2>1. SD_b — 인물 간 표준편차 (잠정, n=${window.__sdb.sets.length})</h2>
      <table><tr><th>지표</th><th>SD_b</th><th>n</th><th>임계=0.35×SD_b</th></tr>`;
  for(const k of JUDGE_METRICS){
    const {sd:s,n}=sdb(k);
    h+=`<tr><td>${k}</td><td>${fmt4(s)}</td><td>${n}</td><td>${s==null?"-":fmt4(s*0.35)}</td></tr>`;
  }
  h+=`</table>`;

  // 2. SD_w 원자료(주기준: raw pooled) + 조건평균간 SD 병기(계통 민감도, 기존 betweenCV 재사용)
  h+=`<h2>2. SD_w — 동일인 조건·세션 간 변동 (주기준: 세션/세트 간 SD, 조건 구분 없이 한 덩어리)</h2>
      <p>각 방식 옆 "〃조건평균간"은 계통 민감도 참고용(기존 betweenCV, 판정에는 미사용).</p>
      <table><tr><th>지표</th>
      <th>스캔 2D</th><th>〃조건평균간</th><th>스캔 3D스냅</th><th>〃조건평균간</th><th>스캔 3D스캔</th><th>〃조건평균간</th>
      <th>M1 2D</th><th>〃조건평균간</th><th>M1 3D스냅</th><th>〃조건평균간</th></tr>`;
  for(const k of JUDGE_METRICS){
    const s2=sdwScan(k,"m2d"), s3s=sdwScan(k,"m3dSnap"), s3c=sdwScan(k,"m3dScan");
    const m2=sdwM1(k,"m2d"), m3s=sdwM1(k,"m3dSnap");
    const b2=betweenSDScan(k,"m2d"), b3s=betweenSDScan(k,"m3dSnap"), b3c=betweenSDScan(k,"m3dScan");
    const bm2=betweenSDM1(k,"m2d"), bm3s=betweenSDM1(k,"m3dSnap");
    h+=`<tr><td>${k}</td>
        <td>${fmt4(s2.sd)}</td><td>${b2==null?"-":b2.toFixed(4)}</td>
        <td>${fmt4(s3s.sd)}</td><td>${b3s==null?"-":b3s.toFixed(4)}</td>
        <td>${fmt4(s3c.sd)}</td><td>${b3c==null?"-":b3c.toFixed(4)}</td>
        <td>${fmt4(m2.sd)}</td><td>${bm2==null?"-":bm2.toFixed(4)}</td>
        <td>${fmt4(m3s.sd)}</td><td>${bm3s==null?"-":bm3s.toFixed(4)}</td></tr>`;
  }
  h+=`</table>`;

  // 3. 포화율 (판정 전 필수, §2-2)
  h+=`<h2>3. 포화율 — 판정 전 필수 확인 (이론 §2-2)</h2>
      <p>가장 흔한 값의 반복 비율. <b>${SAT_THRESHOLD*100}% 이상이면 포화 의심 → 해당 지표는 판정에서 제외</b>.
      line_score는 §2에 따라 이미 전체 제외이나, 구조 원인(클램프 경계 적중)을 아래에 별도로 확인한다.</p>
      <table><tr><th>지표</th><th>최대포화율</th><th>발생 계열</th><th>판정</th></tr>`;
  const satFlags={};
  for(const k of JUDGE_METRICS){
    const s=metricSaturation(k); satFlags[k]=s.saturated;
    h+=`<tr><td>${k}</td><td>${(s.maxRate*100).toFixed(0)}%</td><td>${s.worst??"-"}</td>
        <td class="${s.saturated?'bad':'ok'}">${s.saturated?"포화 — 판정 제외":"정상"}</td></tr>`;
  }
  h+=`</table>`;
  const lsClamp=lineScoreClampSummary();
  h+=`<p><b>line_score 클램프 진단</b> (3성분 중 2개 이상 상/하한 적중 비율):
      ${lsClamp.map(r=>`${r.label} ${r.ge2}/${r.n}(${r.pct}%)`).join(" · ")}</p>`;

  // 4. 합불 판정표 (주판정: 스캔 14세션 기준)
  h+=`<h2>4. 합불 판정표 (주판정 — 스캔 14세션 기준 SD_w)</h2>
      <p>합격 = SD_w &lt; 0.35×SD_b. line_score=판정 제외(C-12) · 3D 각도류(jaw_angular_deg·brow_arch_deg·
      chin_angle_deg)=3D 판정 보류(2D 투영각≠3D 실각, 물리량 상이, §1-3·§2-3) · 그 외 비율 지표의 3D열은
      SD_b가 2D에서만 산출돼(Sample은 깊이 없음) "잠정(교차단위)" 허용(§1-3 단위 규율). 포화 지표는 자동 제외.</p>
      <table><tr><th>지표</th><th>SD_b(n=${window.__sdb.sets.length})</th><th>임계=0.35×SD_b</th>
      <th>SD_w 2D</th><th>SD_w 3D스냅</th><th>SD_w 3D스캔</th>
      <th>2D 합불</th><th>3D스냅 합불</th><th>3D스캔 합불</th><th>포화</th></tr>`;
  let passCount3d=0, judged3d=0;
  for(const k of JUDGE_METRICS){
    const cls=classify(k);
    const {sd:sb_}=sdb(k);
    const w2=sdwScan(k,"m2d"), w3s=sdwScan(k,"m3dSnap"), w3c=sdwScan(k,"m3dScan");
    let v2,v3s,v3c;
    if(cls==="exclude"){
      v2=v3s=v3c={text:"판정 제외(C-12)",ok:null};
    } else if(cls==="hold3d"){
      v2=verdictCell(w2.sd, sb_);
      v3s=v3c={text:"3D 판정 보류(물리량 상이)", ok:null};
    } else {
      v2=verdictCell(w2.sd, sb_);
      v3s=verdictCell(w3s.sd, sb_, "(잠정·교차단위)");
      v3c=verdictCell(w3c.sd, sb_, "(잠정·교차단위)");
    }
    if(satFlags[k] && cls!=="exclude"){
      if(v2.ok!=null) v2={text:"판정 제외(포화)", ok:null};
      if(v3s.ok!=null) v3s={text:"판정 제외(포화)", ok:null};
      if(v3c.ok!=null) v3c={text:"판정 제외(포화)", ok:null};
    }
    if(cls==="ratio"){ if(v3c.ok===true) passCount3d++; if(v3c.ok!=null) judged3d++; }
    const clsOf=v=>v.ok===true?"ok":v.ok===false?"bad":"";
    h+=`<tr><td>${k}${cls==="hold3d"?" ▲":cls==="exclude"?" ✕":""}</td>
        <td>${fmt4(sb_)}</td><td>${sb_==null?"-":fmt4(sb_*0.35)}</td>
        <td>${fmt4(w2.sd)}</td><td>${fmt4(w3s.sd)}</td><td>${fmt4(w3c.sd)}</td>
        <td class="${clsOf(v2)}">${v2.text}</td><td class="${clsOf(v3s)}">${v3s.text}</td><td class="${clsOf(v3c)}">${v3c.text}</td>
        <td>${satFlags[k]?"⚠":""}</td></tr>`;
  }
  h+=`</table><p>▲=3D 판정 보류(§1-3·§2-3) · ✕=판정 제외(§2, C-12)</p>`;

  // 5. 병기 — M1 21세트 기준
  h+=`<h2>5. 병기 — M1 21세트 기준 SD_w 합불 (2D·3D스냅만, 3D스캔 데이터 없음)</h2>
      <table><tr><th>지표</th><th>SD_b</th><th>임계</th><th>SD_w 2D(M1)</th><th>SD_w 3D스냅(M1)</th>
      <th>2D 합불</th><th>3D스냅 합불</th></tr>`;
  for(const k of JUDGE_METRICS){
    const cls=classify(k);
    const {sd:sb_}=sdb(k);
    const m2=sdwM1(k,"m2d"), m3s=sdwM1(k,"m3dSnap");
    let v2,v3s;
    if(cls==="exclude"){ v2=v3s={text:"판정 제외(C-12)",ok:null}; }
    else if(cls==="hold3d"){ v2=verdictCell(m2.sd,sb_); v3s={text:"3D 판정 보류(물리량 상이)",ok:null}; }
    else { v2=verdictCell(m2.sd,sb_); v3s=verdictCell(m3s.sd,sb_,"(잠정·교차단위)"); }
    const clsOf=v=>v.ok===true?"ok":v.ok===false?"bad":"";
    h+=`<tr><td>${k}</td><td>${fmt4(sb_)}</td><td>${sb_==null?"-":fmt4(sb_*0.35)}</td>
        <td>${fmt4(m2.sd)}</td><td>${fmt4(m3s.sd)}</td>
        <td class="${clsOf(v2)}">${v2.text}</td><td class="${clsOf(v3s)}">${v3s.text}</td></tr>`;
  }
  h+=`</table>`;

  // 6. 종합 해석 (이론 §1-4-4 구조)
  h+=`<h2>6. 종합 해석 (이론 §1-4-4 구조)</h2>
      <p><b>A (비열등, 필요조건)</b>: 판정 가능한 비율 지표 ${judged3d}개 중 3D스캔이 합격(SD_w&lt;0.35×SD_b)한 지표
      <b>${passCount3d}개</b>. ${judged3d? (passCount3d===judged3d?"전 지표 비열등 — A 충족.":passCount3d>0?"일부 지표만 충족 — A 부분 충족.":"A 미충족(0개 합격)."):"판정 가능한 지표가 없어 A 판정 보류."}</p>
      <p><b>B (3D 전용 가치)</b>: 2D가 원리적으로 못 재는 돌출도 지표(콧대·이마경사·입술돌출·턱·볼 볼륨)의 안정 산출 —
      이번 재판정 범위 밖(§3 [가설] 로깅 전용, 밴드 없음). 위 "정중선 단면 돌출도 후보지표" 절 참고(판정 미사용).</p>
      <p><b>최종 도입 판단 = A AND B</b>이며, <b>결과는 이론팀 회부, 채택은 대표</b>다(이론 §1-4-4). 이 화면은 A의
      정밀도 근거만 제공하고 도입 여부를 확정하지 않는다.</p>`;

  // 7. 돌출도 후보 산출 안정성 (§3-2-6) — 밴드 아님, SD_w만
  const ps=protrusionStability();
  h+=`<h2>7. 정중선 단면 돌출도 후보 — 산출 안정성(§3-2-6, 스캔 ${ps.n}세션)</h2>
      <p><b class="warn">⚠ SD_b 산출 불가 — 합불 판정 없음.</b> Sample/ 12명은 2D 정지사진(z 없음)이라
      돌출도 자체를 계산할 수 없다. 대표 1인(스캔 세션) 분포는 D26상 밴드 재료가 아니라 산출
      안정성(SD_w) 확인 재료일 뿐이다(§3-2-6). 아래는 <b>SD_w 절대값과 세션 간 일관성만</b> 제시한다 —
      "합격/불합격" 판정을 만들어내지 않는다.</p>
      <table><tr><th>지표</th><th>3D스냅샷 평균±SD_w(n)</th><th>3D스캔 평균±SD_w(n)</th><th>더 안정적</th></tr>`;
  for(const r of ps.rows){
    const isMM=r.metric.endsWith("_mm");
    const f=v=>v==null?"-":v.toFixed(isMM?2:4);
    const cls=r.better==="3D스캔"?"ok":r.better==="3D스냅샷"?"warn":"";
    h+=`<tr><td>${r.metric}</td>
        <td>${r.snapMean==null?"-":f(r.snapMean)+"±"+f(r.snapSd)+" ("+r.snapN+")"}</td>
        <td>${r.scanMean==null?"-":f(r.scanMean)+"±"+f(r.scanSd)+" ("+r.scanN+")"}</td>
        <td class="${cls}">${r.better??"-"}</td></tr>`;
  }
  h+=`</table>
      <p>세션 간 더 안정적인 방식(SD_w 작음) 집계: 3D스냅샷 ${ps.tally["3D스냅샷"]}개 · 3D스캔 ${ps.tally["3D스캔"]}개 ·
      동률 ${ps.tally["동률"]}개. 3D스캔(다각도 융합)이 더 많으면 융합이 돌출도 후보에서도 안정성을
      높인다는 근거, 반대면 단일 프레임 스냅샷이 이 지표들에는 충분하다는 뜻이다(해석은 이론팀 회부).</p>`;

  $("outRejudge").innerHTML=h;
}
</script></body></html>
