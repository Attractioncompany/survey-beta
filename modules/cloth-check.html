<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>이 옷, 나한테 맞을까 — 추구미즘</title>
<meta name="theme-color" content="#FAF7FB">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FAF7FB;--ink:#2B2233;--sub:#6E6478;--accent:#B76BA3;--line:#E8E0EC;
      --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard Variable','Pretendard',-apple-system,'Malgun Gothic',sans-serif;}
html,body{overscroll-behavior-y:none;}
body{background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
        padding:calc(var(--safe-t) + 20px) 18px calc(var(--safe-b) + 20px);}
h1{font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.lead{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.7;}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
     padding:16px;min-height:52px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;}
.btn:disabled{background:#DED5E6;color:#8E82A0;cursor:default;}
.btn.ghost{background:transparent;color:var(--sub);font-weight:500;font-size:13px;padding:10px;}
/* 촬영 프레임 — 배경이 섞이면 대표색이 배경색이 된다. 옷으로 채우게 만드는 것이 유일한 방어다. */
.stage{position:relative;margin-top:16px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;}
.stage video,.stage canvas,.stage img{width:100%;height:100%;object-fit:cover;display:block;}
.guide{position:absolute;inset:12% 14%;border:2.5px dashed rgba(255,255,255,.9);border-radius:14px;pointer-events:none;
       box-shadow:0 0 0 100vmax rgba(0,0,0,.34);}
.guide-t{position:absolute;left:0;right:0;bottom:-30px;text-align:center;color:#fff;font-size:13px;font-weight:600;
         text-shadow:0 1px 4px rgba(0,0,0,.6);}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:16px;}
.verdict{font-size:19px;font-weight:800;letter-spacing:-0.02em;}
.verdict .em{color:var(--accent);}
.reason{font-size:14px;color:var(--sub);line-height:1.75;margin-top:10px;}
.pair{display:flex;align-items:center;gap:12px;margin-top:14px;}
.chip{width:56px;height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);flex-shrink:0;}
.chip-lab{font-size:12px;color:var(--sub);}
.pal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
.pal-c{aspect-ratio:1;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);}
.pal-lab{font-size:12.5px;font-weight:700;color:var(--accent);margin-top:14px;}
.note{font-size:12px;color:var(--sub);opacity:.85;line-height:1.65;margin-top:16px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="screen" id="app"></div>

<script>
// 퍼널 계측 최소 2종 (events — 고객팀 요청·대표 결정4 2026-08-12)
const CT_SB="https://qngylynylgqlbidvtbci.supabase.co", CT_KEY="sb_publishable_bGVbZ31O7OX_rnkLVb0i5Q_SDa8JEri";
let CT_UID=null; try{ CT_UID=localStorage.getItem("czm_uid")||null; }catch(e){}
function ctTrack(event, props={}){
  try{ fetch(`${CT_SB}/rest/v1/events`,{method:"POST",headers:{"Content-Type":"application/json","apikey":CT_KEY,"Authorization":`Bearer ${CT_KEY}`},
    body:JSON.stringify({user_id:CT_UID, event, props})}); }catch(e){}
}
ctTrack("cloth_enter");

/* ── 0단계: 옷 색 판정 ──────────────────────────────────────────────
   설계서 docs/superpowers/specs/2026-08-11-clothing-recognition-v1-design.md §4 「0단계」

   FashionCLIP을 쓰지 않는다. 옷의 대표색을 뽑아 유저의 퍼스널컬러 팔레트와
   대조하기만 한다 — 이것만으로 "이 옷 사도 되나"에 답이 된다.

   **임계값을 만들지 않는다.** 베스트·세컨드·워스트 세 팔레트 중 색이 가장 가까운 쪽을
   그대로 말한다. "얼마나 가까우면 베스트인가"를 정하는 순간 창작이 되고,
   그 숫자를 검증할 데이터가 지금 없다. 순위만 쓰는 것은 기존 엔진의 판정 철학과 같다. */

const $ = id => document.getElementById(id);
let PAL = null;      // pc-palette.json
let MYPC = null;     // 유저 퍼스널컬러 이름
let stream = null;

// photo-module.html과 같은 변환식. 사람 눈의 색차는 RGB가 아니라 Lab에서 잰다.
function rgb2lab(r,g,b){
  let [R,G,B]=[r,g,b].map(v=>{v/=255; return v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92;});
  let X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=R*0.2126+G*0.7152+B*0.0722, Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const fx=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  const fX=fx(X),fY=fx(Y),fZ=fx(Z);
  return {L:116*fY-16, a:500*(fX-fY), b:200*(fY-fZ)};
}
const dE = (p,q) => Math.hypot(p.L-q.L, p.a-q.a, p.b-q.b);
const hex2lab = h => rgb2lab(parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16));

/* 프레임 안쪽 픽셀의 대표색.
   평균을 쓰면 무늬옷에서 회색이 나온다(빨강+파랑의 평균은 회색이다).
   그래서 색을 굵게 뭉쳐 최빈 구간을 찾고, 그 구간 안에서만 평균을 낸다. */
function dominantColor(ctx, x0, y0, w, h){
  const d = ctx.getImageData(x0, y0, w, h).data;
  const bins = new Map();                       // 32단계로 뭉친 색 → 픽셀 수
  const key = (r,g,b) => (r>>3<<10) | (g>>3<<5) | (b>>3);
  for(let i=0; i<d.length; i+=4){
    if(d[i+3] < 200) continue;                  // 투명 픽셀 제외
    const k = key(d[i], d[i+1], d[i+2]);
    bins.set(k, (bins.get(k)||0) + 1);
  }
  if(!bins.size) return null;
  let top=null, max=0;
  for(const [k,n] of bins) if(n>max){ max=n; top=k; }
  // 최빈 구간에 속한 픽셀만 다시 훑어 평균 — 뭉친 값(32단계)을 그대로 쓰면 색이 어긋난다
  let R=0,G=0,B=0,n=0;
  for(let i=0; i<d.length; i+=4){
    if(d[i+3] < 200) continue;
    if(key(d[i], d[i+1], d[i+2]) !== top) continue;
    R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++;
  }
  return n ? {r:Math.round(R/n), g:Math.round(G/n), b:Math.round(B/n), share:n/(w*h)} : null;
}

/* 세 팔레트 중 가장 가까운 쪽. 임계값 없이 순위만 본다. */
function judge(rgb){
  const lab = rgb2lab(rgb.r, rgb.g, rgb.b);
  const p = PAL.palettes[MYPC];
  const nearestIn = list => list.reduce((best,h)=>{
    const d = dE(lab, hex2lab(h));
    return (!best || d < best.d) ? {hex:h, d} : best;
  }, null);
  const cand = [
    {key:"best",   label:"베스트 컬러", near:nearestIn(p.best)},
    {key:"second", label:"세컨드 컬러", near:nearestIn(p.second)},
    {key:"worst",  label:"피해야 할 색", near:nearestIn(p.worst)},
  ].sort((a,b)=> a.near.d - b.near.d);
  return {lab, win:cand[0], all:cand};
}

const hex = c => "#" + [c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("");

// ── 화면 ───────────────────────────────────────────────
function renderNeedDiagnosis(){
  $("app").innerHTML = `
    <h1>이 옷, 나한테 맞을까</h1>
    <p class="lead">옷을 찍으면 <b>내 퍼스널컬러</b>와 맞는 색인지 알려드려요.<br>
      먼저 사진 진단으로 퍼스널컬러를 찾아야 해요.</p>
    <button class="btn" onclick="location.href='../photo.html?flow=full'">사진 진단부터 하기</button>`;
}

function renderStart(){
  $("app").innerHTML = `
    <h1>이 옷, 나한테 맞을까</h1>
    <p class="lead">${MYPC} 기준으로 봐드려요. 옷만 크게 담아서 찍어주세요.</p>
    <button class="btn" onclick="startCam()">📷 카메라로 찍기</button>
    <button class="btn ghost" onclick="$('file').click()">앨범에서 고르기</button>
    <input id="file" type="file" accept="image/*" class="hidden" onchange="fromFile(this)">
    <p class="note">사진은 이 기기에서만 처리해요. 서버로 보내지 않아요.</p>`;
}

function renderShot(){
  $("app").innerHTML = `
    <h1>옷을 프레임에 채워주세요</h1>
    <div class="stage">
      <video id="v" playsinline muted autoplay></video>
      <div class="guide"><div class="guide-t">이 안을 옷으로 채워주세요</div></div>
    </div>
    <button class="btn" onclick="shoot()">찍기</button>
    <button class="btn ghost" onclick="stopCam();renderStart()">← 돌아가기</button>`;
}

function renderResult(rgb, res, dataURL){
  const p = PAL.palettes[MYPC];
  const list = res.win.key === "worst" ? p.worst : p[res.win.key];
  const good = res.win.key !== "worst";
  const head = res.win.key === "best"   ? `<span class="em">베스트 컬러</span>에 가까워요`
             : res.win.key === "second" ? `<span class="em">세컨드 컬러</span>에 가까워요`
             :                            `<span class="em">피하는 게 나은 색</span>에 가까워요`;
  ctTrack("cloth_result",{win:res.win.key, pc:MYPC});
  $("app").innerHTML = `
    <h1>${MYPC} 기준으로 봤어요</h1>
    <div class="stage" style="aspect-ratio:16/10"><img src="${dataURL}" alt=""></div>
    <div class="card">
      <div class="verdict">이 색은 ${head}</div>
      <div class="pair">
        <div class="chip" style="background:${hex(rgb)}"></div>
        <div class="chip-lab">찍은 옷 색</div>
        <div class="chip" style="background:${res.win.near.hex}"></div>
        <div class="chip-lab">${res.win.label}<br>중 가장 가까운 색</div>
      </div>
      <p class="reason">${good
        ? "이 색 계열은 얼굴이 사는 쪽이에요."
        : "이 색은 얼굴에 그림자가 지기 쉬워요. 같은 디자인이면 아래 색으로 골라보세요."}</p>
      <div class="pal-lab">${good ? res.win.label : "대신 이 색들"}</div>
      <div class="pal">${(good ? list : p.best).map(c=>`<span class="pal-c" style="background:${c}"></span>`).join("")}</div>
    </div>
    <button class="btn" onclick="renderStart()">다른 옷도 보기</button>
    <p class="note">* 사진 촬영 환경에 따라 색이 다르게 잡힐 수 있어요. 실물과 화면 색이 다르면 실물이 맞아요.</p>`;
}

// ── 동작 ───────────────────────────────────────────────
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:1280}}});
    renderShot();
    $("v").srcObject = stream;
  }catch(e){
    alert("카메라를 열 수 없어요. 앨범에서 고르기를 써주세요.");
    renderStart();
  }
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

function analyze(source, W, H){
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(source, 0, 0, W, H);
  // 가이드 프레임과 같은 비율(안쪽 12%/14%)만 본다 — 배경을 최대한 뺀다
  const x0 = Math.round(W*0.14), y0 = Math.round(H*0.12);
  const w  = Math.round(W*0.72), h  = Math.round(H*0.76);
  const rgb = dominantColor(ctx, x0, y0, w, h);
  if(!rgb){ alert("색을 읽지 못했어요. 다시 찍어주세요."); return null; }
  return {rgb, dataURL: cv.toDataURL("image/jpeg", 0.8)};
}

function shoot(){
  const v = $("v");
  const out = analyze(v, v.videoWidth, v.videoHeight);
  stopCam();
  if(out) renderResult(out.rgb, judge(out.rgb), out.dataURL);
  else renderStart();
}

function fromFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = () => {
    const out = analyze(img, img.naturalWidth, img.naturalHeight);
    if(out) renderResult(out.rgb, judge(out.rgb), out.dataURL);
  };
  img.src = URL.createObjectURL(f);
}

// ── 시작 ───────────────────────────────────────────────
(async () => {
  try{
    PAL = await fetch("pc-palette.json").then(r=>r.json());
  }catch(e){
    $("app").innerHTML = `<h1>잠시 후 다시 열어주세요</h1><p class="lead">색 정보를 불러오지 못했어요.</p>`;
    return;
  }
  try{
    const d = JSON.parse(localStorage.getItem("chugu_photo_result") || "null");
    MYPC = d && d.pc && d.pc.primary;
  }catch(e){ MYPC = null; }
  // 팔레트에 없는 이름이면 진단부터 다시 — 이름 표기가 바뀌었을 때 조용히 깨지지 않게
  if(!MYPC || !PAL.palettes[MYPC]) return renderNeedDiagnosis();
  renderStart();
})();

// 자체 점검 — ?selfcheck=1 로 열면 판정 로직만 검사한다
if(new URLSearchParams(location.search).get("selfcheck")==="1"){
  window.addEventListener("load", async () => {
    const P = await fetch("pc-palette.json").then(r=>r.json());
    PAL = P; MYPC = "여름 뮤트";
    const ok = (c,m) => { if(!c) throw new Error("selfCheck 실패: " + m); };
    const p = P.palettes[MYPC];
    // 팔레트에 있는 색 그 자체를 넣으면 그 팔레트가 1등이어야 한다
    const b = p.best[0], w = p.worst[0];
    const toRGB = h => ({r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16)});
    ok(judge(toRGB(b)).win.key === "best",  "베스트 색을 베스트로 판정");
    ok(judge(toRGB(w)).win.key === "worst", "워스트 색을 워스트로 판정");
    ok(judge(toRGB(b)).win.near.d < 0.01,   "자기 자신과의 색거리는 0");
    // 12타입 전부 팔레트가 갖춰졌는지
    for(const k of Object.keys(P.palettes)){
      const q = P.palettes[k];
      ok(q.best.length===14 && q.second.length===14 && q.worst.length===14, k+" 색 수");
    }
    document.title = "selfCheck 통과 (" + Object.keys(P.palettes).length + "타입)";
    console.log("selfCheck 통과");
  });
}
</script>
</body>
</html>
