<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>측정 중</title>
<!-- 토큰 정본은 czm-ui.css (P0-1) — :root 중복 정의를 지웠다. 폰트는 번들 스크립트가 로컬로 치환한다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="czm-ui.css">
<style>
 *{box-sizing:border-box}
 /* 100dvh — iOS 주소창이 접히고 펴져도 화면 하나에 딱 맞는다(100vh는 폴백) */
 body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;
      align-items:center;text-align:center;background:var(--bg);color:var(--ink);
      padding:calc(var(--safe-t) + 32px) 24px calc(var(--safe-b) + 32px);
      font:16px/1.7 'Pretendard Variable','Pretendard',-apple-system,system-ui}
 .dot{width:56px;height:56px;border-radius:50%;background:var(--accent);opacity:.25;
      animation:pulse 1.3s ease-in-out infinite}
 @keyframes pulse{0%,100%{transform:scale(.85);opacity:.25}50%{transform:scale(1.1);opacity:.6}}
 h1{font-size:19px;font-weight:800;margin:22px 0 6px}
 p{color:var(--sub);font-size:14px;margin:0}
 /* 주 버튼은 프리즘 딥 그라데이션(--cta) — 색 정본은 czm-ui.css다 */
 .btn{margin-top:var(--sp-5);padding:15px 28px;border:0;border-radius:var(--radius-btn);background:var(--cta);
      color:#fff;font-size:16px;font-weight:700;min-width:200px}
 .quiet{margin-top:14px;font-size:12.5px;color:var(--sub);text-decoration:underline}
 #err{display:none;margin-top:10px;font-size:13px;color:#c0392b}
</style></head><body>

<div class="dot" id="dot"></div>
<h1 id="t">구미가 얼굴을 측정하고 있어요</h1>
<p id="s">방금 찍은 3방향 사진을 이 기기 안에서만 계산해요.</p>
<div id="err"></div>
<button class="btn" id="next" style="display:none">결과 보러 가기</button>
<a class="quiet" id="skip" style="display:none" href="#">건너뛰고 설문으로</a>

<script type="module">
import { measureScan, coverage } from "./scan-measure.js";

const $ = id => document.getElementById(id);

// 앱 셸 호출 — 이 페이지는 앱 번들에만 들어가므로 계약(messageHandlers ↔ __nativeReply)을
// 여기서 그대로 쓴다. index.html의 인라인 브릿지와 같은 규약이다.
const cbs = new Map(); let seq = 0;
const isIOS = () => !!(window.webkit?.messageHandlers?.chugumism);
function call(method, params) {
  return new Promise((res, rej) => {
    if (!isIOS()) return rej(new Error("no-native"));
    const id = ++seq; cbs.set(id, { res, rej });
    window.webkit.messageHandlers.chugumism.postMessage({ id, method, params: params || {} });
  });
}
window.__nativeReply = (id, ok, payload) => {
  const cb = cbs.get(id); if (!cb) return; cbs.delete(id);
  ok ? cb.res(payload) : cb.rej(new Error(payload?.error || "native-error"));
};

// ?flow=verify — 검증 왕복(홈의 재촬영·차림 기록, 베타 D1). 측정은 같고 끝이 다르다:
// 설문이 아니라 홈으로 돌아가고, 홈의 tryJudge(home.html)가 저장된 chugu_photo_result로
// 전/후를 판정한다. 이 쿼리는 AppFlow가 단다 — 허브에서 photo.html?flow=verify로 나간
// 왕복만 verify로 돈다. 홈 이동은 앱이 가로채 허브(탭바 있는 홈)로 받는다(NativeBridge).
const VERIFY = new URLSearchParams(location.search).get("flow") === "verify";
const goNext = () => { location.href = VERIFY ? "home.html" : "../index.html?flow=full"; };
$("skip").onclick = e => { e.preventDefault(); goNext(); };
$("next").onclick = goNext;

/** 측정이 실패해도 진단은 계속된다. 여기서 막으면 유저는 아무 결과도 못 받는다.
 *  실패는 조용히 넘기지 않고 화면에 적는다. */
function fail(msg) {
  $("dot").style.animation = "none"; $("dot").style.opacity = ".15";
  $("t").textContent = "이번엔 측정하지 못했어요";
  $("s").textContent = VERIFY ? "기록은 그대로 있어요. 다음에 다시 찍어볼 수 있어요."
                              : "설문 결과는 그대로 나와요. 다음에 다시 찍어볼 수 있어요.";
  $("err").style.display = "block"; $("err").textContent = msg;
  $("next").style.display = "block"; $("next").textContent = VERIFY ? "홈으로" : "설문으로";
}

/** 측정 실패를 유저에게 알리고 다시 찍을 기회를 준다 (대표 2026-08-24).
 *  그전에는 게이트를 못 넘으면 chugu_photo_result 없이 조용히 설문으로 넘어갔다 —
 *  유저는 퍼스널컬러가 왜 비었는지도, 다시 찍을 수 있다는 것도 몰랐다.
 *
 *  사유 문구는 photo.html이 이미 쓴 것을 그대로 읽어 온다(gateMsg/gateFail). 어두움·
 *  기울어짐·거리·기기각도·얼굴 못 찾음이 전부 거기 있고, 마케팅 검수도 거기서 끝났다.
 *  여기서 다시 쓰면 두 벌이 되고, 임계가 바뀌면 문구만 옛말이 된다(헌법 §3).
 *
 *  [다시 찍기]는 AppFlow .measure의 onIntercept가 받아 재스캔으로 돌린다(2026-09-04 배선).
 *  아래 setTimeout 안내는 그 배선이 없는 판(구버전 앱)에서만 뜨는 방어선으로 남긴다. */
function retakeAsk(hint, reason) {
  track("unified_gate_fail", { reason });
  $("dot").style.animation = "none"; $("dot").style.opacity = ".15";
  $("t").textContent = "이번 사진은 측정하지 못했습니다";
  $("s").innerHTML = hint ||
    "조명이나 각도의 영향일 수 있습니다. 밝은 곳에서 화면을 정면으로 보고 다시 촬영해 주십시오.";

  let done = false;
  const pick = choice => { if (done) return; done = true; track("unified_retake_pick", { choice }); };

  $("next").style.display = "block"; $("next").textContent = "다시 찍기";
  $("next").onclick = () => {
    pick("retake");
    location.href = "../photo.html?flow=verify";   // 앱: 동의→스캔 / 웹: 촬영 모듈
    setTimeout(() => {   // 가로채였는데 아무 데도 안 갔다 — 남은 길을 알려준다
      $("err").style.display = "block";
      $("err").textContent = "오른쪽 위 홈을 누르고 진단을 다시 시작해 주세요.";
    }, 900);
  };
  $("skip").style.display = "block"; $("skip").textContent = VERIFY ? "그만하고 홈으로" : "이대로 설문 계속";
  $("skip").onclick = e => { e.preventDefault(); pick(VERIFY ? "home" : "survey"); goNext(); };

  // 여기 있던 30초 자동 이동을 없앴다(2026-08-25). 드레이핑 타이머와 같은 부류다 —
  // 유저가 화면을 읽는 중에 대신 골라 넘겨버린다. "다시 찍기"를 누르려던 사람이
  // 그 사이에 설문으로 끌려간다.
  // 막다른 길도 아니다: 두 버튼이 모두 화면에 있고 어느 쪽이든 갈 수 있다.
}

/** photo.html이 gateFail()로 그려 둔 사유 문구. 재촬영 버튼은 우리가 따로 그린다. */
function gateHintOf(doc) {
  const w = doc.querySelector("#status .warn");
  if (!w) return null;
  const c = w.cloneNode(true);
  c.querySelector("#retakeBtn")?.remove();
  return c.innerHTML.trim() || null;
}

// ── 계측 (데이터 운영규약 §6-1) ──
// 이 기능에서 나오는 데이터: 통합측정 1회당 성공 여부와 사유 (scan_unified_measure)
// 남길 것: photo_ok·scan_ok·frame(선택된 정면 프레임 태그)·fail_reason·draping(answered|skipped — 웜쿨 판정 질 지표)
//   ※ timeout 값은 2026-08-25 무응답 자동 스킵 철회로 사라졌다. 과거 적재분에는 남아 있다.
// 안 남길 것: 프레임 이미지·랜드마크 좌표 (헌법 §4 — 얼굴은 기기 밖으로 안 나간다)
// 어디에 남기나: events 테이블 — index.html track()과 같은 스키마·같은 가드
// 대시보드: 통합측정 성공률(photo_ok 비율) — 촬영 단계를 없앤 이 구조의 생사 지표
const SB_URL = "https://qngylynylgqlbidvtbci.supabase.co";
const SB_KEY = "sb_publishable_bGVbZ31O7OX_rnkLVb0i5Q_SDa8JEri";
function track(event, props = {}) {
  if (/^(localhost|127\.|$)/.test(location.hostname)) return;
  if (window.__CHUGU_DEV) return;   // 디버그 빌드 오염 방지 — AppWebView가 심는다
  let uid = null; try { uid = localStorage.getItem("czm_uid"); } catch (e) {}
  try {
    fetch(`${SB_URL}/rest/v1/events`, { method: "POST", keepalive: true,
      headers: { "Content-Type": "application/json", "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` },
      body: JSON.stringify({ user_id: uid, event, props }) });
  } catch (e) {}
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(cond, ms, why) {
  const t0 = Date.now();
  while (!cond()) {
    if (Date.now() - t0 > ms) throw new Error(why);
    await sleep(200);
  }
}

/** 드레이핑 노출 (대표 2026-08-23) — 이 구간만 숨은 iframe을 전면에 띄워 유저가 색 카드를
 *  직접 고른다. photo.html의 drapeCard가 단계 표기("1/2 단계")·질문·힌트·'잘 모르겠어요'
 *  스킵을 전부 갖고 있어, 이 페이지의 예고 문구는 겹말이라 넣지 않는다(한 페이지 = 한 메시지).
 *  photo.html 단독 흐름의 머리(제목·전송 안내·스텝바 1~4)는 앱 통합 흐름에선 맥락이 없다 —
 *  파일 오너십은 건드리지 않고, 같은 origin 문서에 표시용 스타일만 얹어 가린다.
 *
 *  ⚠ 무응답 자동 스킵 철회 (대표 버그 보고 2026-08-25 — "가만히 있었는데 갑자기 다음 단계로
 *  진행되었음"). 여기 있던 DRAPE_IDLE_MS(90초) 타이머가 남은 라운드를 '모름'으로 대신 눌러
 *  버렸다. 유저가 고르지 않은 값이 웜쿨 판정(가중 0.8)에 들어가는 것이라 단순 내비게이션이
 *  아니라 **판정 위조**다 — 헌법 §4 신뢰 보호. 막다른 길 우려는 성립하지 않는다:
 *  drapeCard에 유저가 직접 누르는 '잘 모르겠어요'가 이미 있어 언제든 스스로 넘어갈 수 있다.
 *  기다림에는 상한을 두지 않는다. 고민하는 시간이 길다는 이유로 답을 대신 정하지 않는다. */
async function runDraping(fr, win, doc, t0) {
  // 2026-08-25부터 analyze() 직후에 뜨는 것은 드레이핑이 아니라 브릿지(2-7 "퍼스널컬러 진단을
  // 받아본 적 있으신가요?")다. 드레이핑은 그 뒤에 온다. 예전처럼 drapeCard만 보고 판단하면
  // 브릿지가 떠 있는 동안 "카드가 안 떴다"고 읽어 곧장 스킵해 버린다 — 유저 화면을 통째로 건너뛴다.
  // 둘 중 **아무거나** 떠 있으면 유저에게 보여줄 것이 있다는 뜻이다.
  const shown = () => ["pcAskCard", "drapeCard"].some(id => {
    const el = doc.getElementById(id);
    return el && el.style.display !== "none";
  });
  if (!shown()) return skipDraping(doc);  // 카드가 안 떴으면 종전 경로
  const st = doc.createElement("style");
  // 스텝바 한 줄만 가리면 된다 — 제목·안내문은 2026-08-24 셸 전환으로 1단계 안으로 들어갔고,
  // 드레이핑은 3단계라 그 단계가 통째로 display:none이다.
  st.textContent = "#stepbar{display:none!important}";
  doc.head.appendChild(st);
  Object.assign(fr.style, { display: "block", position: "fixed", inset: "0",
    width: "100%", height: "100%", border: "0", background: "#FAF7FB", zIndex: "10" });
  win.scrollTo(0, 0);   // 숨긴 채 실행된 scrollIntoView 위치를 버리고 카드부터 보이게
  while (true) {
    await sleep(300);
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("chugu_photo_result") || "null"); } catch (e) {}
    if (saved && saved.ts >= t0) {   // finalize()는 마지막 응답과 같은 태스크에서 저장한다
      fr.style.display = "none";     // photo.html 결과 화면이 보이기 전에 되숨김
      const vals = Object.values(win.__pm.state?.draping || {}).filter(v => v != null);
      return vals.some(v => v !== "unknown") ? "answered" : "skipped";
    }
  }
}
// 기존 '모름' 스킵 경로 — 근소 경합이면 finalize()가 r3·r4를 되물어 최대 4라운드다.
async function skipDraping(doc) {
  for (let i = 0; i < 6; i++) {
    const card = doc.getElementById("drapeCard");
    if (!card || card.style.display === "none") break;
    const skip = doc.getElementById("drapeSkip");
    if (!skip) break;
    skip.click();
    await sleep(30);
  }
  return "skipped";
}

/** 통합측정 (대표 2026-08-23) — 스캔의 정면 rgb 프레임을 photo.html의 판정 파이프에
 *  **그대로** 태워 chugu_photo_result를 만든다. 촬영 화면(.photo)이 앱 흐름에서 빠졌으므로
 *  색 3종(chroma·contrast_overall·hue_angle)은 이제 여기서 나온다.
 *
 *  왜 iframe인가: photo.html의 게이트→measureColor→measureStructure→finalize는 인라인
 *  판정 블록이라 import할 수 없다. 복사하면 두 벌이 되고, 두 벌은 언젠가 갈린다(헌법 §3).
 *  photo.html이 검증용으로 노출하는 window.__pm 훅을 숨은 iframe에서 부른다 —
 *  같은 origin(app://local)이라 localStorage도 한 곳이고, 게이트 임계(밝기 55~225·
 *  기울기 ≤12°·얼굴폭 ≥0.18W)·engine_ver·저장 스키마가 photo.html 그 자체다(재구현 0줄).
 *
 *  드레이핑 라운드만 iframe을 화면에 띄워 유저가 직접 고른다(대표 2026-08-23 — 스캔 정면 컷
 *  기반 드레이핑). 응답이 있어야 웜쿨 가중 0.8이 살아나고 '경계' 고정이 풀린다.
 *  그 전(게이트·측정)과 후(finalize)는 종전대로 숨김 자동 진행. 무응답 90초면 기존
 *  '모름' 스킵으로 폴백한다 — 막다른 길을 만들지 않는다. */
async function runPhotoPipe(scan) {
  // 정면 프레임 — 스캔 세션은 front를 1장 저장한다(ScanCoordinator, 정면이탈 ≤12° 통과분).
  // 포즈 태그는 프레임 메타(step)가 정본이다. 태그가 없으면 정면 후보로 취급해 게이트에 맡긴다.
  const fronts = [];
  for (const tag of scan.frames) {
    try {
      const meta = await (await fetch(`${scan.base}/${tag}.json`)).json();
      if (!meta.step || meta.step === "front") fronts.push(tag);
    } catch (e) {}
  }
  console.log(`unified-measure fronts=${fronts.length}/${scan.frames.length} · session=${scan.session}`);
  if (!fronts.length) return { ok: false, reason: "no-front-frame", fronts: 0 };

  const fr = document.createElement("iframe");
  fr.style.display = "none";
  // verify 왕복이면 iframe에도 표식을 단다 — 저장은 full과 같고(photo.html 558행) photo_enter{flow:verify} 계측만 갈린다.
  fr.src = "../photo.html?flow=" + (VERIFY ? "verify" : "full");
  document.body.appendChild(fr);
  try {
    await new Promise((res, rej) => {
      fr.onload = res;
      // 진단 로그(2026-08-24): 이 타임아웃이 곧 "촬영 모듈이 진행 안 됨"의 얼굴이다.
      // 앱 웹뷰가 photo.html 이동을 가로채면 iframe이 아예 안 뜨고 여기서 15초를 태운다.
      // about:blank로 남았는지(가로채임) 로드 중인지(느림)를 로그로 갈라 둔다.
      setTimeout(() => {
        let u = "?"; try { u = fr.contentWindow.location.href; } catch (e) { u = "cross-origin"; }
        console.log(`unified-measure pipe-load-timeout · iframe.url=${u} · src=${fr.src}`);
        rej(new Error("pipe-load-timeout"));
      }, 15000);
    });
    const win = fr.contentWindow, doc = win.document;
    // 판정 엔진 준비 대기 — photo.html의 init()이 MediaPipe를 올리면 pickBtn이 풀린다.
    await waitFor(() => { const b = doc.getElementById("pickBtn"); return b && !b.disabled; },
                  25000, "pipe-init-timeout");
    // 동의 릴레이 — 이 화면은 네이티브 동의 게이트(같은 문안 v1.2, AppFlow .consent)를
    // 통과해야만 온다. 유저가 이미 한 동의를 photo.html의 전송 가드(CONSENT)에 전달한다.
    const chk = doc.getElementById("consentChk");
    if (chk && !chk.checked) { chk.checked = true; chk.dispatchEvent(new win.Event("change")); }

    let hint = null;
    for (const tag of fronts) {
      const img = new win.Image();
      try {
        await new Promise((res, rej) => {
          img.onload = res; img.onerror = () => rej(new Error("frame-load-fail"));
          img.src = `${scan.base}/${tag}_rgb.jpg`;
        });
      } catch (e) { continue; }
      const t0 = Date.now();
      win.__pm.analyze(img);
      // 게이트 탈락(밝기·기울기·거리·기기각도·얼굴) — photo.html이 판정하고 사유까지 써 뒀다.
      if (!win.__pm.state) { hint = hint || gateHintOf(doc); continue; }
      // 드레이핑 — analyze()가 게이트를 통과하면 askDraping("r1")로 drapeCard가 이미 떠 있다.
      const draping = await runDraping(fr, win, doc, t0);
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem("chugu_photo_result") || "null"); } catch (e) {}
      if (saved && saved.ts >= t0) {
        // 출처 표기 — index.html loadPhoto()는 객체를 통째로 돌려주고 아는 필드만 읽으므로
        // 모르는 필드는 무해하다(1184행 확인). 분석에서 촬영분과 구분하는 용도.
        //
        // photo_uri는 **이미 디스크에 있는 파일을 가리키는 줄**이다(ScanWriter가 쓴 _rgb.jpg).
        // 이미지 바이트는 한 줄도 복사하지 않는다. 이 값은 기기 밖으로 나가지 않는다 —
        // 헌법 §4. sbPost·track props에 절대 싣지 않는다(설계서 §5).
        const mark = { src: "scan", frame: tag, session: scan.session,
                       photo_uri: new URL(`${scan.base}/${tag}_rgb.jpg`, location.href).href };
        Object.assign(saved, mark);
        // 방금 photo.html이 쌓은 마지막 shot이 이 측정이다. 같은 표식을 거기에도 심는다.
        const shots = Array.isArray(saved.shots) ? saved.shots : null;
        if (shots && shots.length) Object.assign(shots[shots.length - 1], mark);
        try { localStorage.setItem("chugu_photo_result", JSON.stringify(saved)); } catch (e) {}
        return { ok: true, frame: tag, draping };
      }
      return { ok: false, reason: "finalize-missed", frame: tag, draping };
    }
    return { ok: false, reason: "gate-fail", hint };
  } finally { fr.remove(); }
}

// 검증 훅 — photo.html의 __pm과 같은 성격. 네이티브 없는 브라우저에서 Sample 픽스처로
// iframe 시퀀스(게이트→드레이핑 노출→finalize)를 실제 코드 그대로 돌려보기 위한 노출.
window.__smr = { runPhotoPipe, retakeAsk };

(async () => {
  try {
    const scan = await call("latestScan", {});
    if (!scan?.frames?.length) return fail("스캔 파일을 찾지 못했어요");

    // 1) 3D 스캔 지표 — 사진이 못 재는 것(콧대 돌출 등). 기존 경로 그대로.
    let scanOk = false, scanReason = null;
    try {
      const r = await measureScan(scan, { mpBase: "../../mp" });
      if (r.m) {
        const cov = coverage(r.m);
        localStorage.setItem("chugu_scan_result", JSON.stringify({
          v: 1, ts: Date.now(), session: scan.session, frame: r.frameTag,
          have: cov.have, m: r.m,
        }));
        console.log(`scan-measure ok · session=${scan.session} frame=${r.frameTag} 커버리지=${cov.have.length}/15 · nose_projection=${r.m.nose_projection}`);
        scanOk = true;
      } else scanReason = r.reason;
    } catch (e) { scanReason = String(e?.message || e); }

    // 2) 색·구조 통합측정 — 같은 스캔의 정면 프레임을 photo.html 파이프로.
    let photo;
    try { photo = await runPhotoPipe(scan); }
    catch (e) { photo = { ok: false, reason: String(e?.message || e) }; }

    track("scan_unified_measure", {
      photo_ok: photo.ok, scan_ok: scanOk, frame: photo.frame || null,
      draping: photo.draping || null,   // answered|skipped — 웜쿨 판정 질 지표 (timeout은 2026-08-25 폐지)
      fail_reason: photo.ok && scanOk ? null :
        [photo.ok ? null : "photo:" + photo.reason, scanOk ? null : "scan:" + scanReason]
          .filter(Boolean).join(" · "),
    });

    // 색을 못 재면 리포트에 퍼스널컬러가 통째로 빠진다. 오염된 값을 지어내지 않는다 —
    // chugu_photo_result는 쓰지 않았다. 대신 사유를 알리고 다시 찍을 기회를 준다.
    if (!photo.ok) {
      console.log(`unified-measure fail · reason=${photo.reason} fronts=${photo.fronts ?? "?"} hint=${photo.hint ? "y" : "n"}`);
      return retakeAsk(photo.hint, photo.reason);
    }

    // 스캔 지표(scanOk)는 보조라 결측이어도 진행한다 — 색·구조는 이미 손에 있다.
    $("dot").style.animation = "none"; $("dot").style.opacity = ".55";
    $("t").textContent = "측정이 끝났어요";
    $("s").textContent = VERIFY ? "홈으로 돌아갑니다." : "이제 몇 가지만 물어볼게요.";
    $("next").style.display = "block";
    // 사용자가 버튼을 누르기 전에 넘어가면 "뭐가 지나간 거지"가 된다. 잠깐 보여주고 자동 진행.
    setTimeout(goNext, 1400);
  } catch (e) {
    fail(String(e?.message || e));
  }
})();
</script>
