<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>추구미즘 · 강의 진단</title>
<!--
  강의용 진단 흐름 (2026-08-18 충북여성새로일하기센터)
  대표 확정 2026-08-17:
    ① 퍼스널컬러 = 현장 상호진단 후 **직접 입력** (촬영 색 판정은 아직 6/12라 쓰지 않는다)
    ② 정면 촬영 → 이목구비·얼굴형 **측정만**
    ③ 설문 35문항
    ④ 셋을 종합한 리포트 — **관찰 서술**로. 등급 판정은 하지 않는다(밴드 기준선이 아직 없다)

  ⚠ 유저향 문구 [마케팅 검수 전]
-->
<style>
:root{--bg:#FBFAF8;--card:#fff;--ink:#1E1B18;--sub:#6B635C;--line:#EBE6E0;--accent:#C9756B;--soft:#F5EFEA;--ok:#5B8C6E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:44px}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.02em}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.hd small{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:13px;color:var(--sub);margin:0 0 10px;font-weight:600}
.lead{font-size:18px;line-height:1.5;margin:0 0 4px;letter-spacing:-.01em}
.note{font-size:13px;color:var(--sub);margin:6px 0 0}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;margin-top:12px;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500}
.btn.quiet{background:none;border:0;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px 0;width:auto;margin:8px auto 0}
.btn[disabled]{opacity:.4;pointer-events:none}
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.pc{padding:14px 10px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center;font-size:15px}
.pc.sel{border-color:var(--accent);background:var(--soft);font-weight:700}
.steps{margin-bottom:14px}
.step{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:9px;text-decoration:none;color:inherit}
.step .n{flex:0 0 24px;height:24px;border-radius:99px;background:var(--soft);color:var(--sub);font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.done .n{background:var(--ok);color:#fff}
.step .t{font-size:15.5px}
.step .m{font-size:12.5px;color:var(--sub);margin-top:3px}
.obs{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;background:var(--soft);border-radius:12px;padding:14px 15px;align-items:baseline}
.obs-l{font-size:12.5px;color:var(--sub)} .obs-v{font-size:15px;font-weight:600}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--sub)}
.hero{background:linear-gradient(160deg,#FDF6F3,#F6F1F5);border-color:#EFE3E0}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 0}
.sub13{font-weight:400;font-size:13px;color:var(--sub)}
.prow{padding:11px 0;border-top:1px solid rgba(0,0,0,.06)}
.prow b{font-size:14px} .plabel{font-size:12px;color:var(--sub);margin-left:7px}
.pline{font-size:13px;color:var(--ink);opacity:.85;line-height:1.65;margin-top:4px}
.pdots{font-size:11px;color:var(--sub);letter-spacing:2px;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 4px}
.chips i{aspect-ratio:1;border-radius:9px;border:1px solid rgba(0,0,0,.07)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="czm-core.js?v=398133e"></script>
<script>
const $=id=>document.getElementById(id), app=$("app");
const K=CZM.KEYS, LS=CZM.store;
const LKEY="chugu_lecture";            // {pc8:"romantic", age:"20-39", at:"..."}
const FKEY="chugu_lecture_face";       // photo-module?flow=lecture 산출
const esc=s=>String(s).replace(/[<&]/g,c=>({"<":"&lt;","&":"&amp;"}[c]));
const MODV = /^(localhost|127\.|$)/.test(location.hostname) ? `?t=${Date.now()}` : "?v=398133e";

// 규준 대조 — docs/규준대조_얼굴계측_norms_v1_2026-08-17.md · face_norms_v1.json
// 규칙: mapping이 direct·converted인 것만 쓴다. 비율의 SD는 어떤 필드에도 없으므로
//       "어느 쪽"까지만 말하고 **"상위 몇 %"는 말하지 않는다.**
// 19개 필드 중 15개는 대응 불가로 판정됐다 — 그건 실패가 아니라 정확한 결과다.
// 억지로 붙이면 강의 현장에서 참석자에게 틀린 말을 하게 된다.
let NORMS=null, PRESC=null, PALETTE=null;
// 색 섹션 — 대표 지적 2026-08-17:
// "겨울 스트롱"이라고만 쓰면 유저는 그게 뭔지 모른다. 이름은 정보가 아니다.
// ① 추구미가 그 색을 쓰는 이유 → ② 오늘 진단받은 내 색 → ③ 오늘 해볼 것, 순으로 잇는다.
// 색 이름·색칩은 전부 기존 자산에서 온다(처방DB·교구 팔레트). 여기서 색을 만들지 않는다.
function colorSection(wantKey, myPC){
  if(!PRESC) return null;
  const wantPC=(CZM.PC8.find(t=>t.key===wantKey)||{});
  // 처방DB에 아직 안 채워진 칸이 있다("(아래 12번 추출분 반영)"·"(동)").
  // 자리표시자를 그대로 화면에 내보내면 유저는 그걸 색 이름으로 읽는다. 없는 것은 없다고 다룬다.
  const real=v=>v && !/^\(.*\)$/.test(v.trim()) ? v : null;
  const nameOf=lbl=>{
    const row=PRESC.types[lbl] || PRESC.types[(CZM.PC8.find(t=>t.label===lbl)||{}).master];
    if(!row) return null;
    const b=real(row.best); if(!b) return null;
    return {best:b, second:real(row.second), accessory:real(row.accessory)};
  };
  const chips=lbl=>{
    const pal=PALETTE && PALETTE.palettes && (PALETTE.palettes[lbl] ||
              PALETTE.palettes[(CZM.PC8.find(t=>t.label===lbl)||{}).master]);
    return pal && pal.best ? `<div class="chips">${pal.best.slice(0,10).map(h=>`<i style="background:${h}"></i>`).join("")}</div>` : "";
  };
  return { mine:nameOf(myPC), want:nameOf(wantPC.label),
           mineChips:chips(myPC), wantChips:chips(wantPC.label), wantLabel:wantPC.label };
}

function normLines(r,l,age){
  if(!NORMS) return [];
  const F=k=>NORMS.fields.find(f=>f.field===k);
  const out=[];

  // ① 눈 사이 — 유일한 직접 대응. 유저가 고른 연령대 행을 쓴다.
  const io=F("interocular");
  if(io && r.interocular!=null){
    const m=io.norm_mean[age] ?? io.norm_mean[io.recommended_row];
    const d=r.interocular-m;
    out.push({t:"눈 사이", v:`${r.interocular.toFixed(2)}`,
      s:`같은 또래 평균 ${m} — ${Math.abs(d)<0.05?"거의 같아요":d>0?"조금 넓은 쪽이에요":"조금 좁은 쪽이에요"}`});
  }

  // ② 눈꼬리 — 변환 필요. 유일하게 SD가 있어 "평균 범위"를 말할 수 있다.
  const ea=F("eye_angle");
  if(ea && l.eye_angle!=null && r.eye_len){
    const deg=Math.asin((l.eye_angle/100)/r.eye_len)*180/Math.PI;
    const within=Math.abs(deg-ea.norm_mean)<=ea.norm_sd;
    out.push({t:"눈꼬리 기울기", v:`${deg.toFixed(1)}°`,
      s:`평균 ${ea.norm_mean}° — ${within?"평균 범위 안이에요":deg>ea.norm_mean?"조금 더 올라간 쪽이에요":"조금 더 내려간 쪽이에요"}`});
  }

  // ③ 눈 길이 — 변환값, SD 없음. "비슷한 수준"까지만.
  const el=F("eye_len");
  if(el && r.eye_len!=null){
    const d=r.eye_len-el.norm_mean;
    out.push({t:"눈 길이", v:`${r.eye_len.toFixed(3)}`,
      s:`평균 ${el.norm_mean} — ${Math.abs(d)<0.01?"비슷한 수준이에요":d>0?"긴 쪽이에요":"짧은 쪽이에요"}`});
  }
  return out;
}

// ── 회차 관리 ───────────────────────────────────────────────
// 링크로 새로 들어오면 **처음부터** 시작한다. 지난 사람 결과가 남아 바로 리포트로 튀면 안 된다.
// 다만 흐름 중간에 촬영·설문으로 나갔다 오는 것은 같은 회차다 —
// sessionStorage는 그 왕복에서는 살아 있고, 링크를 새로 열면 사라진다. 딱 맞는 그릇이다.
const RUN="czm_lec_run";
function runStart(){
  try{
    if(sessionStorage.getItem(RUN)) return +sessionStorage.getItem(RUN);
    const t=Date.now();
    sessionStorage.setItem(RUN, String(t));
    // 이번 회차 것만 지운다. chugu_diag는 웹 진단과 공유하는 키라 **지우지 않는다** —
    // 대신 "이 회차에 새로 한 설문인가"를 시각으로 가린다(아래 state).
    LS.del(LKEY); LS.del(FKEY);
    ["face","diag"].forEach(k=>sessionStorage.removeItem("czm_lec_sent_"+k));
    return t;
  }catch(e){ return 0; }
}
const RUN_TS=runStart();

const state=()=>{
  const d=LS.get(K.diag,null);
  return {
    pc:   LS.get(LKEY,null),
    face: LS.get(FKEY,null),
    // 이번 회차에 새로 마친 설문만 인정한다. 예전에 웹으로 진단한 기록이 남아 있어도 건너뛰지 않는다.
    diag: (d && (d.ts||0) >= RUN_TS) ? d : null,
  };
};

function head(sub){ return `<div class="hd"><h1>추구미즘</h1><small>${sub}</small></div>`; }

// ── ① 퍼스널컬러 직접 입력 ──────────────────────────────────
// 8타입 라벨은 계약층(czm-core.js PC8)이 소유한다. 여기 복사하지 않는다 —
// 두 칸(봄 클리어·겨울 스트롱)이 이론팀 확정 대기라 바뀔 수 있다.
function renderPC(){
  const cur=(state().pc||{}).pc8;
  app.innerHTML = head("1 / 3") + `<div class="card">
    <p class="lead">진단받은 퍼스널컬러를 골라주세요.</p>
    <p class="note">서로 봐준 결과 그대로 눌러주시면 바로 다음으로 넘어가요.</p>
    <div class="pcgrid">${CZM.PC8.map(t=>
      `<button class="pc${cur===t.key?" sel":""}" data-k="${t.key}">${esc(t.label)}</button>`).join("")}</div>
    </div>`;
  app.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{
    LS.set(LKEY,{pc8:b.dataset.k, at:new Date().toISOString()});
    // 고른 게 눈에 보이게 잠깐 두고 넘어간다 — 바로 화면이 바뀌면 뭘 눌렀는지 모른다
    app.querySelectorAll(".pc").forEach(x=>x.classList.toggle("sel", x===b));
    setTimeout(route, 420);
  });
}

// ── ①-2 연령대 ────────────────────────────────────────────
// 규준이 나이대로 갈린다(눈 사이 20-39세 1.38 / 40-59세 1.33). 안 물으면 틀린 값과 견주게 된다.
// 화면에는 나이대를 적지 않는다 — "40~59세 평균"이라고 쓰면 듣기 좋을 리가 없다.
const AGES=[["20-39","20~30대"],["40-59","40~50대"],["60-79","60대 이상"]];
function renderAge(){
  const cur=(state().pc||{}).age;
  app.innerHTML = head("2 / 3") + `<div class="card">
    <p class="lead">연령대만 알려주세요.</p>
    <p class="note">또래 평균과 견주려고요. 나이대마다 평균이 달라서요.</p>
    <div class="pcgrid" style="grid-template-columns:1fr">${AGES.map(([k,lbl])=>
      `<button class="pc${cur===k?" sel":""}" data-a="${k}">${lbl}</button>`).join("")}</div>
    </div>`;
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const cur=state().pc||{};
    LS.set(LKEY,{...cur, age:b.dataset.a});
    app.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("sel", x===b));
    setTimeout(route, 420);
  });
}

// ── 순차 라우터 ─────────────────────────────────────────────
// 대표 지적 2026-08-17: 허브로 두면 매번 돌아와서 다음 걸 눌러야 해 불편하다.
// 안 끝난 단계로 **알아서 넘어간다.** 유저가 고를 것은 퍼스널컬러 하나뿐이다.
//
// ⚠ 되돌아오기 함정: 촬영이 실패해 데이터가 안 남으면 다시 촬영으로 보내고,
//   또 실패하면 무한히 오간다. 세션당 한 번만 자동으로 보내고, 그다음엔 손으로 고르게 한다.
const sent=k=>{ try{ return sessionStorage.getItem("czm_lec_sent_"+k)==="1"; }catch(e){ return false; } };
const mark=k=>{ try{ sessionStorage.setItem("czm_lec_sent_"+k,"1"); }catch(e){} };

function route(){
  const s=state();
  if(!s.pc)        return renderPC();
  if(!s.pc.age)    return renderAge();
  if(!s.face){ if(!sent("face")){ mark("face"); location.href="../photo.html?flow=lecture"; return; } return renderStuck("얼굴 촬영","photo-module.html?flow=lecture"); }
  if(!s.diag){ if(!sent("diag")){ mark("diag"); location.href="../index.html?flow=lecture"; return; } return renderStuck("설문","../index.html?flow=lecture"); }
  renderReport();
}

// 자동 이동이 한 번 실패한 뒤의 화면 — 사람이 직접 고르게 한다
function renderStuck(what, href){
  app.innerHTML = head("이어서") + `<div class="card">
    <p class="lead">${esc(what)}이(가) 아직 안 끝났어요.</p>
    <p class="note">중간에 끊겼을 수 있어요. 다시 해볼까요?</p>
    <a class="btn" href="${href}">${esc(what)} 하러 가기</a>
    <button class="btn quiet" id="reset">처음부터 다시</button></div>`;
  $("reset").onclick=resetAll;
}

function resetAll(){
  [LKEY,FKEY].forEach(k=>LS.del(k));
  try{ sessionStorage.removeItem(RUN); ["face","diag"].forEach(k=>sessionStorage.removeItem("czm_lec_sent_"+k)); }catch(e){}
  location.reload();   // 회차를 새로 연다
}

// ── ④ 통합 리포트 ──────────────────────────────────────────
// 대표 지시 2026-08-17: 설문 리포트처럼 **한 장으로** 나오고,
//   "평균 대비 어떤가 → 나는 어디가 어떤 편인가 → 그래서 어떤 인상인가"까지 이어져야 한다.
//
// ⚠ "어떤 인상"은 해석이다. 개발팀이 지어내지 않는다 —
//   이론팀의 부위 리포트 엔진(part-report.js + asset-score.js)이 그 일을 한다.
//   설문 리포트 3절이 쓰는 바로 그 엔진이라, 두 화면의 말이 갈리지 않는다.
function partSection(face){
  const P=window.__PART;
  if(!P||!P.SNAP||!face) return {html:"", narr:""};
  try{
    const m={...face.ratio, ...face.line};   // 강의 흐름은 색을 재지 않는다 → 색 지표는 결측으로 간다
    const {ref,dist}=P.SNAP;
    const one=P.AS.scoreOne(m, ref, dist);
    const rows=P.PR.buildPartRows(one, {n:dist.n});
    const overall=one.overallType && one.overallType.type;
    const narr=P.PR.summaryNarrative(rows, overall, !!one.energeticSignal, null);
    // 대표 지적 2026-08-17: "이번엔 흐리게 보였어요"는 측정 실패인지 안 잰 건지 구분이 안 된다.
    // 강의 흐름은 색을 **일부러** 안 잰다. 못 읽은 칸은 문장을 지어내지 말고 그냥 빼고,
    // 몇 군데를 봤는지만 밝힌다. 안 보여주는 것이 모르는 말을 하는 것보다 낫다.
    const shown=rows.filter(r=>r.line);
    const list=shown.map(r=>`
      <div class="prow">
        <b>${r.part}</b>
        <div class="pline">${r.line}</div>
      </div>`).join("");
    return {html:list, narr:narr||"", seen:shown.length};
  }catch(e){ console.warn("부위 리포트 실패", e); return {html:"", narr:""}; }
}

function renderReport(){
  const s=state();
  const pcLabel=(CZM.PC8.find(t=>t.key===s.pc.pc8)||{}).label;
  const N=CZM.TYPE_NAMES, r=s.face.ratio, l=s.face.line;
  const wantName=N[s.diag.want]??s.diag.want, haveName=N[s.diag.have]??s.diag.have;

  // 격차는 축 이름을 던지지 않고 문장으로 말한다. 화법은 설문 리포트 4절(정본 §3-4)에서 가져온다.
  // gap_axis = 추구미 − 지금 → 부호가 가리키는 것은 **지금 내가 어느 쪽에 있는가**다.
  const g=s.diag.gap_axis||{}, parts=[];
  if(Number.isFinite(g.D)&&g.D!==0) parts.push(g.D>0?"부드러운":"또렷한");
  if(Number.isFinite(g.T)&&g.T!==0) parts.push(g.T>0?"따뜻한":"시원한");
  if(Number.isFinite(g.M)&&g.M!==0) parts.push(g.M>0?"어려 보이는":"차분한");

  const part=partSection(s.face), norms=normLines(r,l,(s.pc||{}).age), col=colorSection(s.diag.want, pcLabel);

  // 해설 골격 (대표 확정 2026-08-17): 가진 것 → 가고 싶은 방향 → 시도 → 주의.
  // "그런데 당신 색은 ~"처럼 대립시키면 유저가 자기가 잘못된 줄 안다(결핍 화법 금지·헌법 §4).
  app.innerHTML = head("결과") + `
    <div class="card hero">
      <p class="note" style="margin:0">오늘의 진단</p>
      <p class="big">${esc(pcLabel)}</p>
      <div class="obs" style="margin-top:14px">
        <div class="obs-l">지금 나의 매력</div><div class="obs-v">${esc(haveName)}</div>
        <div class="obs-l">추구미</div><div class="obs-v">${esc(wantName)}</div>
      </div>
    </div>

    <div class="card"><h2>지금 내가 가진 것</h2>
      ${part.narr?`<p class="lead">${part.narr}</p>`:``}
      ${part.html||""}
      ${part.seen?`<p class="note">사진에서 또렷하게 읽힌 ${part.seen}군데예요.</p>`:``}
      ${col&&col.mine?`
        <p class="lead" style="margin-top:18px">${esc(pcLabel)}에 잘 받는 색이에요.</p>
        ${col.mineChips}
        <p class="note">${esc(col.mine.best)}${col.mine.second?`<br>곁들이면 좋은 색: ${esc(col.mine.second)}`:``}${col.mine.accessory?`<br>소품: ${esc(col.mine.accessory)}`:``}</p>`:``}
    </div>

    <div class="card"><h2>만들어가고 싶은 방향</h2>
      <p class="lead">${esc(wantName)}</p>
      ${parts.length?`<p class="note" style="font-size:14px;color:var(--ink)">지금은 ${esc(wantName)}보다 ${parts.join(" 쪽, ")} 쪽에 있어요.</p>`:``}
      ${col&&col.want?`
        ${col.wantChips}
        <p class="note">${esc(wantName)} 매력은 이런 색으로 만들어져요 — ${esc(col.want.best)}</p>`:``}
    </div>

    <div class="card"><h2>시도해보면 좋은 것</h2>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.75">
        ${col&&col.mine?`· <b>얼굴 가까이</b>(립·스카프·상의 목선)엔 잘 받는 색을 두세요. 얼굴이 사는 자리예요.<br>`:``}
        ${col&&col.want?`· <b>얼굴에서 먼 곳</b>(하의·가방·신발)엔 ${esc(wantName)} 색을 써보세요. 인상은 그쪽이 만들어요.<br>`:``}
        · 한 번에 하나만 바꿔보세요. 무엇이 달라졌는지 알 수 있어요.</p>
    </div>

    <div class="card"><h2>다만 이건 주의하세요</h2>
      <p class="note" style="font-size:14px;line-height:1.75">
        · 한꺼번에 다 바꾸면 어색해져요. 오늘은 하나만으로 충분해요.<br>
        ${norms.length?`· 아래 견줌은 <b>눈 쪽만</b> 가능해요. 얼굴형·코·입·턱은 연구마다 재는 방법이 달라서 지금 비교하면 정확하지 않아요.<br>`:``}
        · 사진은 조명과 각도에 따라 값이 조금씩 달라져요. 오늘 한 장의 결과예요.</p>
    </div>

    ${norms.length?`<div class="card"><h2>또래 평균과 견주면</h2>
      <div class="obs">${norms.map(x=>
        `<div class="obs-l">${x.t}</div><div class="obs-v">${x.v}<br><span class="sub13">${x.s}</span></div>`).join("")}</div>
      <p class="note">한국 여성 계측 연구 기준이에요.</p></div>`:``}

    <div class="card"><h2>측정값</h2>
      <div class="obs">
        <div class="obs-l">얼굴 세로:가로</div><div class="obs-v">${(+r.face_HW).toFixed(2)}</div>
        <div class="obs-l">3분할</div><div class="obs-v">${(+r.upper).toFixed(3)} · ${(+r.mid).toFixed(3)} · ${(+r.lower).toFixed(3)}</div>
        <div class="obs-l">턱선 각도</div><div class="obs-v">${(+l.jaw_angular_deg).toFixed(1)}°</div>
        <div class="obs-l">턱끝 각도</div><div class="obs-v">${(+l.chin_angle_deg).toFixed(1)}°</div>
      </div>
      <p class="note">비교할 기준이 아직 없는 값들이에요. 측정한 그대로 보여드려요.</p>
    </div>

    <button class="btn quiet" id="back">처음부터 다시</button>`;
  $("back").onclick=resetAll;
}

// 규준 자료는 조사 산출물이 원천이다. 여기 숫자를 복사하지 않는다 —
// 복사하면 조사가 갱신돼도 화면은 옛 수치를 계속 보여준다.
Promise.all([
  // 캐시 무력화 — 054에서 낡은 모듈을 재고 "고쳤다"고 보고하는 사고가 났다.
  // "?v=398133e"는 배포 시 커밋 해시로 치환되고(deploy_survey.sh), 로컬은 매번 새 값이다.
  import(`./asset-score.js${MODV}`), import(`./part-report.js${MODV}`),
  fetch("dist-snapshot.json").then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([AS,PR,SNAP])=>{ window.__PART={AS,PR,SNAP}; }).catch(e=>console.warn("부위 엔진 로드 실패",e))
 .finally(()=>{
Promise.all([
  fetch("face-norms.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch("pc-prescription.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch("pc-palette.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([a,b,c])=>{ NORMS=a; PRESC=b; PALETTE=c; })
  .catch(()=>{})
  .finally(route); });
</script>
</body>
</html>
