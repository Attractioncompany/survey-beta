function pickTips(gapAxis, wantName, myPC, gender){
  if(!TIPS||!DICT||!ENGINE) return [];
  let cells=[];
  // skill 칸만 보던 것을 넓혔다 — 사전의 item 칸에도 조언이 붙어 있는데 통째로 버려지고 있었다
  // (실측 2026-08-18: 칸 4개 중 skill 1개만 남아 팁이 1건밖에 안 나왔다).

  catch(e){ return []; }

  const row=PRESC && (PRESC.types[myPC] || PRESC.types[(CZM.PC8.find(t=>t.label===myPC)||{}).master]);
  const real=v=>v && !/^\(.*\)$/.test(v.trim()) ? v : null;
  const short=v=>{
    let x=v.split("※")[0].replace(/\([^)]*\)/g,"").replace(/[,·+]\s*$/,"").trim();
    if(x.length<=18) return x;
    x=x.split("+")[0].trim();
    if(x.length<=18) return x;
    const q=x.split("·"); let acc=q[0];
    for(let i=1;i<q.length && (acc+"·"+q[i]).length<=18;i++) acc+="·"+q[i];
    return acc;
  };
  const fill=txt=>txt.replace(/\{pc\.(best|second|accessory)\}/g, (_,k)=>{
    const v=row && real(row[k]); return v ? short(v) : "\u0000";  // 채울 값이 없으면 표식을 남겨 그 팁을 버린다
  });

  const out=[];
  for(const c of cells){
    // makeup=메이크업 전제(여성) · gender=그 성별 전용. 성별을 모르면 전용 팁은 내지 않는다.
    const cand=TIPS.tips.filter(t=>t.cell===c.id
      && !(t.makeup && gender && gender!=="f")
      && !(t.gender && t.gender!==gender));
    if(!cand.length) continue;
    // 구체성 우선: 추구미 일치 > 공통. 무과금을 앞에 둔다(신뢰 보호 4조 — 유과금만 조언하지 않는다).
    cand.sort((a,b)=>((b.want===wantName)-(a.want===wantName)) || ((a.cost==="paid")-(b.cost==="paid")));
    let taken=0;
    for(const t of cand){
      const tip=fill(t.tip);
      if(tip.includes("\u0000")) continue;               // 자리표시자(겨울 딥 등) → 내지 않는다
      if(t.cost==="paid" && out.some(o=>o.cost==="paid")) continue;  // 유과금은 통틀어 1건까지
      out.push({...t, tip, why:fill(t.why||""), caution:t.caution?fill(t.caution):null, step:c.copy});
      if(++taken>=2) break;                              // 칸당 2건까지
    }
    if(out.length>=4) break;                             // 통틀어 4건 — 더 늘면 "다 바꾸라"가 된다
  }
  // 같은 팁이 두 번 나오지 않게(대표 지적 2026-08-18). 칸이 달라도 본문이 같으면 중복이다.
  const seen=new Set();
  return out.filter(t=>{ const k=t.id||t.tip; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,4);
}

function colorSection(wantKey, myPC){
  if(!PRESC) return null;
  const wantPC=(CZM.PC8.find(t=>t.key===wantKey)||{});
  // 처방DB에 아직 안 채워진 칸이 있다("(아래 12번 추출분 반영)"·"(동)").
  // 자리표시자를 그대로 화면에 내보내면 유저는 그걸 색 이름으로 읽는다. 없는 것은 없다고 다룬다.
  const real=v=>v && !/^\(.*\)$/.test(v.trim()) ? v : null;
  const nameOf=lbl=>{
    const row=PRESC.types[lbl] || PRESC.types[(CZM.PC8.find(t=>t.label===lbl)||{}).master];
    if(!row) return null;
    const b=real(row.best); if(!b) return null;
    return {best:b, second:real(row.second), accessory:real(row.accessory)};
  };
  const hexOf=lbl=>{
    const pal=PALETTE && PALETTE.palettes && (PALETTE.palettes[lbl] ||
              PALETTE.palettes[(CZM.PC8.find(t=>t.label===lbl)||{}).master]);
    return (pal && pal.best) ? pal.best.slice(0,10) : [];
  };
  const chips=lbl=>{ const h=hexOf(lbl);
    return h.length ? `<div class="chips">${h.map(x=>`<i style="background:${x}"></i>`).join("")}</div>` : ""; };
  return { mine:nameOf(myPC), want:nameOf(wantPC.label),
           mineChips:chips(myPC), wantChips:chips(wantPC.label),
           mineHex:hexOf(myPC), wantHex:hexOf(wantPC.label), wantLabel:wantPC.label };
}

function normLines(r,l,age,gender){
  if(!NORMS) return [];
  // 규준 원전이 전부 한국 **여성** 표본이다(S1 여성 40 · S2 여성 192 · S3 여성 31).
  // 남성에게 이 평균을 들이대면 틀린 말을 하게 된다 — 없는 것은 없다고 다룬다.
  if(gender && gender!=="f") return [];
  const F=k=>NORMS.fields.find(f=>f.field===k);
  const out=[];

  // ① 눈 사이 — 유일한 직접 대응. 유저가 고른 연령대 행을 쓴다.
  // 대표 지시 2026-08-18: 수치를 그대로 두지 말고 **판정을 앞세운다.**
  //   유저에게 "0.204"는 아무 뜻도 없다. 판정이 먼저고 숫자는 근거로 뒤에 붙인다.
  const io=F("interocular");
  if(io && r.interocular!=null){
    const m=io.norm_mean[age] ?? io.norm_mean[io.recommended_row];
    const d=r.interocular-m;
    out.push({t:"눈 사이", v:Math.abs(d)<0.05?"또래 평균과 거의 같아요":d>0?"조금 넓은 편이에요":"조금 좁은 편이에요",
      s:`측정값 ${r.interocular.toFixed(2)} · 또래 평균 ${m}`});
  }

  // ② 눈꼬리 — 변환 필요. 유일하게 SD가 있어 "평균 범위"를 말할 수 있다.
  //    ⚠ 밴드 판정(eye_angle)과 **같은 것을 잰다.** 둘을 나란히 두면
  //    "올라간 눈매"와 "평균보다 내려간 쪽" 이 모순으로 읽힌다(실측 2026-08-18).
  //    그래서 방향과 평균 대비를 한 문장으로 합치고, 밴드 줄은 리포트에서 뺀다.
  const ea=F("eye_angle");
  if(ea && l.eye_angle!=null && r.eye_len){
    const deg=Math.asin((l.eye_angle/100)/r.eye_len)*180/Math.PI;
    const within=Math.abs(deg-ea.norm_mean)<=ea.norm_sd;
    const dir=deg>1?"올라간 눈매":deg<-1?"내려간 눈매":"수평에 가까운 눈매";
    const cmp = within ? `또래 평균(${ea.norm_mean.toFixed(1)}°)과 비슷한 정도예요`
      : deg < 0 ? `또래 평균은 ${ea.norm_mean.toFixed(1)}° 올라간 쪽인데, 반대로 내려가 있어요`
      : deg > ea.norm_mean ? `또래 평균 ${ea.norm_mean.toFixed(1)}°보다 더 올라간 편이에요`
      : `올라가 있긴 한데 또래 평균 ${ea.norm_mean.toFixed(1)}°보다는 완만해요`;
    out.push({t:"눈매", v:dir, own:"eye_angle", s:`${deg.toFixed(1)}° — ${cmp}`});
  }

  // ③ 눈 길이 — 변환값, SD 없음. "비슷한 수준"까지만.
  const el=F("eye_len");
  if(el && r.eye_len!=null){
    const d=r.eye_len-el.norm_mean;
    out.push({t:"눈 길이", v:Math.abs(d)<0.01?"또래 평균과 비슷해요":d>0?"긴 편이에요":"짧은 편이에요",
      s:`측정값 ${r.eye_len.toFixed(3)} · 또래 평균 ${el.norm_mean}`});
  }
  return out;
}

// ── 회차 관리 ───────────────────────────────────────────────
// 링크로 새로 들어오면 **처음부터** 시작한다. 지난 사람 결과가 남아 바로 리포트로 튀면 안 된다.
// 다만 흐름 중간에 촬영·설문으로 나갔다 오는 것은 같은 회차다 —
// sessionStorage는 그 왕복에서는 살아 있고, 링크를 새로 열면 사라진다. 딱 맞는 그릇이다.
const RUN="czm_lec_run", DONE="czm_lec_done", AWAY="czm_lec_away";
function runStart(){
  try{
    const prev=sessionStorage.getItem(RUN);
    // 리포트까지 본 회차는 **끝난 회차**다. 같은 탭에서 링크를 다시 열면 sessionStorage가
    // 그대로 살아 있어서, 이걸 안 보면 다음 사람에게 앞사람 결과가 뜬다(현장 제보 2026-08-18).
    // 강의장은 기기를 돌려쓴다 — 끝난 회차 위에 새로 들어오면 처음부터다.
    if(prev && !sessionStorage.getItem(DONE)) return +prev;
    const t=Date.now();
    sessionStorage.setItem(RUN, String(t));
    sessionStorage.removeItem(DONE);
    sessionStorage.removeItem(AWAY);
    // 이번 회차 것만 지운다. chugu_diag는 웹 진단과 공유하는 키라 **지우지 않는다** —
    // 대신 "이 회차에 새로 한 설문인가"를 시각으로 가린다(아래 state).
    LS.del(LKEY); LS.del(FKEY);
    ["face","diag"].forEach(k=>sessionStorage.removeItem("czm_lec_sent_"+k));
    return t;
  }catch(e){ return 0; }
}
const RUN_TS=runStart();

const state=()=>{
  const d=LS.get(K.diag,null);
  return {
    pc:   LS.get(LKEY,null),
    face: LS.get(FKEY,null),
    // 이번 회차에 새로 마친 설문만 인정한다. 예전에 웹으로 진단한 기록이 남아 있어도 건너뛰지 않는다.
    diag: (d && (d.ts||0) >= RUN_TS) ? d : null,
  };
};

// 되살리려면 이 커밋의 renderAge/AGES와 normLines 호출을 함께 되돌린다.

// ── 순차 라우터 ─────────────────────────────────────────────
// 대표 지적 2026-08-17: 허브로 두면 매번 돌아와서 다음 걸 눌러야 해 불편하다.
// 안 끝난 단계로 **알아서 넘어간다.** 유저가 고를 것은 퍼스널컬러 하나뿐이다.
//
// ⚠ 되돌아오기 함정: 촬영이 실패해 데이터가 안 남으면 다시 촬영으로 보내고,
//   또 실패하면 무한히 오간다. 세션당 한 번만 자동으로 보내고, 그다음엔 손으로 고르게 한다.
const sent=k=>{ try{ return sessionStorage.getItem("czm_lec_sent_"+k)==="1"; }catch(e){ return false; } };
const mark=k=>{ try{ sessionStorage.setItem("czm_lec_sent_"+k,"1"); }catch(e){} };

// 인트로를 건너뛸 자격은 **우리가 방금 내보냈다가 돌아온 경우**뿐이다.
// 촬영·설문으로 보내기 직전에 away 표식을 남기고, 돌아온 첫 로드에서 한 번 쓰고 지운다.
// (촬영 이력으로 판단하면 앞사람 흔적이 남은 기기에서 다음 사람이 인트로를 못 본다)
let INTRO_DONE=false;
try{ if(sessionStorage.getItem(AWAY)){ INTRO_DONE=true; sessionStorage.removeItem(AWAY); } }catch(e){}
const goAway = url => { try{ sessionStorage.setItem(AWAY,"1"); }catch(e){} location.href=url; };
// 8타입 구미를 다 띄운다 — "이 중에 내 추구미가 있다"가 한눈에 읽히게(대표 지시 2026-08-18).
const GUMI8=["romantic","pure","elegant","energetic","gorgeous","classic","charisma","chic"];
function renderIntro(){
  document.body.classList.add("intro-mode"); document.body.classList.remove("report-mode");
  app.innerHTML = `<div class="intro">
    <div class="gumi-grid">${GUMI8.map(k=>
      `<img src="../bg/char_${k}.png" alt="" loading="eager">`).join("")}</div>

      <h1>추구미즘</h1>
      <p>지금부터 현재 나의 매력과,<br>나의 추구미를 찾아볼게요.</p>
    </div>
    <button class="btn" id="go">진단 및 설문 시작하기</button>
  </div>`;
  $("go").onclick=()=>{ document.body.classList.remove("intro-mode"); INTRO_DONE=true; route(); };
}

function route(){
  document.body.classList.remove("intro-mode");
  document.body.classList.add("report-mode");
  const s=state();
  // 인트로는 회차마다 한 번. 촬영·설문 왕복에서 다시 뜨면 안 된다.
  if(!INTRO_DONE) return renderIntro();
  if(!s.pc)        return renderPC();
  if(!s.pc.sex)    return renderSex();
  if(!s.face){ if(!sent("face")){ mark("face"); goAway("../photo.html?flow=lecture&v="+BUILD+srcQ+"&back="+encodeURIComponent(location.pathname+location.search)); return; } return renderStuck("얼굴 촬영","../photo.html?flow=lecture&v="+BUILD+srcQ+"&back="+encodeURIComponent(location.pathname+location.search)); }
  if(!s.diag){ if(!sent("diag")){ mark("diag"); goAway("../index.html?flow=lecture&v="+BUILD+"&g="+((state().pc||{}).sex||"")+srcQ); return; } return renderStuck("설문","../index.html?flow=lecture&v="+BUILD+"&g="+((state().pc||{}).sex||"")+srcQ); }
  renderReport();
}

// 자동 이동이 한 번 실패한 뒤의 화면 — 사람이 직접 고르게 한다
function renderStuck(what, href){
  try{ sessionStorage.setItem(AWAY,"1"); }catch(e){}   // 여기서 나가면 그것도 왕복이다

  $("reset").onclick=resetAll;
}

function resetAll(){
  [LKEY,FKEY].forEach(k=>LS.del(k));

       ["face","diag"].forEach(k=>sessionStorage.removeItem("czm_lec_sent_"+k)); }catch(e){}

// ── 결과 저장 ───────────────────────────────────────────────
// 강의 참석자가 가져갈 것이 있어야 한다. 화면으로만 보고 닫으면 남는 게 없다.
//
// 화면을 통째로 캡처(html2canvas 류)하지 않는다 — 외부 라이브러리가 하나 더 붙고,
// 긴 리포트가 잘리거나 폰트가 깨진다. 우리는 데이터를 갖고 있으니 **카드를 직접 그린다.**
// 그러면 인쇄·공유에 맞는 비율로 나오고 의존성이 0이다.
//
// iOS Safari는 <a download>가 잘 안 먹는다. 그래서 순서를 이렇게 둔다:
//   ① navigator.share(파일) — 아이폰에서 "이미지 저장"이 바로 뜬다
//   ② 다운로드 링크 — 안드로이드·데스크톱
//   ③ 새 탭으로 열기 — 둘 다 막혔을 때. 길게 눌러 저장할 수 있다
function drawCard(data){
  const W=1080, PAD=64;
  const cv=document.createElement("canvas");
  const ctx=cv.getContext("2d");
  const F="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif";
  let y=0;
  // 1차: 높이를 재기 위해 한 번 훑는다(그리지 않는다)
  const runs=[];
  const push=(t,{size=28,weight=400,color="#1E1B18",gap=14,indent=0}={})=>{
    ctx.font=`${weight} ${size}px ${F}`;
    const max=W-PAD*2-indent, words=String(t).split(" "), lines=[]; let cur="";
    for(const w of words){
      const test=cur?cur+" "+w:w;
      if(ctx.measureText(test).width>max && cur){ lines.push(cur); cur=w; } else cur=test;
    }
    if(cur) lines.push(cur);
    for(const ln of lines){ runs.push({kind:"text",t:ln,size,weight,color,indent,y:y+size}); y+=size*1.45; }
    y+=gap;
  };
  const rule=()=>{ runs.push({kind:"rule",y:y+8}); y+=26; };
  const chips=(hexes)=>{ if(!hexes||!hexes.length) return;
    const n=Math.min(10,hexes.length), s=Math.floor((W-PAD*2-9*(n-1))/n);
    runs.push({kind:"chips",hexes:hexes.slice(0,n),size:s,y:y}); y+=s+22; };

  y=PAD;
  push("추구미즘",{size:32,weight:800,color:"#C9756B",gap:6});
  push(data.pc,{size:76,weight:800,gap:8});
  push("오늘 서로 봐준 퍼스널컬러",{size:26,color:"#6B635C",gap:26});
  rule();
  push(`지금 나의 매력   ${data.have}`,{size:34,weight:700,gap:6});
  push(`추구미           ${data.want}`,{size:34,weight:700,gap:12});
  if(data.gapLine) push(data.gapLine,{size:28,color:"#6B635C",gap:24});
  rule();
  const same = data.mineBest && data.mineBest===data.wantBest;
  if(data.mineChips&&data.mineChips.length){
    push(same?`${data.pc}에 잘 받는 색 = ${data.want} 매력을 만드는 색`:`${data.pc}에 잘 받는 색`,
         {size:30,weight:700,gap:10});
    chips(data.mineChips);
    if(data.mineBest) push(data.mineBest,{size:26,color:"#6B635C",gap:22});
  }
  if(!same && data.wantChips&&data.wantChips.length){
    push(`${data.want} 매력을 만드는 색`,{size:30,weight:700,gap:10}); chips(data.wantChips);
    if(data.wantBest) push(data.wantBest,{size:26,color:"#6B635C",gap:22});
  }
  if(data.parts.length){ rule(); push("얼굴에서 읽은 것",{size:30,weight:700,gap:12});
    data.parts.forEach(t=>push("· "+t,{size:26,color:"#3A342F",gap:8})); y+=12; }
  if(data.tips.length){ rule(); push("오늘 해볼 것",{size:30,weight:700,gap:12});
    data.tips.forEach(t=>push("· "+t,{size:26,color:"#3A342F",gap:8})); y+=12; }
  rule();
  push("attractioncompany.github.io/survey-beta",{size:22,color:"#8A827B",gap:0});

  const H=Math.ceil(y+PAD);
  cv.width=W; cv.height=H;
  ctx.fillStyle="#FBFAF8"; ctx.fillRect(0,0,W,H);
  for(const r of runs){
    if(r.kind==="rule"){ ctx.strokeStyle="#EBE6E0"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(PAD,r.y); ctx.lineTo(W-PAD,r.y); ctx.stroke(); continue; }
    if(r.kind==="chips"){ let x=PAD;
      for(const h of r.hexes){ ctx.fillStyle=h; ctx.beginPath();
        ctx.roundRect(x,r.y,r.size,r.size,12); ctx.fill(); x+=r.size+9; } continue; }
    ctx.font=`${r.weight} ${r.size}px ${F}`; ctx.fillStyle=r.color;
    ctx.fillText(r.t, PAD+r.indent, r.y);
  }
  return cv;
}

function drawPage(d, idx, total){
  const W=1080, PAD=64;
  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const F="'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif";
  let y=0; const runs=[];
  const push=(t,{size=28,weight=400,color="#2B2233",gap=14,indent=0}={})=>{
    ctx.font=`${weight} ${size}px ${F}`;
    const max=W-PAD*2-indent, words=String(t).split(" "), lines=[]; let cur="";
    for(const w of words){ const test=cur?cur+" "+w:w;
      if(ctx.measureText(test).width>max && cur){ lines.push(cur); cur=w; } else cur=test; }
    if(cur) lines.push(cur);
    for(const ln of lines){ runs.push({kind:"text",t:ln,size,weight,color,indent,y:y+size}); y+=size*1.45; }
    y+=gap;
  };
  const rule=()=>{ runs.push({kind:"rule",y:y+8}); y+=26; };
  const chips=h=>{ if(!h||!h.length) return;
    const n=Math.min(10,h.length), sz=Math.floor((W-PAD*2-9*(n-1))/n);
    runs.push({kind:"chips",hexes:h.slice(0,n),size:sz,y}); y+=sz+22; };

  y=PAD;
  push("추구미즘",{size:30,weight:800,color:"#B76BA3",gap:4});
  push(`${idx} / ${total}`,{size:22,color:"#6E6478",gap:22});
  push(d.title,{size:52,weight:800,color:"#4A2B5C",gap:18});
  if(d.big){ push(d.big,{size:64,weight:800,gap:6}); if(d.cap) push(d.cap,{size:24,color:"#6E6478",gap:18}); }
  if(d.chips&&d.chips.length) chips(d.chips);
  if(d.rows&&d.rows.length){ rule();
    for(const r of d.rows){
      push(r.k,{size:23,color:"#6E6478",gap:2});
      push(r.v,{size:34,weight:700,gap:r.s?2:16});
      if(r.s) push(r.s,{size:23,color:"#6E6478",gap:16});
    } }
  if(d.sections) for(const sec of d.sections){
    rule(); push(sec.h,{size:30,weight:700,gap:10}); chips(sec.chips);
    if(sec.text) push(sec.text,{size:24,color:"#6E6478",gap:16});
  }
  if(d.paras&&d.paras.length){ if(d.rows&&d.rows.length||d.sections) rule();
    for(const t of d.paras) push(t,{size:26,color:"#3A342F",gap:14}); }
  rule();
  push("attractioncompany.github.io/survey-beta",{size:20,color:"#8E82A0",gap:0});

  const H=Math.ceil(y+PAD);
  cv.width=W; cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#F6F1FA"); g.addColorStop(1,"#EDF1F7");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const r of runs){
    if(r.kind==="rule"){ ctx.strokeStyle="rgba(74,43,92,.14)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(PAD,r.y); ctx.lineTo(W-PAD,r.y); ctx.stroke(); continue; }
    if(r.kind==="chips"){ let x=PAD;
      for(const h of r.hexes){ ctx.fillStyle=h; ctx.beginPath(); ctx.roundRect(x,r.y,r.size,r.size,12); ctx.fill(); x+=r.size+9; }
      continue; }
    ctx.font=`${r.weight} ${r.size}px ${F}`; ctx.fillStyle=r.color;
    ctx.fillText(r.t, PAD+r.indent, r.y);
  }
  return cv;
}

// 리포트 각 페이지를 한 장씩 이미지로 저장한다.
// iOS는 공유 시트에 여러 파일을 한 번에 넘길 수 있고, 나머지는 순차 다운로드.
async function savePages(pcLabel, btn){
  const pages=PAGES.filter(p=>p.draw);
  if(!pages.length){ btn.textContent="저장할 게 없어요"; return; }
  const files=[];
  for(let i=0;i<pages.length;i++){
    let cv; try{ cv=drawPage(pages[i].draw, i+1, pages.length); }
    catch(e){ console.warn("페이지 그리기 실패", i, e); continue; }
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    if(blob) files.push(new File([blob], `추구미즘_${i+1}_${pages[i].t.replace(/\s/g,"")}.png`, {type:"image/png"}));
  }
  if(!files.length){ btn.textContent="저장이 안 되네요"; return; }
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:"추구미즘 리포트"}); btn.textContent=`${files.length}장 저장했어요`; return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  for(const f of files){
    const url=URL.createObjectURL(f);
    const a=document.createElement("a"); a.href=url; a.download=f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    await new Promise(r=>setTimeout(r,250));   // 연속 다운로드가 브라우저에 막히지 않게
  }
  btn.textContent=`${files.length}장 저장했어요`;
}

async function saveCard(data, btn){
  let cv;
  try{ cv=drawCard(data); }
  catch(e){ console.warn("카드 그리기 실패", e); btn.textContent="저장이 안 되네요"; return; }
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(!blob){ btn.textContent="저장이 안 되네요"; return; }
  const name=`추구미즘_${data.pc.replace(/\s/g,"")}.png`;
  const file=new File([blob],name,{type:"image/png"});
  // ① 아이폰: 공유 시트에서 "이미지 저장"
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); btn.textContent="저장했어요"; return; }
    catch(e){ if(e && e.name==="AbortError"){ return; } }
  }
  // ② 안드로이드·데스크톱
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  btn.textContent="저장했어요";
}

// ── ④ 통합 리포트 ──────────────────────────────────────────
// 대표 지시 2026-08-17: 설문 리포트처럼 **한 장으로** 나오고,
//   "평균 대비 어떤가 → 나는 어디가 어떤 편인가 → 그래서 어떤 인상인가"까지 이어져야 한다.
//
// ⚠ "어떤 인상"은 해석이다. 개발팀이 지어내지 않는다 —
//   이론팀의 부위 리포트 엔진(part-report.js + asset-score.js)이 그 일을 한다.
//   설문 리포트 3절이 쓰는 바로 그 엔진이라, 두 화면의 말이 갈리지 않는다.
function partSection(face, surveyHaveKey){
  const P=window.__PART;
  if(!P||!P.SNAP||!face) return {html:"", narr:"", lines:[]};
  try{
    const surveyName = CZM.TYPE_NAMES[surveyHaveKey] || null;
    const m={...face.ratio, ...face.line};   // 강의 흐름은 색을 재지 않는다 → 색 지표는 결측으로 간다
    const {ref,dist}=P.SNAP;
    const one=P.AS.scoreOne(m, ref, dist);
    const rows=P.PR.buildPartRows(one, {n:dist.n});
    const overall=one.overallType && one.overallType.type;
    // 채널 수렴 — 강의 흐름은 **색을 재지 않는다.** 형태(사진) + 설문 = 최대 2채널이라
    // 확신 화법("같은 방향을 가리켜서 ~로 모였어요")이 성립하지 않는다.
    // conv를 안 넘기면 하위 호환으로 확신 화법이 나온다(part-report §17) — 반드시 넘긴다.
    // 대표 요구("판정이 아니라 방향")와 정본 v1.4 §3-3이 같은 것을 가리킨다.
    const conv=P.PR.channelConvergence({
      colorType:null, shapeType:overall, surveyType:surveyName, expressionType:null,
      overallType:overall,
      adjacentOf: one.overallType && one.overallType.adjacent ? [one.overallType.second] : [],
    });
    const narr=P.PR.summaryNarrative(rows, overall, !!one.energeticSignal, conv);
    // 대표 지적 2026-08-17: "이번엔 흐리게 보였어요"는 측정 실패인지 안 잰 건지 구분이 안 된다.
    // 강의 흐름은 색을 **일부러** 안 잰다. 못 읽은 칸은 문장을 지어내지 말고 그냥 빼고,
    // 몇 군데를 봤는지만 밝힌다. 안 보여주는 것이 모르는 말을 하는 것보다 낫다.
    const shown=rows.filter(r=>r.line);
    const list=shown.map(r=>`
      <div class="prow">
        <b>${r.part}</b>
        <div class="pline">${r.line}</div>
      </div>`).join("");
    const byPart={}; shown.forEach(r=>{ byPart[r.part]=r.line; });
    return {html:list, narr:narr||"", seen:shown.length, lines:shown.map(r=>r.line), byPart};
  }catch(e){ console.warn("부위 리포트 실패", e); return {html:"", narr:"", lines:[]}; }
}

// 측정값을 판정으로 — 대표 지시 2026-08-18 "수치를 받고 있는 부분은 판정을 내리고 보여줘야지".
// 밴드는 계약층이 소유한다(CZM.BANDS). 여기서 문턱을 만들지 않는다.
// 받침 유무 — "입꼬리이에요"처럼 조사가 어긋나는 걸 막는다
const jong = w => { const c=(w||"").charCodeAt((w||"").length-1); return c>=0xAC00&&c<=0xD7A3 ? (c-0xAC00)%28!==0 : false; };
function verdicts(r, l, q){
  const out=[];
  // 상수 밴드가 아니라 **관측 분포**로 가른다. 현 상수(jaw 7/19 등)는 14명 전원을 같은 칸에
  // 넣어버려서 누구에게나 같은 문장이 나갔다. shape-dist.json이 없으면 그 줄을 통째로 뺀다 —
  // 틀린 기준으로 말하느니 말하지 않는다.
  const D=SHAPE&&SHAPE.dist, L=SHAPE&&SHAPE.labels;
  const band=(k,v)=>(D&&L&&D[k]&&L[k]) ? CZM.bandOf(D[k], v, L[k]) : null;
  const push=(group,k,v,key,tail)=>{ const b=band(key,v); if(b) out.push({group,k,v:b.label,own:key,s:tail}); };
  // ── 황금비율 대조 (대표 지시 2026-08-18) ──────────────────
  // "평균과 비교하는 건 타인과 비교하는 것이고, 황금비율과 비교하는 건 미학 기준으로 자기 상태를 보는 것."
  // 전부 자기 얼굴 안의 비율이라 표본도 규준도 필요 없다.
  // ⚠ 실측(13명)에서 face_HW·눈사이는 **전원이 같은 방향**으로 나왔다 — 한국인 얼굴이 황금비보다
  //   계통적으로 가로가 넓다. 그래서 라벨만 두면 정보가 0이다. 수치와 어긋난 정도를 함께 낸다.
  const mouthNose = (r.mouth_w && r.nose_w) ? r.mouth_w / r.nose_w : null;
  const golds = [
    CZM.goldenOf("face_HW", r.face_HW),
    CZM.goldenOf("mouth_nose", mouthNose),
    CZM.goldenOf("lip_ul", r.lip_ul_ratio),
    CZM.goldenOf("interocular", r.interocular)
  ].filter(Boolean);
  for(const g of golds) out.push({group:"황금비율", k:g.name, v:g.label,
    s:`${g.a} 1 : ${g.b} ${g.value}  ·  황금비율은 1 : ${+g.ideal.toFixed(2)}`});

  // 헤어라인 검출이 실패하면 상안부가 이마 중간 기준으로 잡혀 **체계적으로 짧게 나온다**
  // (조사 2026-08-18: 검출O 0.173~0.314 vs 검출X 0.141~0.161 — 구간이 겹치지도 않는다).
  // 그 상태로 "하안부가 가장 길어요"를 내면 틀린 말이다. 못 잰 건 말하지 않는다.
  const hairOK = !q || q.hairline_detected !== false;
  const th = hairOK ? CZM.thirdsGolden(r.upper, r.mid, r.lower) : null;
  if(th) out.push({group:"얼굴형", k:"상 : 중 : 하", v:th.relLine,
                   s:`${th.label} · 이상적인 얼굴은 1 : 1 : 1 이에요`});
  // 중·하안부 또래 평균 대조는 뺐다(2026-08-18 대표 판단: 평균 비교는 곧 타인 비교다).
  // 같은 것을 위 황금비 3분할이 미학 기준으로 말한다 — 중복이기도 했다.
  // 좌우 대칭 (대표 지시 2026-08-18). 사람 구분력 확인됨(사람간SD/사람안SD = 3.0).
  const D2=SHAPE&&SHAPE.dist, L2=SHAPE&&SHAPE.labels;
  const av=CZM.asymVerdict(r.asym_score, D2&&D2.asym_score, L2&&L2.asym_score);
  if(av&&av.label){
    const t=r.asym_parts||{}, worst=Object.keys(t).sort((a,b)=>t[b]-t[a])[0];
    const KO={eye_outer:"눈꼬리",eye_inner:"눈머리",brow:"눈썹",nose_wing:"콧방울",
              mouth_corner:"입꼬리",jaw:"턱선",temple:"관자놀이"};
    out.push({group:"좌우 대칭", k:"좌우 균형", v:av.label,
      s: worst&&KO[worst] ? `가장 차이가 큰 곳은 ${KO[worst]}${jong(KO[worst])?"이에요":"예요"}` : "얼굴 중앙선을 기준으로 좌우를 견줬어요"});
  }
  if(l.jaw_angular_deg!=null) push("얼굴형","턱선",l.jaw_angular_deg,"jaw_angular_deg",
    `${l.jaw_angular_deg}° — 턱선이 꺾이는 정도예요`);
  if(l.chin_angle_deg!=null) push("얼굴형","턱끝",l.chin_angle_deg,"chin_angle_deg",
    `${l.chin_angle_deg}° — 턱 끝이 모이는 각도예요`);
  if(l.eye_angle!=null) push("눈","눈매",l.eye_angle,"eye_angle",
    "눈꼬리가 눈머리보다 얼마나 위에 있는지예요");
  if(l.brow_arch_deg!=null) push("눈썹","눈썹 모양",l.brow_arch_deg,"brow_arch_deg",
    `${l.brow_arch_deg}° — 눈썹 산이 솟은 정도예요`);
  if(l.mouth_corner!=null) push("입","입꼬리",l.mouth_corner,"mouth_corner",
    "입꼬리가 향하는 쪽이에요");
  return out;
}

// ── 페이지 리포트 ───────────────────────────────────────────
// 대표 지시: 한 장에 다 쏟지 말고 **페이징으로 끊어서** 읽게. 설문 리포트와 같은 얼굴로 간다.
let PAGE=0, PAGES=[];
function renderReport(){
  // 여기까지 왔으면 이 회차는 끝났다. 다음 진입은 새 사람으로 본다.
  const _first = !sessionStorage.getItem(DONE);
  try{ sessionStorage.setItem(DONE,"1"); }catch(e){}
  const s=state();
  const pcLabel=(CZM.PC8.find(t=>t.key===s.pc.pc8)||{}).label;
  const N=CZM.TYPE_NAMES, r=s.face.ratio, l=s.face.line;
  const wantName=N[s.diag.want]??s.diag.want, haveName=N[s.diag.have]??s.diag.have;
  // 부호는 WANT−HAVE다. g.D>0이면 추구미가 더 또렷하다는 뜻이니 **지금은 부드러운 쪽**이다.
  // 세 축을 다 늘어놓으면 3연속 대구가 되고(헌법 §6-1) 읽히지도 않는다 — 벌어진 순으로 두 개만.
  const g=s.diag.gap_axis||{};
  // 이어 쓸 때와 끝맺을 때 어미가 다르다 — ["…고", "…한"] 두 벌을 들고 다닌다.
  const AX=[[g.D,["부드럽고","부드러운"],["또렷하고","또렷한"]],
            [g.T,["따뜻하고","따뜻한"],["시원하고","시원한"]],
            [g.M,["어려 보이고","어려 보이는"],["성숙하고","성숙한"]]];
  const gp=AX.filter(a=>Number.isFinite(a[0])&&a[0]!==0)
    .sort((a,b)=>Math.abs(b[0])-Math.abs(a[0])).slice(0,2)
    .map(a=>a[0]>0?a[1]:a[2]);
  const gapLine = gp.length
    ? `${wantName} 매력과 비교하면 지금은 ${gp.map((w,i)=>w[i===gp.length-1?1:0]).join(" ")} 쪽이에요.`
    : "";

  const gender=s.diag.gender||null;
  // 한 사람의 결과를 한 줄로 묶어 남긴다 — 퍼스널컬러·성별·추구미·현재 매력·얼굴 측정 유무.
  // 조인 없이 바로 집계할 수 있어야 색↔타입 관계를 볼 수 있다.
  if(_first) lecTrack("lecture_report",{ pc8:s.pc.pc8, gender,
    want:s.diag.want, have:s.diag.have, face:!!(s.face&&s.face.ratio), src:SRC||null});
  // 성별 자리표시자 치환 — 표지·퍼스널컬러 페이지에서도 쓰므로 위에서 선언한다
  function gsubLater(t){ return (t||"").replace(/\{여성스러운\}/g, gender==="m"?"남성적인":"여성스러운")
                                       .replace(/\{여성스러움\}/g, gender==="m"?"남성스러움":"여성스러움"); }                       // 설문에서 받은 값(index.html이 chugu_diag에 넣는다)
  const part=partSection(s.face, s.diag.have);
  const col=colorSection(s.diag.want, pcLabel), tips=pickTips(g, wantName, pcLabel, gender);
  const vs=verdicts(r,l,s.face.quality);
  const _av=CZM.asymVerdict(r.asym_score, SHAPE&&SHAPE.dist&&SHAPE.dist.asym_score,
                            SHAPE&&SHAPE.labels&&SHAPE.labels.asym_score);
  const asymCare = !!(_av && _av.care);
  const byGroup=g2=>vs.filter(x=>x.group===g2);
  const vRow=x=>`<div class="vrow"><div class="vk">${x.k}</div>
      <div><div class="vv">${esc(x.v)}</div>${x.s?`<div class="vs">${esc(x.s)}</div>`:``}</div></div>`;

  PAGES=[];
  // ① 오늘의 진단 — 지금 나의 매력과 추구미를 **구미 둘로 나란히** 보여준다.
  //    이름만 두 줄 적으면 뭐가 다른지 안 읽힌다. 각각이 어디서 나온 판정인지도 밝힌다.
  const HAVE_SRC="../bg/char_"+s.diag.have+".png", WANT_SRC="../bg/char_"+s.diag.want+".png";
  PAGES.push({t:"지금 나의 매력과 나의 추구미",
    draw:{title:"지금 나의 매력과 나의 추구미",
          rows:[{k:"지금 나의 매력",v:haveName,s:"퍼스널컬러와 나의 이목구비, 행동 등을 종합한 결과예요"},
                {k:"추구미",v:wantName,s:"설문을 통해 파악한, 내가 가지고 싶은 매력이에요"}],
          paras:gapLine?[gapLine]:[]},
    html:`
    <div class="twin">
      <div class="cover twin-box">
        <p class="stack-lab">지금 나의 매력</p>
        <img src="${HAVE_SRC}" alt="" onerror="this.style.visibility='hidden'">
        <p class="stack-name">${esc(haveName)}</p>
        <p class="stack-desc">퍼스널컬러와 나의 이목구비, 행동 등을 종합한 결과예요.</p>
      </div>
      <div class="twin-arrow">↓</div>
      <div class="cover twin-box">
        <p class="stack-lab">추구미</p>
        <img src="${WANT_SRC}" alt="" onerror="this.style.visibility='hidden'">
        <p class="stack-name">${esc(wantName)}</p>
        <p class="stack-desc">설문을 통해 파악한, 내가 가지고 싶은 매력이에요.</p>
      </div>
    </div>`});

  // ② 내 퍼스널컬러와 그 매력 — 퍼스널컬러는 8타입과 1:1이다. 이름만 주면 뜻이 안 온다.
  const pcKey=(CZM.PC8.find(t=>t.label===pcLabel)||{}).key;
  const pcType=pcKey?N[pcKey]:null, pcTd=pcKey?(TDESC&&TDESC.types||{})[pcKey]:null;
  PAGES.push({t:"내 퍼스널컬러",
    draw:{title:"내 퍼스널컬러", big:pcLabel,
          cap:pcType?pcLabel+"은 "+pcType+" 매력의 색이에요":"",
          chips:col&&col.mineHex?col.mineHex:[],
          paras:[col&&col.mine?col.mine.best:null,
                 pcTd?gsubLater(pcTd.one):null].filter(Boolean)},
    html:`
    <div class="card">
      <h2>오늘 서로 봐준 퍼스널컬러</h2>
      <p class="lead" style="font-size:30px">${esc(pcLabel)}</p>
      ${col&&col.mineChips?col.mineChips:""}
      ${col&&col.mine?`<p class="note">${esc(col.mine.best)}</p>`:``}
    </div>
    ${pcType?`<div class="card"><h2>${esc(pcLabel)}은 어떤 매력인가요</h2>
      <p class="lead" style="font-size:24px;margin-bottom:var(--sp-2)">${esc(pcType)}</p>
      ${pcTd?`<p style="font-size:var(--fs-body);line-height:1.8">${esc(gsubLater(pcTd.one))}</p>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8;margin-top:var(--sp-3)">${esc(gsubLater(pcTd.desc))}</p>`:``}
      <p class="note">퍼스널컬러 8가지는 매력 8가지와 하나씩 짝을 이뤄요.</p></div>`:``}`});

  // ② 내 추구미가 뭔지 — 설문 결과를 설명 없이 이름만 던지면 아무 뜻도 안 된다(대표 지적 2026-08-18).
  //    문구는 이론 자산(index.html TYPES 전사본)에서만 가져온다. 여기서 새로 쓰지 않는다.
  const td = TDESC && TDESC.types || {};
  const gsub = gsubLater;
  const tw = td[s.diag.want], th_ = td[s.diag.have];
  if(tw) PAGES.push({t:"내 추구미",
    draw:{title:"내 추구미", big:wantName,
          paras:[gsub(tw.one), gsub(tw.desc),
                 "지키면 좋은 것 — "+(gender==="m"&&tw.keepM?tw.keepM:tw.keep),
                 "스타일 — "+(gender==="m"&&tw.styleM?tw.styleM:tw.style)]
                 .concat(th_&&s.diag.have!==s.diag.want?["지금 나의 매력 — "+haveName+". "+gsub(th_.desc)]:[])},
    html:`
    <div class="card">
      <h2>추구미</h2>
      <p class="lead" style="font-size:26px;margin-bottom:var(--sp-3)">${esc(wantName)}</p>
      <p style="font-size:var(--fs-body);line-height:1.8">${esc(gsub(tw.one))}</p>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8;margin-top:var(--sp-3)">${esc(gsub(tw.desc))}</p>
    </div>
    <div class="card"><h2>${esc(wantName)} 쪽으로 가려면</h2>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8">
      · <b>지키면 좋은 것</b> — ${esc(gender==="m"&&tw.keepM?tw.keepM:tw.keep)}<br>
      · <b>스타일</b> — ${esc(gender==="m"&&tw.styleM?tw.styleM:tw.style)}</p></div>
    ${th_&&s.diag.have!==s.diag.want?`<div class="card"><h2>지금 나의 매력 — ${esc(haveName)}</h2>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8">${esc(gsub(th_.desc))}</p></div>`:``}`});

  // ⑤ 지금 가진 매력요소와 추구미의 비교 — 두 좌표가 어느 축에서 얼마나 벌어졌는지.
  //    "격차"를 결핍으로 읽히게 두지 않는다. 이미 가진 것을 먼저 적고 방향을 뒤에 붙인다.
  const AXROW=[["부드러움 ↔ 또렷함", g.D, "또렷한 쪽으로", "부드러운 쪽으로"],
               ["따뜻함 ↔ 시원함",   g.T, "시원한 쪽으로", "따뜻한 쪽으로"],
               ["어려 보임 ↔ 성숙함", g.M, "성숙한 쪽으로", "어려 보이는 쪽으로"]]
    .filter(a=>Number.isFinite(a[1]))
    .map(a=>({k:a[0], v:Math.abs(a[1])<0.15?"이미 가까워요":(a[1]>0?a[2]:a[3]),
              s:Math.abs(a[1])<0.15?"이 축은 손댈 게 없어요":""}));
  if(AXROW.length) PAGES.push({t:"지금과 추구미, 어디가 다른가",
    draw:{title:"지금과 추구미, 어디가 다른가",
          rows:[{k:"지금",v:haveName},{k:"추구미",v:wantName}].concat(AXROW),
          paras:[gapLine, "벌어진 축이 곧 오늘 손볼 자리예요. 이미 가까운 축은 그대로 두면 돼요."].filter(Boolean)},
    html:`
    <div class="card">
      <div class="vs2 small">
        <div class="vs2-col"><img src="${HAVE_SRC}" alt="" onerror="this.style.visibility='hidden'">
          <p class="vs2-name">${esc(haveName)}</p></div>
        <div class="vs2-arrow">→</div>
        <div class="vs2-col"><img src="${WANT_SRC}" alt="" onerror="this.style.visibility='hidden'">
          <p class="vs2-name">${esc(wantName)}</p></div>
      </div>
      ${AXROW.map(vRow).join("")}
      <p class="note">벌어진 축이 곧 오늘 손볼 자리예요. 이미 가까운 축은 그대로 두면 돼요.</p>
    </div>`});

  // ③ 부위별 페이지 — 얼굴형 / 눈 / 코 / 입을 각각 한 쪽씩. 관련된 것끼리 모으고
  //    그 부위의 해설을 같은 쪽에 붙인다(대표 지시 2026-08-18 ④).
  //    한 쪽에 한 부위만 담으면 분량이 짧아져 스크롤도 사라진다(②).
  const P=part.byPart||{};
  const pick=(...names)=>vs.filter(x=>names.includes(x.k));
  const PART_PAGES=[
    {t:"얼굴형", rows:pick("얼굴 가로 : 세로","상 : 중 : 하","턱선","턱끝","좌우 균형"), line:P["윤곽"]},
    {t:"눈",     rows:pick("눈매","눈 길이 : 눈 사이","눈썹 모양"), line:[P["눈"],P["눈썹"]].filter(Boolean).join(" ")},
    {t:"코",     rows:pick("코 : 입 너비"), line:P["코"]},
    {t:"입",     rows:pick("입꼬리","윗입술 : 아랫입술"), line:P["입"]},
  ];
  for(const pg of PART_PAGES){
    if(!pg.rows.length && !pg.line) continue;
    PAGES.push({t:pg.t,
      draw:{title:pg.t, rows:pg.rows.map(x=>({k:x.k,v:x.v,s:x.s})), paras:pg.line?[pg.line]:[]},
      html:`
      ${pg.rows.length?`<div class="card">${pg.rows.map(vRow).join("")}</div>`:``}
      ${pg.line?`<div class="card"><h2>${esc(pg.t)}${jong(pg.t)?"이":"가"} 주는 인상</h2>
        <p style="font-size:var(--fs-body);line-height:1.8">${pg.line}</p></div>`:``}`});
  }

  // ⑤ 색
  // 진단받은 색과 추구미 색이 같은 칸일 때가 있다(예: 겨울 스트롱 = 세련된).
  // 그걸 두 카드로 나눠 똑같은 색을 두 번 내면 유저는 뭐가 다른지 찾다가 지친다. 합쳐서 한 번만.
  const sameColor = col && col.mine && col.want && col.mine.best===col.want.best;
  if(col&&(col.mine||col.want)) PAGES.push({t:"색 이야기",
    draw:{title:"색 이야기",
          sections:[col.mine?{h:(sameColor?pcLabel+"에 잘 받는 색 = "+wantName+" 매력을 만드는 색":pcLabel+"에 잘 받는 색"),
                              chips:col.mineHex, text:col.mine.best}:null,
                    (!sameColor&&col.want)?{h:wantName+" 매력을 만드는 색", chips:col.wantHex, text:col.want.best}:null
                   ].filter(Boolean)},
    html:`
    ${sameColor?`<div class="card"><h2>${esc(pcLabel)}에 잘 받는 색 = ${esc(wantName)} 매력을 만드는 색</h2>${col.mineChips}
      <p class="note">${esc(col.mine.best)}${col.mine.second?`<br>곁들이면 좋은 색: ${esc(col.mine.second)}`:``}${col.mine.accessory?`<br>소품: ${esc(col.mine.accessory)}`:``}</p>
      <p class="note">두 색이 같은 칸이에요. 색은 이미 맞춰져 있으니 다른 데를 손보면 돼요.</p></div>`
    :`${col.mine?`<div class="card"><h2>${esc(pcLabel)}에 잘 받는 색</h2>${col.mineChips}
      <p class="note">${esc(col.mine.best)}${col.mine.second?`<br>곁들이면 좋은 색: ${esc(col.mine.second)}`:``}${col.mine.accessory?`<br>소품: ${esc(col.mine.accessory)}`:``}</p></div>`:``}
    ${col.want?`<div class="card"><h2>${esc(wantName)} 매력을 만드는 색</h2>${col.wantChips}
      <p class="note">${esc(col.want.best)}</p></div>`:``}`}`});

  // ⑥ 시도 + 주의
  const TIPS_PER_PAGE=2;
  for(let i=TIPS_PER_PAGE;i<tips.length;i+=TIPS_PER_PAGE){
    const chunk=tips.slice(i,i+TIPS_PER_PAGE);
    PAGES.push({t:"오늘 해볼 것 "+(Math.floor(i/TIPS_PER_PAGE)+1),
      draw:{title:"오늘 해볼 것", paras:chunk.map(t=>"· "+t.tip+(t.why?" ("+t.why+")":""))},
      html:chunk.map(t=>`<div class="tip"><div class="tip-t">${esc(t.tip)}</div>
        ${t.why?`<div class="tip-w">${esc(t.why)}</div>`:``}
        ${t.caution?`<div class="tip-c">${esc(t.caution)}</div>`:``}</div>`).join("")});
  }
  const tipsHead=tips.slice(0,TIPS_PER_PAGE);
  PAGES.push({t:tips.length?"오늘 해볼 것":"색은 이렇게",
    draw:{title:tips.length?"오늘 해볼 것":"색은 이렇게",
          paras:tipsHead.map(t=>"· "+t.tip+(t.why?" ("+t.why+")":""))},
    html:`
    ${tipsHead.map(t=>`<div class="tip"><div class="tip-t">${esc(t.tip)}</div>
      ${t.why?`<div class="tip-w">${esc(t.why)}</div>`:``}
      ${t.caution?`<div class="tip-c">${esc(t.caution)}</div>`:``}</div>`).join("")}
    <div class="card"><h2>색은 이렇게</h2>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8">
      ${col&&col.mine?`· <b>얼굴 가까이</b>(${gender&&gender!=="f"?"셔츠 목선·스카프·모자":"립·스카프·상의 목선"})엔 잘 받는 색을 두세요. 얼굴이 사는 자리예요.<br>`:``}
      ${col&&col.want&&!sameColor?`· <b>얼굴에서 먼 곳</b>(하의·가방·신발)엔 ${esc(wantName)} 색을 써보세요. 얼굴은 편하고, 전체 느낌은 ${esc(wantName)} 쪽으로 가요.<br>`:``}
      · 한 번에 하나만 바꿔보세요. 여러 개를 같이 바꾸면 어느 게 통했는지 몰라요.</p></div>
    ${asymCare?`<div class="card"><h2>좌우 균형은 이렇게</h2>
      <p class="note" style="font-size:14.5px;color:var(--ink);line-height:1.8">
      · 한쪽으로만 씹거나, 턱을 괴거나, 늘 같은 쪽으로 자는 습관이 있는지 한번 살펴보세요.<br>
      · 정면으로 한 번 더 찍어보면 더 정확해요.<br>
      · 좌우가 완전히 같은 얼굴은 없어요.</p></div>`:``}
    <div class="card"><h2>다만 이건 주의하세요</h2>
      <p class="note" style="font-size:14px;line-height:1.8">
      · 사진은 조명과 각도에 따라 값이 조금씩 달라져요. 오늘 한 장의 결과예요.</p></div>`});

  const CARD={pc:pcLabel, have:haveName, want:wantName, gapLine,
    mineChips:col&&col.mineHex?col.mineHex:[], mineBest:col&&col.mine?col.mine.best:"",
    wantChips:col&&col.wantHex?col.wantHex:[], wantBest:col&&col.want?col.want.best:"",
    parts:(part.lines||[]).concat(vs.map(x=>x.k.includes(":")?x.v:`${x.k}: ${x.v}`)),
    tips:tips.map(t=>t.tip)};

  // 대표 확정 순서(2026-08-18): 오늘의 진단 → 퍼스널컬러 → 얼굴·이목구비 → 추구미 → 비교 → 오늘 해볼 것
  const ORDER=["지금 나의 매력과 나의 추구미","내 퍼스널컬러","얼굴형","눈","코","입","부위별로 보면",
               "내 추구미","지금과 추구미, 어디가 다른가","색 이야기","오늘 해볼 것","오늘 해볼 것 2","오늘 해볼 것 3","색은 이렇게"];
  PAGES.sort((a,b)=>{ const i=ORDER.indexOf(a.t), j=ORDER.indexOf(b.t);
    return (i<0?99:i)-(j<0?99:j); });

  PAGE=Math.min(PAGE, PAGES.length-1);
  paint(CARD);
}

function paint(CARD){
  const p=PAGES[PAGE], last=PAGE===PAGES.length-1;
  app.innerHTML = `<div class="shell">
    <div class="shell-top">
      <div class="hd"><h1>추구미즘</h1><small>${PAGE+1} / ${PAGES.length}</small></div>
      <div class="dots">${PAGES.map((_,i)=>`<i class="${i===PAGE?"on":""}"></i>`).join("")}</div>
      <p class="ptitle">${esc(p.t)}</p>
    </div>
    <div class="shell-body" id="pbody">${p.html}</div>
    <div class="shell-btm">
      <div class="nav">
        ${PAGE>0?`<button class="btn ghost" id="prev">이전</button>`:`<span></span>`}
        ${last?`<button class="btn" id="save">리포트 전체 저장하기</button>`
              :`<button class="btn" id="next">다음</button>`}
      </div>
      ${last?`<button class="btn quiet" id="back">처음부터 다시</button>`:``}
    </div>
  </div>`;
  const go=d=>{ PAGE=Math.max(0,Math.min(PAGES.length-1,PAGE+d)); paint(CARD); window.scrollTo({top:0,behavior:"instant"}); };
  $("next")&&($("next").onclick=()=>go(1));
  $("prev")&&($("prev").onclick=()=>go(-1));
  $("back")&&($("back").onclick=resetAll);
  $("save")&&($("save").onclick=e=>{ const b=e.currentTarget; b.textContent="만드는 중…"; savePages(CARD.pc,b); });
  // 좌우로 쓸어 넘기기 — 폰에서 버튼까지 내려가지 않아도 된다
  let x0=null;
  app.ontouchstart=e=>{ x0=e.touches[0].clientX; };
  app.ontouchend=e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>60) go(dx<0?1:-1); };
}

// 규준 자료는 조사 산출물이 원천이다. 여기 숫자를 복사하지 않는다 —
// 복사하면 조사가 갱신돼도 화면은 옛 수치를 계속 보여준다.
Promise.all([
  // 캐시 무력화 — 054에서 낡은 모듈을 재고 "고쳤다"고 보고하는 사고가 났다.
  // "?v=379f44d"는 배포 시 커밋 해시로 치환되고(deploy_survey.sh), 로컬은 매번 새 값이다.
  import(`./asset-score.js${MODV}`), import(`./part-report.js${MODV}`),
  fetch("dist-snapshot.json").then(r=>r.ok?r.json():null).catch(()=>null),
]).then(([AS,PR,SNAP])=>{ window.__PART={AS,PR,SNAP}; }).catch(e=>console.warn("부위 엔진 로드 실패",e))
