<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>추구미 정하기 · 추구미즘</title>
<!--
  추구미 정하기 (대표 확정 2026-08-24 — 진단 분리)
  최초 진단은 '지금의 나'만 잰다. 갈 곳은 필요해질 때 여기서 정한다.

  이 화면이 푸는 불편: 첫 진단에서 "되고 싶은 모습"을 먼저 물으면,
  아직 자기 좌표도 모르는 상태에서 추구미부터 상상해야 했다.
  이제 지금의 나를 본 다음에, 갈 곳만 따로 고른다.

  길은 둘이다 — 문항으로 찾거나, 아는 사람은 바로 고르거나.
  두 길 다 끝은 같다: index.html이 좌표 지도가 붙은 결과지를 그린다.
  ※ 추구미 저장·좌표·격차 계산은 전부 index.html이 한다. 여기서는 넘기기만 한다
    (저장 자리가 둘이 되면 둘이 어긋난다).

  계측: 진입(want_setup_open) · 길 선택(want_setup_choose{path}) 두 줄만 남긴다.
        확정(want_set)은 index.html이 남긴다 — 실제로 저장되는 자리가 거기다.
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="czm-ui.css">
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
  font:16px/1.6 'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
  background:radial-gradient(circle at 12% 6%,rgba(242,169,196,.38) 0%,rgba(242,169,196,0) 42%),
             radial-gradient(circle at 92% 22%,rgba(156,200,232,.32) 0%,rgba(156,200,232,0) 46%),
             radial-gradient(circle at 50% 105%,rgba(185,175,209,.30) 0%,rgba(185,175,209,0) 55%),var(--bg);
  background-attachment:fixed}
html,body{overscroll-behavior-y:none}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
.lead{font-size:15px;line-height:1.7;color:var(--sub);margin:0 0 var(--sp-4)}
.lead b{color:var(--ink)}
/* 길 두 개 — 세로로 크게. 탭 하나로 갈리는 자리라 작게 만들 이유가 없다 */
.path{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.7);
  border-radius:18px;padding:18px 18px 16px;margin-bottom:var(--sp-3);color:var(--ink);
  background:rgba(255,255,255,.56);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  box-shadow:0 6px 20px rgba(74,43,92,.10);cursor:pointer}
.path:active{background:rgba(255,255,255,.86)}
.path .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.path .m{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
/* 8타입 카드 — 색이 먼저 눈에 들어와야 고를 수 있다 */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:13px 12px;
  background:var(--card);color:var(--ink);cursor:pointer;min-height:96px}
.tcard:active{border-color:var(--accent)}
.tcard .dot{width:22px;height:22px;border-radius:999px;display:block;margin-bottom:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tcard .n{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.tcard .o{display:block;font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:4px}
.back{background:none;border:0;color:var(--sub);font-size:13.5px;padding:0;margin:0 0 var(--sp-3);cursor:pointer}
</style>
</head>
<body>
<div class="screen" id="app"></div>

<script src="czm-core.js"></script>
<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DIAG = null, DESC = null, GENDER = "f";
try{ DIAG = JSON.parse(localStorage.getItem(CZM.KEYS.diag) || "null"); }catch(e){}
if(DIAG && DIAG.gender) GENDER = DIAG.gender;

// 성별 치환 — index.html과 같은 규칙(치환 규칙이 갈리면 같은 문장이 화면마다 달라진다)
const g = t => String(t||"").replace(/\{여성스러운\}/g, GENDER==="m"?"온화한":"여성스러운")
                            .replace(/\{여성스러움\}/g, GENDER==="m"?"부드러운 온화함":"여성스러움");

// 계측 — index.html의 events와 같은 자리에 같은 모양으로 남긴다
const SB_URL="https://qngylynylgqlbidvtbci.supabase.co";
const SB_KEY="sb_publishable_bGVbZ31O7OX_rnkLVb0i5Q_SDa8JEri";
function track(event, props){
  if(/^(localhost|127\.|$)/.test(location.hostname) || window.__CHUGU_DEV) return;
  let uid=null; try{ uid=localStorage.getItem("czm_uid"); }catch(e){}
  fetch(`${SB_URL}/rest/v1/events`,{method:"POST",keepalive:true,
    headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`},
    body:JSON.stringify({user_id:uid, event, props:props||{}})}).catch(()=>{});
}

const shell = (body, btm) =>
  `<div class="screen-top"><h1>추구미 정하기</h1></div>
   <div class="screen-body">${body}</div>
   <div class="screen-btm">${btm}</div>`;

function renderNoDiag(){
  app.innerHTML = shell(
    `<p class="lead">갈 곳은 지금 어디 있는지를 알아야 정해집니다. 먼저 지금의 나부터 재요 — 3~4분이면 끝나요.</p>`,
    `<a class="btn" href="../index.html" style="display:block;text-align:center;text-decoration:none">지금의 나 측정하기</a>`);
}

function renderPick(){
  track("want_setup_open", {has_want: !!(DIAG && DIAG.want)});
  const hName = DIAG && DIAG.have ? (CZM.TYPE_NAMES[DIAG.have] || DIAG.have) : null;
  const now = hName
    ? `지금은 <b>${esc(hName)}</b> 쪽에 서 있어요. 어디로 갈지 정하면 여기서 거기까지 가는 지도가 나옵니다.`
    : `어디로 갈지 정하면 여기서 거기까지 가는 지도가 나옵니다.`;
  app.innerHTML = shell(
    `<p class="lead">${now}</p>
     <button class="path" id="pTest">
       <div class="t">문항으로 찾기</div>
       <div class="m">끌리는 사진과 색을 고르면 어느 쪽인지 나와요. 7문항 · 1분쯤</div>
     </button>
     <button class="path" id="pSelf">
       <div class="t">직접 고르기</div>
       <div class="m">되고 싶은 모습이 이미 있다면 여기서 바로 골라요. 나중에 바꿔도 됩니다.</div>
     </button>`,
    `<a class="btn ghost" href="home.html" style="display:block;text-align:center;text-decoration:none">나중에 하기</a>`);
  document.getElementById("pTest").onclick = () => {
    track("want_setup_choose", {path:"test"});
    location.href = "../index.html?flow=want";
  };
  document.getElementById("pSelf").onclick = () => {
    track("want_setup_choose", {path:"self"});
    renderTypes();
  };
}

async function renderTypes(){
  if(!DESC){
    try{ DESC = await fetch("type-desc.json",{cache:"no-store"}).then(r=>r.ok?r.json():null); }catch(e){}
  }
  // 이름·색·한 줄은 이론 자산(type-desc.json)에서 읽는다. 여기서 짓지 않는다.
  const T = (DESC && DESC.types) || null;
  const cards = CZM.TYPE_KEYS.map(k => {
    const t = T ? T[k] : null;
    const nm = esc((t && t.name) || CZM.TYPE_NAMES[k] || k);
    return `<button class="tcard" data-k="${k}">
      <span class="dot" style="background:${(t && t.color) || "#B76BA3"}"></span>
      <span class="n">${nm}</span>
      <span class="o">${esc(g((t && t.one) || ""))}</span>
    </button>`;
  }).join("");
  app.innerHTML = shell(
    `<button class="back" id="bk">← 다른 방법으로</button>
     <p class="lead">되고 싶은 모습을 하나 골라주세요. 고른 다음에도 언제든 바꿀 수 있어요.</p>
     <div class="tgrid">${cards}</div>`,
    `<a class="btn ghost" href="home.html" style="display:block;text-align:center;text-decoration:none">나중에 하기</a>`);
  document.getElementById("bk").onclick = renderPick;
  document.querySelectorAll(".tcard").forEach(b => {
    b.onclick = () => {
      // 저장·좌표·격차는 index.html이 한다. 여기서는 고른 값만 넘긴다.
      location.href = "../index.html?view=report&want=" + encodeURIComponent(b.dataset.k);
    };
  });
}

// 지금의 나가 없으면 고를 기준이 없다 — 진단부터 보낸다.
if(DIAG && DIAG.have) renderPick(); else renderNoDiag();
</script>
</body>
</html>
